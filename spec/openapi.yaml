        standard_price:
          $ref: '#/components/schemas/Amount'
        premium_price:
          $ref: '#/components/schemas/Amount'
        valid_from:
          description: Date and time from which these prices apply
          type:
            - string
            - 'null'
          format: date-time
      type: object
    Sms:
      description: >-
        SMS sending of the account: one message to one or more recipients (`GET
        /api/v3/sms/{sms_id}/messages`)
      required:
        - id
        - quality
        - status
        - sender
        - message
        - send_from
        - date_approved
        - stop_date
        - sms_count
        - date_created
      properties:
        id:
          type: integer
        quality:
          description: 'Delivery quality: `STANDARD` or `PREMIUM`'
          type: string
        status:
          description: >-
            Status of the sending: `DRAFT` (not confirmed), `PROCESSING` (being
            sent), `ACCOMPLISHED` (all the messages sent) or `CANCELLED`
            (sending stopped)
          type: string
        sender:
          description: Sender name, for the `PREMIUM` quality
          type:
            - string
            - 'null'
        message:
          type:
            - string
            - 'null'
        send_from:
          description: Date and time from which the messages are sent
          type:
            - string
            - 'null'
          format: date-time
        date_approved:
          description: Date and time the sending was confirmed; null for a `DRAFT`
          type:
            - string
            - 'null'
          format: date-time
        stop_date:
          description: Date and time the sending was stopped; null if it was not
          type:
            - string
            - 'null'
          format: date-time
        sms_count:
          description: >-
            Number of SMS the message takes for each recipient: a long text is
            split into several SMS
          type:
            - integer
            - 'null'
        date_created:
          type: string
          format: date-time
      type: object
    SslCertificateApproverEmails:
      description: >-
        Email addresses that can approve the validation of a domain name
        (`approver_email` of the certificate)
      required:
        - domain_name
        - approver_emails
      properties:
        domain_name:
          type: string
        approver_emails:
          description: >-
            Addresses `admin`, `webmaster`, `hostmaster`, `postmaster` and
            `administrator` at the domain name and at each of its parent domains
          type: array
          items:
            type: string
      type: object
    SslCertificateCanReissue:
      description: Whether a certificate can be reissued now
      required:
        - ssl_certificate_id
        - can_reissue
      properties:
        ssl_certificate_id:
          type: integer
        can_reissue:
          description: >-
            Whether the certificate can be reissued now (`POST
            /api/v3/ssl-certificates/{ssl_certificate_id}/reissues`): it
            includes reissues, its purchase is active with no operation running
            and no other reissue is in progress
          type: boolean
      type: object
    SslCertificateExportFormat:
      description: >-
        Format in which a certificate and its keys can be exported (`POST
        /api/v3/ssl-certificates/{ssl_certificate_id}/exports`)
      required:
        - format
        - name
        - description
        - filename
        - available
        - requires_passphrase
      properties:
        format:
          description: >-
            Code of the format, for `format` of the export: one of `PK`, `CERT`,
            `CERT_PEM`, `CA`, `CA_PEM`, `CERT_CA`, `CERT_CA_PEM`, `PK_CERT_CA`,
            `MULTI_ZIP`, `HASH_SHA256` or `HASH_SHA512`
          type: string
        name:
          type: string
        description:
          type:
            - string
            - 'null'
        filename:
          description: Name of the exported file, for example `certificate.pem`
          type: string
        available:
          description: >-
            Whether the certificate can be exported in this format; otherwise
            the export is rejected with 409
          type: boolean
        requires_passphrase:
          description: >-
            Whether the format takes `passphrase` of the export request, which
            protects the file: true for `PK` and `PK_CERT_CA`
          type: boolean
      type: object
    SslCertificateExport:
      description: >-
        File with the certificate or its keys in the requested format, encoded
        in base64
      required:
        - format
        - filename
        - content_base64
      properties:
        format:
          description: >-
            Code of the exported format, as in the request; `MULTI_ZIP` when the
            file is a ZIP archive
          type: string
        filename:
          description: Name to give to the file, for example `certificate.pem`
          type: string
        content_base64:
          description: Content of the file, encoded in base64
          type: string
      type: object
    SslCertificateKey:
      description: CSR of a certificate
      required:
        - ssl_certificate_id
        - csr
      properties:
        ssl_certificate_id:
          type: integer
        csr:
          description: CSR of the certificate, in PEM format (the custom one, when set)
          type:
            - string
            - 'null'
      type: object
    SslCertificateKeys:
      description: >-
        Keys of a certificate in PEM format: CSR, private key, issued
        certificate and certificate of the intermediate authority
      required:
        - ssl_certificate_id
        - csr
        - private_key
        - public_key
        - certificate_authority
      properties:
        ssl_certificate_id:
          type: integer
        csr:
          description: CSR of the certificate, in PEM format (the custom one, when set)
          type:
            - string
            - 'null'
        private_key:
          description: >-
            Private key of the certificate, in PEM format (the custom one, when
            set)
          type:
            - string
            - 'null'
        public_key:
          description: >-
            Certificate issued by the certification authority, in PEM format;
            empty until it is issued
          type:
            - string
            - 'null'
        certificate_authority:
          description: >-
            Certificate of the intermediate certification authority, in PEM
            format; empty until the certificate is issued
          type:
            - string
            - 'null'
      type: object
    SslCertificate:
      description: >-
        SSL or code signing certificate of the account, with its validation data
        and its administrative contact
      required:
        - ssl_certificate_id
        - purchase_id
        - domain_name
        - cn_type
        - validation_type
        - san_max
        - can_reissue
        - validation_method
        - valid_to
        - csr_md5_hash
        - csr_sha256_hash
        - certificate_status
        - approver_email
        - admin_first_name
        - admin_last_name
        - admin_organization
        - admin_role
        - admin_email
        - admin_phone_cc
        - admin_phone_number
        - admin_address
        - admin_city
        - admin_state
        - admin_postal_code
        - admin_country
      properties:
        ssl_certificate_id:
          type: integer
        purchase_id:
          description: >-
            Id of the purchase of the certificate (`GET
            /api/v3/purchases/{purchase_id}`)
          type: integer
        domain_name:
          type:
            - string
            - 'null'
        cn_type:
          description: >-
            Type of the common name: `NORMAL` (a single name) or `WILDCARD` (a
            wildcard name, for the subdomains)
          type:
            - string
            - 'null'
        validation_type:
          description: >-
            Validation level: `DV` (domain validation), `OV` (organization
            validation) or `EV` (extended validation)
          type:
            - string
            - 'null'
        san_max:
          description: >-
            Maximum number of additional names (SAN, Subject Alternative Names)
            the certificate can include
          type: integer
        can_reissue:
          description: >-
            Whether the certificate includes reissues; `GET
            /api/v3/ssl-certificates/{ssl_certificate_id}/can-reissue` tells
            whether one can start now
          type: boolean
        validation_method:
          description: >-
            How the domain is validated: `APPROVER_EMAIL` (by email to
            `approver_email`) or `DNS` (with a CNAME record that we add to the
            zone of the domain, see `csr_md5_hash`)
          type:
            - string
            - 'null'
        valid_to:
          description: Expiry of the certificate, at the end of the day (Italian time)
          type:
            - string
            - 'null'
          format: date-time
        csr_md5_hash:
          description: >-
            MD5 hash of the CSR for the DNS validation, in uppercase
            hexadecimal: the name of the CNAME record is `_` followed by this
            hash; null without a DNS validation
          type:
            - string
            - 'null'
        csr_sha256_hash:
          description: >-
            SHA-256 hash of the CSR for the DNS validation, in uppercase
            hexadecimal split in two by a dot: the destination of the CNAME
            record starts with it; null without a DNS validation
          type:
            - string
            - 'null'
        certificate_status:
          description: >-
            Status of the certificate at the certification authority, for
            example `Issued`, `Expired`, `Rejected` or `Revoked`
          type:
            - string
            - 'null'
        approver_email:
          description: >-
            Address that receives the request to approve the validation of the
            domain, with the `APPROVER_EMAIL` method (see `GET
            /api/v3/ssl-certificates/approver-emails`)
          type:
            - string
            - 'null'
          format: email
        admin_first_name:
          description: First name of the administrative contact of the certificate
          type:
            - string
            - 'null'
        admin_last_name:
          description: Last name of the administrative contact
          type:
            - string
            - 'null'
        admin_organization:
          description: Organization of the administrative contact
          type:
            - string
            - 'null'
        admin_role:
          description: >-
            Role of the administrative contact: `Business Owner`, `Website
            Owner`, `President` or `Company Director`
          type:
            - string
            - 'null'
        admin_email:
          description: Email of the administrative contact
          type:
            - string
            - 'null'
          format: email
        admin_phone_cc:
          description: >-
            International dialling code of the phone of the administrative
            contact, for example `39`
          type:
            - string
            - 'null'
        admin_phone_number:
          description: >-
            Phone number of the administrative contact, without the dialling
            code
          type:
            - string
            - 'null'
        admin_address:
          description: Address of the administrative contact
          type:
            - string
            - 'null'
        admin_city:
          description: City of the administrative contact
          type:
            - string
            - 'null'
        admin_state:
          description: State or province of the administrative contact
          type:
            - string
            - 'null'
        admin_postal_code:
          description: Postal code of the administrative contact
          type:
            - string
            - 'null'
        admin_country:
          description: >-
            Country of the administrative contact, as ISO 3166-1 alpha-2 code
            (for example `IT`)
          type:
            - string
            - 'null'
      type: object
    TaskStatus:
      required:
        - status_code
        - status_name
      properties:
        status_code:
          description: >-
            Status code: `TO_EXECUTE` (queued), `MACHINE` (running), `WAIT`
            (paused), `HUMAN_INTERVENTION` (checked by an operator), `ASK_USER`
            (waiting for data, `POST /api/v3/tasks/{task_id}/data`), `DONE`
            (completed) or `FAIL` (failed)
          type: string
        status_name:
          description: >-
            Name of the status for the customers, in Italian, as in the control
            panel (for example `In verifica` for `HUMAN_INTERVENTION`)
          type: string
      type: object
    Task:
      description: >-
        Operation on a purchase that goes on in the background, with its status
        and progress (`GET /api/v3/tasks/{task_id}`)
      required:
        - task_id
        - purchase_id
        - task_status
        - executed_instructions
        - total_instructions
        - is_started
        - ask_user_error
        - date_started
      properties:
        task_id:
          type: integer
        purchase_id:
          description: >-
            Id of the purchase the task works on (`GET
            /api/v3/purchases/{purchase_id}`)
          type: integer
        task_status:
          $ref: '#/components/schemas/TaskStatus'
        executed_instructions:
          description: >-
            Number of the step reached by the task, out of `total_instructions`:
            equal to it when the task is done or failed
          type:
            - integer
            - 'null'
        total_instructions:
          description: Total number of steps of the task
          type:
            - integer
            - 'null'
        is_started:
          description: Whether the execution of the task has started
          type: boolean
        ask_user_error:
          description: >-
            Error found in the data provided for the task, null when there is
            none: the corrected data are sent with `POST
            /api/v3/tasks/{task_id}/data`
          type:
            - string
            - 'null'
        date_started:
          description: Date and time the task was created
          type: string
          format: date-time
      type: object
    TaxRegime:
      description: 'Tax regime: how VAT applies to the documents'
      required:
        - regime_code
        - regime_name
        - code_edocument
        - tax_rate
      properties:
        regime_code:
          description: >-
            One of `ORDINARY`, `SPLIT_PAYMENT`, `EU_VIES`, `EU_EXPORTER`
            (habitual exporter), `EXTRA_EU`, `VATICAN`, `SANMARINO` or `ART_26`
          type: string
        regime_name:
          description: Name of the regime, in Italian, for example `Ordinario`
          type: string
        code_edocument:
          description: >-
            Nature code of the operation on the electronic invoice (`Natura`)
            when VAT is not applied, for example `N2.1`; null for the regimes
            with VAT
          type:
            - string
            - 'null'
        tax_rate:
          description: VAT rate as a fraction, for example `0.22` for 22%
          type: number
          format: float
      type: object
    TldContactSpecification:
      description: Represents a single TLD contact specification
      required:
        - name
        - type
        - enum
      properties:
        name:
          description: Code of the contact specification
          type: string
        type:
          description: Data type of the specification value
          type: string
        enum:
          description: If not null, the list of allowed values for this specification
          type:
            - array
            - 'null'
          items:
            type: string
      type: object
    Tld:
      description: >-
        TLD (domain extension), with the rules for the names and for the
        contacts of its domains
      required:
        - tld_id
        - extension
        - punycode
        - country
        - char_min
        - char_max
        - hyphen_allowed
        - number_allowed
        - punycode_allowed
        - dnssec_enabled
        - rdap_enabled
        - rdap_url
        - contact_data
        - update_contact_r
        - update_contact_a
        - update_contact_t
        - update_contact_o
        - update_contact_additional
        - update_contact_transfer
        - transfer_authcode
      properties:
        tld_id:
          type: integer
        extension:
          description: >-
            Extension without the leading dot, in Unicode (for example `it` or
            `co.uk`)
          type: string
        punycode:
          description: Extension in punycode
          type: string
        country:
          description: >-
            Country of the TLD, for the country-code TLDs (ccTLD); null for the
            others
          anyOf:
            - $ref: '#/components/schemas/Country'
            - type: 'null'
        char_min:
          description: Minimum length of the name, without the extension
          type:
            - integer
            - 'null'
        char_max:
          description: Maximum length of the name, without the extension
          type:
            - integer
            - 'null'
        hyphen_allowed:
          description: Whether the name can contain hyphens
          type: boolean
        number_allowed:
          description: Whether the name can contain numbers
          type: boolean
        punycode_allowed:
          description: Whether the name can contain international characters (IDN)
          type: boolean
        dnssec_enabled:
          description: Whether the TLD supports DNSSEC
          type: boolean
        rdap_enabled:
          description: Whether the availability of the names is checked with RDAP
          type: boolean
        rdap_url:
          description: URL of the RDAP service used for the TLD; null when not set
          type:
            - string
            - 'null'
        contact_data:
          description: >-
            Fields of the contact data of the domains of the TLD, with their
            type and allowed values (the authcode excluded)
          type: array
          items:
            $ref: '#/components/schemas/TldContactSpecification'
        update_contact_r:
          description: >-
            Whether the registrant contact (`R`) can be changed (`PATCH
            /api/v3/domains/{domain_id}/contacts/{domain_contact_id}`)
          type:
            - boolean
            - 'null'
        update_contact_a:
          description: Whether the administrative contact (`A`) can be changed
          type:
            - boolean
            - 'null'
        update_contact_t:
          description: Whether the technical contact (`T`) can be changed
          type:
            - boolean
            - 'null'
        update_contact_o:
          description: Whether the organization contact (`O`) can be changed
          type:
            - boolean
            - 'null'
        update_contact_additional:
          description: >-
            Whether a change of the contacts must also send the additional data
            of the TLD to the registry
          type: boolean
        update_contact_transfer:
          description: >-
            Whether a transfer must also send the additional data of the TLD to
            the registry
          type: boolean
        transfer_authcode:
          description: Whether the transfer of a domain of the TLD requires the authcode
          type: boolean
      type: object
    ApiUpload:
      description: >-
        File uploaded with `POST /api/v3/uploads`, to reference by its
        `upload_id` in the calls that take a document, such as the PEC transfer
        documents
      required:
        - upload_id
        - mimetype
        - filename
        - original_filename
        - file_extension
        - upload_date
      properties:
        upload_id:
          type: integer
        mimetype:
          description: >-
            MIME type associated with the extension of the file, for example
            `application/pdf`
          type:
            - string
            - 'null'
        filename:
          description: Name given to the file by the service when storing it
          type: string
        original_filename:
          description: Name of the file as uploaded by the client
          type:
            - string
            - 'null'
        file_extension:
          description: Extension of the file name, in lowercase, for example `pdf`
          type:
            - string
            - 'null'
        upload_date:
          description: Date and time of the upload
          type: string
          format: date-time
      type: object
    WebMonitoringAvailabilityChart:
      description: Availability of the monitored site in the last hour
      required:
        - web_monitoring_id
        - interval
        - unit
        - legend
        - points
      properties:
        web_monitoring_id:
          description: >-
            Id of the web monitoring (`GET
            /api/v3/web-monitorings/{web_monitoring_id}`)
          type: integer
        interval:
          description: >-
            Period covered by the chart, as an ISO 8601 duration: always `PT1H`,
            the last hour
          type: string
          example: PT1H
        unit:
          description: >-
            Unit of the `y` values: always `status`, a code explained in
            `legend`
          type: string
          example: status
        legend:
          description: >-
            Codes of the `y` values: 0 up, 1 down (HTTP 5xx), 2 warning (HTTP
            4xx)
          required:
            - up
            - down
            - warning
          properties:
            up:
              type: integer
              example: 0
            down:
              type: integer
              example: 1
            warning:
              type: integer
              example: 2
          type: object
        points:
          description: Checks of the last hour, one point per check
          type: array
          items:
            required:
              - x
              - 'y'
            properties:
              x:
                description: UNIX timestamp in milliseconds
                type: number
                format: float
              'y':
                description: Availability status code (0 up, 1 down, 2 warning)
                type: integer
            type: object
      type: object
    WebMonitoringDownloadSpeedChart:
      description: Download speed of the monitored site in the last hour
      required:
        - web_monitoring_id
        - interval
        - unit
        - points
      properties:
        web_monitoring_id:
          description: >-
            Id of the web monitoring (`GET
            /api/v3/web-monitorings/{web_monitoring_id}`)
          type: integer
        interval:
          description: >-
            Period covered by the chart, as an ISO 8601 duration: always `PT1H`,
            the last hour
          type: string
          example: PT1H
        unit:
          description: 'Unit of the `y` values: always `KB/s`'
          type: string
          example: KB/s
        points:
          description: Download speeds measured in the last hour, one point per check
          type: array
          items:
            required:
              - x
              - 'y'
            properties:
              x:
                description: UNIX timestamp in milliseconds
                type: number
                format: float
              'y':
                description: Download speed value in KB/s
                type: number
                format: float
            type: object
      type: object
    WebMonitoringNotices:
      description: Notice settings of a web monitoring
      required:
        - web_monitoring_id
        - notification_email
        - notification_sms
        - send_ssl_notify
      properties:
        web_monitoring_id:
          description: >-
            Id of the web monitoring (`GET
            /api/v3/web-monitorings/{web_monitoring_id}`)
          type: integer
        notification_email:
          description: >-
            Email address for the notices of the monitoring (site down or back
            up, SSL expiry); without it no email notice is sent
          type:
            - string
            - 'null'
        notification_sms:
          description: >-
            Italian mobile number for the SMS notices, without the international
            prefix; without it no SMS is sent
          type:
            - string
            - 'null'
        send_ssl_notify:
          description: >-
            Whether the notices of the expiry of the SSL certificate of the site
            are sent
          type:
            - boolean
            - 'null'
      type: object
    WebMonitoringResponseTimeChart:
      description: Response time of the monitored site in the last hour
      required:
        - web_monitoring_id
        - interval
        - unit
        - points
      properties:
        web_monitoring_id:
          description: >-
            Id of the web monitoring (`GET
            /api/v3/web-monitorings/{web_monitoring_id}`)
          type: integer
        interval:
          description: >-
            Period covered by the chart, as an ISO 8601 duration: always `PT1H`,
            the last hour
          type: string
          example: PT1H
        unit:
          description: 'Unit of the `y` values: always `ms`'
          type: string
          example: ms
        points:
          description: Response times measured in the last hour, one point per check
          type: array
          items:
            required:
              - x
              - 'y'
            properties:
              x:
                description: UNIX timestamp in milliseconds
                type: number
                format: float
              'y':
                description: Response time value in milliseconds
                type: number
                format: float
            type: object
      type: object
    WebMonitoring:
      description: >-
        Monitoring of a website: checks of the availability of the domain, and
        notices
      required:
        - web_monitoring_id
        - purchase_id
        - service_name
        - purchase_name
        - purchase_status_code
        - monitored_domain
        - host_ref
        - web_scenario_ref
        - status
        - email_notification
        - sms_notification
        - ips
        - ip_isp
        - ip_location
        - last_http_response
        - last_down_date
        - send_ssl_notify
        - active
      properties:
        web_monitoring_id:
          type: integer
        purchase_id:
          description: >-
            Id of the purchase of the monitoring (`GET
            /api/v3/purchases/{purchase_id}`)
          type:
            - integer
            - 'null'
        service_name:
          description: Name of the service of the purchase
          type:
            - string
            - 'null'
        purchase_name:
          description: 'Name of the object of the purchase: the monitored domain'
          type:
            - string
            - 'null'
        purchase_status_code:
          description: >-
            Status code of the purchase, for example `ACTIVE_V2` or
            `DISMISSED_V2`
          type:
            - string
            - 'null'
        monitored_domain:
          type:
            - string
            - 'null'
        host_ref:
          description: Id of the monitored host on the monitoring system
          type:
            - string
            - 'null'
        web_scenario_ref:
          description: Id of the check of the site (web scenario) on the monitoring system
          type:
            - string
            - 'null'
        status:
          description: >-
            Status of the site: `healthy`, `problem` (a recent check got an HTTP
            status outside 2xx) or `frequent_problem`
          type:
            - string
            - 'null'
        email_notification:
          description: >-
            Email address for the notices of the monitoring (site down or back
            up, SSL expiry); without it no email notice is sent
          type:
            - string
            - 'null'
        sms_notification:
          description: >-
            Italian mobile number for the SMS notices, without the international
            prefix; without it no SMS is sent
          type:
            - string
            - 'null'
        ips:
          description: IP address the monitored domain resolves to
          type:
            - string
            - 'null'
        ip_isp:
          description: Internet service provider of the IP address
          type:
            - string
            - 'null'
        ip_location:
          description: >-
            Country of the IP address, as ISO 3166-1 alpha-2 code (for example
            `IT`)
          type:
            - string
            - 'null'
        last_http_response:

      description: Returns the public keys used to sign the JWT access tokens.
      operationId: getJwks
      responses:
        '200':
          description: Available keys
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JwksResponse'
        '500':
          description: Unable to expose the JWKS
          content:

  /api/v3/domains/{domain_id}/dns:
    get:
      tags:
        - Domains
      summary: DNS Zone
      description: DNS Zone details
      operationId: getDomainDnsZone
      parameters:
        - name: domain_id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DnsZoneResponse'
        '400':
          description: Bad request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '401':

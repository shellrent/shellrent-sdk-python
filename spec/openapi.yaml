  /api/v3/payments/one-click:
    post:
      tags:
        - Payment
      summary: Pay orders with One-Click
      description: >-
        Pays one or more orders together with a One-Click payment method: the
        one in `one_click_id` or, without it, the default one (the first active
        method in the order chosen by the customer). Only that method is tried:
        when the provider declines the payment the response is 402, with the
        message of the provider, and the orders are still to be paid. When there
        is nothing to pay (total 0.00) the orders are confirmed without a
        payment and the response is 204. The response is 409 when payments are
        not possible at this time, the orders cannot be paid together, there is
        no active One-Click payment method, or the payment exceeds the payment
        limits allowed at this time (for example in the evening).


        Not available to sub-accounts: the response is 403 (error 1601).
      operationId: createOneClickPayment
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OneClickPaymentCreateRequest'
      responses:
        '201':
          description: Created
          headers:
            Location:
              description: URL of the created resource
              required: true
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaymentResponse'
        '204':
          description: >-
            Nothing to pay (total 0.00): the orders are confirmed without a
            payment
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '402':
          $ref: '#/components/responses/PaymentDeclined'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/ServerError'
      security:
        - oauth2:
            - payment:write
      x-sub-accounts: false
  /api/v3/payments/prepaid-credit:
    post:
      tags:
        - Payment
      summary: Pay orders with the prepaid credit
      description: >-
        Pays one or more orders together with the prepaid credit. When there is
        nothing to pay (total 0.00) the orders are confirmed without a payment
        and the response is 204. The response is 409 when payments are not
        possible at this time, the orders cannot be paid together, the prepaid
        credit cannot be used for them (for example because it is not enough),
        or the payment exceeds the payment limits allowed at this time.


        Not available to sub-accounts: the response is 403 (error 1601).
      operationId: createPrepaidCreditPayment
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PrepaidCreditPaymentCreateRequest'
      responses:
        '201':
          description: Created
          headers:
            Location:
              description: URL of the created resource
              required: true
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaymentResponse'
        '204':
          description: >-
            Nothing to pay (total 0.00): the orders are confirmed without a
            payment
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '402':
          $ref: '#/components/responses/PaymentDeclined'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/ServerError'
      security:
        - oauth2:
            - payment:write
      x-sub-accounts: false

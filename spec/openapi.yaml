      required:
        - cloud_storage_user_id
        - cloud_storage_id
        - purchase_id
        - type
        - username
        - password
        - path
        - soft_quota_gb
        - hard_quota_gb
        - used_space_bytes
        - allocated_space_bytes
        - grace_period_seconds
        - last_alert
        - active
      properties:
        cloud_storage_user_id:
          type: integer
        cloud_storage_id:
          description: >-
            Id of the cloud storage (`GET
            /api/v3/cloud-storages/{cloud_storage_id}`)
          type: integer
        purchase_id:
          description: >-
            Id of the purchase of the user (`GET
            /api/v3/purchases/{purchase_id}`): the cloud storage purchase, or
            the own purchase of an `ADDITIONAL` user
          type:
            - integer
            - 'null'
        type:
          description: >-
            Type of the user: `PRIMARY` (main user), `ADDITIONAL` (additional
            user, with its own purchase), or `DISASTER_RECOVERY`, `TEMPLATE_VM`
            and `SELF_CLOUD` for the users managed by those services
          type:
            - string
            - 'null'
        username:
          type:
            - string
            - 'null'
        password:
          description: Password of the user; null without the cloudstorage:secrets scope
          type:
            - string
            - 'null'
        path:
          description: Home path of the user on the storage
          type:
            - string
            - 'null'
        soft_quota_gb:
          description: >-
            Soft quota of the user, in GB (1 GB = 1024 MB): it can be exceeded,
            up to the hard quota, for a grace period
          type:
            - number
            - 'null'
          format: float
        hard_quota_gb:
          description: >-
            Hard quota of the user, in GB (1 GB = 1024 MB): the limit that the
            used space cannot exceed
          type:
            - number
            - 'null'
          format: float
        used_space_bytes:
          description: >-
            Space used by the user at the last sync of the cloud storage, in
            bytes; null before the first sync
          type:
            - integer
            - 'null'
        allocated_space_bytes:
          description: >-
            Space allocated to the user, that is its hard quota at the last sync
            of the cloud storage, in bytes; null before the first sync
          type:
            - integer
            - 'null'
        grace_period_seconds:
          description: >-
            Grace period left to go back under the soft quota, in seconds, saved
            the last time the user was found over quota; `0` if never. Only
            `PRIMARY` users are checked: `0` for the `ADDITIONAL` ones, null for
            the users of the services
          type:
            - integer
            - 'null'
        last_alert:
          description: >-
            Date of the last email that warned the customer that the user is
            over its soft quota, sent at most once a week and only for `PRIMARY`
            users; null if it was not over quota at the last check
          type:
            - string
            - 'null'
          format: date-time
        active:
          description: 'Whether the user is active: deleted users are not returned'
          type:
            - boolean
            - 'null'
      type: object
    Country:
      required:
        - iso_code_2
        - iso_code_3
        - country_name
        - local_name
        - phone_code
        - continent
        - region
      properties:
        iso_code_2:
          description: ie. IT
          type: string
        iso_code_3:
          description: ie. ITA
          type: string
        country_name:
          description: >-
            Name of the country in Italian; the local name when there is no
            translation
          type: string
        local_name:
          description: Name of the country in its own language, for example `Deutschland`
          type: string
        phone_code:
          description: International calling code, without `+`, for example `39`
          type: string
        continent:
          description: Continent, in English, for example `Europe` or `North America`
          type: string
        region:
          description: 'Area of the country: `EU` (European Union) or `EXTRAEU`'
          type: string
      type: object
    CreditnoteRow:
      description: Row of a credit note
      required:
        - creditnote_row_id
        - creditnote_id
        - invoice_row_id
        - reason
        - description
        - amount
        - billing_data
        - date_start
        - date_end
      properties:
        creditnote_row_id:
          type: integer
        creditnote_id:
          description: Id of the credit note (`GET /api/v3/credit-notes/{credit_note_id}`)
          type: integer
        invoice_row_id:
          description: >-
            Id of the invoice row that the credit note row refers to (`GET
            /api/v3/invoices/{invoice_id}/rows/{row_id}`); null when it refers
            to none
          type:
            - integer
            - 'null'
        reason:
          description: >-
            Reason of the row, in Italian, for example `Errato Addebito` (wrong
            charge) or `Servizio non Erogato` (service not provided)
          type:
            - string
            - 'null'
        description:
          type: string
        amount:
          $ref: '#/components/schemas/Amount'
        billing_data:
          $ref: '#/components/schemas/BillingData'
        date_start:
          description: >-
            Start of the period the row refers to; null when the row has no
            period
          type:
            - string
            - 'null'
          format: date
        date_end:
          description: End of the period the row refers to; null when the row has no period
          type:
            - string
            - 'null'
          format: date
      type: object
    Creditnote:
      description: Credit note of the account, with its total and electronic invoicing data
      required:
        - creditnote_id
        - invoice_id
        - billing
        - sdi_document_status
        - sdi_document_type
        - tax_regime
        - date_emitted
        - creditnote_year
        - creditnote_number
        - creditnote_caption
        - sdi_identifier
        - sdi_filename
        - total_amount
        - rows_count
        - date_created
      properties:
        creditnote_id:
          type: integer
        invoice_id:
          description: >-
            Id of the invoice the credit note refers to (`GET
            /api/v3/invoices/{invoice_id}`); null when it refers to none
          type:
            - integer
            - 'null'
        billing:
          $ref: '#/components/schemas/AccountBilling'
        sdi_document_status:
          description: >-
            Status of the credit note on SDI, the Italian e-invoicing exchange
            system; null for the credit notes not sent through SDI, issued
            before electronic invoicing
          anyOf:
            - $ref: '#/components/schemas/SdiDocumentStatus'
            - type: 'null'
        sdi_document_type:
          $ref: '#/components/schemas/SdiDocumentType'
        tax_regime:
          description: >-
            Tax regime set on the credit note; null when it uses the one of the
            billing profile (`billing.tax_regime`)
          anyOf:
            - $ref: '#/components/schemas/TaxRegime'
            - type: 'null'
        date_emitted:
          description: Date of issue of the credit note
          type: string
          format: date
        creditnote_year:
          description: Year of the numbering of the credit note
          type:
            - integer
            - 'null'
        creditnote_number:
          description: >-
            Complete number of the credit note: the year followed by the number
            on 6 digits, for example `2025000123`
          type: string
        creditnote_caption:
          description: >-
            Legal note of the tax regime printed on the credit note, in Italian,
            such as the law under which VAT is not applied; null when the regime
            has none
          type:
            - string
            - 'null'
        sdi_identifier:
          description: >-
            Identifier assigned by SDI to the credit note; null when it has not
            been sent to SDI
          type:
            - string
            - 'null'
        sdi_filename:
          description: >-
            Name of the file sent to SDI; null when not sent, and for the credit
            notes issued before November 2024
          type:
            - string
            - 'null'
        total_amount:
          $ref: '#/components/schemas/Amount'
        rows_count:
          description: >-
            Number of rows of the credit note (`GET
            /api/v3/credit-notes/{credit_note_id}/rows`)
          type: integer
        date_created:
          type: string
          format: date-time
      type: object
    DnsRecordCaaData:
      description: >-
        Flags and tag of a CAA record; the value of the tag is in `destination`
        of the record
      required:
        - flag
        - tag_value
        - can_sign_http_exchanges
      properties:
        flag:
          description: Flags of the CAA record; the API writes only `0`
          type:
            - integer
            - 'null'
        tag_value:
          description: Tag of the CAA record, for example `issue` or `issuewild`
          type:
            - string
            - 'null'
        can_sign_http_exchanges:
          description: >-
            Whether the value of the tag has the parameter
            `cansignhttpexchanges=yes`; null when the parameter is missing
          type:
            - boolean
            - 'null'
      type: object
    DnsRecordTlsaData:
      description: >-
        Parameters of a TLSA record; the certificate association data is in
        `destination` of the record
      required:
        - usage
        - selector
        - matching_type
      properties:
        usage:
          description: >-
            Certificate usage: `0` (PKIX-TA), `1` (PKIX-EE), `2` (DANE-TA) or
            `3` (DANE-EE)
          type:
            - string
            - 'null'
        selector:
          description: >-
            Selector: `0` for the full certificate, `1` for its public key
            (SubjectPublicKeyInfo)
          type:
            - string
            - 'null'
        matching_type:
          description: >-
            Matching type: `0` for the data without hashing, `1` for SHA-256,
            `2` for SHA-512
          type:
            - string
            - 'null'
      type: object
    DnsRecord:
      description: Record of the DNS zone of a domain
      required:
        - record_id
        - type
        - host
        - service
        - protocol
        - destination
        - port
        - weight
        - priority
        - ttl
        - proxied
        - caa_data
        - tlsa_data
      properties:
        record_id:
          type: string
        type:
          description: Type of the record, for example `A`, `CNAME`, `MX` or `TXT`
          type: string
        host:
          description: >-
            Name of the record relative to the zone, `@` for the domain itself;
            for SRV and TLSA records, without the service and the protocol
          type: string
        service:
          description: >-
            Service of SRV records (for example `_sip`) and port of TLSA records
            (for example `_443`), with the underscore; null for the other types
          type:
            - string
            - 'null'
        protocol:
          description: >-
            Protocol of SRV and TLSA records: `_tcp`, `_udp` or `_tls`; null for
            the other types
          type:
            - string
            - 'null'
        destination:
          description: >-
            Value of the record: the IPv4 address for A, the IPv6 address for
            AAAA, the target hostname for CNAME, MX, NS, PTR and SRV, the text
            for TXT and SPF, the value of the tag for CAA, the certificate
            association data for TLSA
          type: string
        port:
          description: Port of the service, for SRV records; null for the other types
          type:
            - string
            - 'null'
        weight:
          description: Weight of SRV records; `0` for the other types
          type:
            - integer
            - 'null'
        priority:
          description: >-
            Priority of MX and SRV records; null for the other types and, with
            the standard and external nameservers, when it is `0`
          type:
            - integer
            - 'null'
        ttl:
          description: >-
            TTL of the record, in seconds: with Cloudflare null means automatic,
            with the standard and external nameservers it is the TTL of the zone
            (`PATCH /api/v3/domains/{domain_id}/dns`)
          type:
            - integer
            - 'null'
        proxied:
          description: >-
            Whether the traffic of the record goes through the Cloudflare proxy;
            always false with the other nameserver types
          type: boolean
        caa_data:
          description: Data of CAA records; null for the other types
          anyOf:
            - $ref: '#/components/schemas/DnsRecordCaaData'
            - type: 'null'
        tlsa_data:
          description: Data of TLSA records; null for the other types
          anyOf:
            - $ref: '#/components/schemas/DnsRecordTlsaData'
            - type: 'null'
      type: object
    DnsType:
      description: Nameserver type of a domain, which decides where its DNS zone is managed
      required:
        - type_code
        - type_name
      properties:
        type_code:
          description: >-
            Code of the nameserver type: `INTERNAL` (our "standard"
            nameservers), `EXTERNAL` (nameservers of a third party) or
            `CLOUDFLARE` (Cloudflare nameservers, with a Cloudflare account)
          type: string
        type_name:
          description: >-
            Name of the nameserver type, in Italian: `Standard`, `Esterna` or
            `Cloudflare`
          type: string
      type: object
    DnsZone:
      description: DNS zone of a domain, on our nameservers or at Cloudflare
      required:
        - zone_id
        - zone_name
        - nameservers
        - ttl
      properties:
        zone_id:
          description: Id of the zone on our nameservers or at Cloudflare
          type: string
        zone_name:
          description: 'Name of the zone: the domain name in punycode'
          type: string
        nameservers:
          description: >-
            Hostnames of the nameservers of the zone; with Cloudflare, the ones
            that Cloudflare assigned to it
          type: array
          items:
            type: string
        ttl:
          description: >-
            TTL of the zone, in seconds, which with the standard and external
            nameservers is also the TTL of every record; null with Cloudflare,
            whose zones have no TTL
          type:
            - integer
            - 'null'
      type: object
    DnssecDsData:
      description: DS (delegation signer) record of the domain
      required:
        - zone_ttl
        - key_tag
        - key_algorithm
        - digest_type
        - digest_value
      properties:
        zone_ttl:
          description: TTL of the zone, in seconds
          type: integer
        key_tag:
          description: Key tag of the DNSKEY the record refers to
          type: integer
        key_algorithm:
          description: >-
            DNSSEC algorithm of the key, for example `8` (RSA/SHA-256) or `13`
            (ECDSAP256SHA256)
          type: integer
        digest_type:
          description: >-
            Algorithm of the digest, for example `1` (SHA-1), `2` (SHA-256) or
            `4` (SHA-384)
          type: integer
        digest_value:
          description: Digest of the DNSKEY, in hexadecimal
          type: string
      type: object
    DnssecKeyData:
      description: DNSKEY record of the domain
      required:
        - zone_ttl
        - flags
        - key_protocol
        - key_algorithm
        - public_key
      properties:
        zone_ttl:
          description: TTL of the zone, in seconds
          type: integer
        flags:
          description: >-
            Flags of the key: `256` for a zone signing key (ZSK), `257` for a
            key signing key (KSK)
          type: integer
        key_protocol:
          description: Protocol of the key, `3` for DNSSEC
          type: integer
        key_algorithm:
          description: >-
            DNSSEC algorithm of the key, for example `8` (RSA/SHA-256) or `13`
            (ECDSAP256SHA256)
          type: integer
        public_key:
          description: Public key, in base64
          type: string
      type: object
    DomainAvailability:
      description: >-
        Availability of a domain name (whois): how it can be bought and, for
        premium domains, our prices
      required:
        - domain_name
        - availability
        - premium
        - premium_prices
      properties:
        domain_name:
          $ref: '#/components/schemas/DomainName'
        availability:
          description: >-
            How the domain can be bought: `A` (available: it can be registered),
            `T` (already registered: it can be transferred) or `R` (expired with
            us: it can be restored)
          type: string
        premium:
          description: >-
            Whether the registry sells the domain at a premium price, which it
            sets itself
          type: boolean
        premium_prices:
          description: >-
            Our prices for the premium domain; null when the domain is not
            premium, when the registry gave no price (the domain cannot be
            bought) and for sub-accounts
          anyOf:
            - $ref: '#/components/schemas/DomainPremiumPrices'
            - type: 'null'
      type: object
    DomainCanChangeNameservers:
      description: >-
        Nameserver types that can be activated on the domain now: none while the
        purchase of the domain is not active or has an operation running, or
        while the nameservers are being changed
      required:
        - domain_id
        - can_activate_standard
        - can_activate_cloudflare
        - can_activate_external
      properties:
        domain_id:
          type: integer
        can_activate_standard:
          description: >-
            Whether the standard nameservers can be activated (`PUT
            /api/v3/domains/{domain_id}/dns/standard`); false when they are the
            current ones
          type: boolean
        can_activate_cloudflare:
          description: >-
            Whether the Cloudflare nameservers can be activated (`PUT
            /api/v3/domains/{domain_id}/dns/cloudflare`); false when they are
            the current ones
          type: boolean
        can_activate_external:
          description: >-
            Whether the external nameservers can be activated (`PUT
            /api/v3/domains/{domain_id}/dns/external`); false when they are the
            current ones
          type: boolean
      type: object
    DomainContactData:
      description: Field of the data of a domain contact
      required:
        - data_field
        - data_value
      properties:
        data_field:
          description: >-
            Code of the field, for example `FIRST_NAME`, `EMAIL` or
            `DOT_IT_ENTITY_TYPE` (see `contact_data` of `GET
            /api/v3/tlds/{tld_id}`)
          type: string
        data_value:
          description: >-
            Value of the field; for `PHONE_PREFIX` and `FAX_PREFIX`, the id of
            the country of the prefix; for `BIRTHDAY`, a date `YYYY-MM-DD`
          type:
            - string
            - 'null'
      type: object
    DomainContact:
      description: Contact of a domain at the registry, with its data
      required:
        - domain_contact_id
        - domain_id
        - type
        - to_sync
        - contact_data
      properties:
        domain_contact_id:
          type: integer
        domain_id:
          description: Id of the domain (`GET /api/v3/domains/{domain_id}`)
          type: integer
        type:
          description: >-
            Role of the contact: `R` (registrant), `A` (administrative), `T`
            (technical) or `O` (organization)
          type: string
        to_sync:
          description: >-
            Whether the contact has changes not yet sent to the registry (`POST
            /api/v3/domains/{domain_id}/contacts/synchronizations`)
          type:
            - boolean
            - 'null'
        contact_data:
          description: Data of the contact, one item per field
          type: array
          items:
            $ref: '#/components/schemas/DomainContactData'
      type: object
    DomainData:
      description: Data of the domain at the registry
      required:
        - registry_status
        - incoming_authcode
        - outgoing_authcode
        - registry_nameservers
        - registry_expiry
        - registry_created
        - registry_updated
        - registry_deletion
        - date_deactivation
        - identity_validation_status
        - is_on_hold
        - transfer_wrong_authcode
        - transfer_locked
        - date_created
      properties:
        registry_status:
          description: >-
            Status of the domain as the registry reports it, for example `ok`,
            `clientTransferProhibited` or `pendingDelete`
          type:
            - string
            - 'null'
        incoming_authcode:
          description: >-
            Authcode given for the incoming transfer of the domain; null without
            the `domains:secrets` scope
          type:
            - string
            - 'null'
        outgoing_authcode:
          description: >-
            Authcode to transfer the domain to another registrar; null without
            the `domains:secrets` scope
          type:
            - string
            - 'null'
        registry_nameservers:
          description: >-
            Nameservers of the domain at the registry, as a text in the format
            of the registry (usually hostnames separated by commas)
          type:
            - string
            - 'null'
        registry_expiry:
          description: Expiry of the domain at the registry
          type:
            - string
            - 'null'
          format: date-time
        registry_created:
          description: Registration of the domain at the registry
          type:
            - string
            - 'null'
          format: date-time
        registry_updated:
          description: Last update of the domain at the registry
          type:
            - string
            - 'null'
          format: date-time
        registry_deletion:
          description: >-
            Deletion of the domain at the registry, when the registry reports
            one
          type:
            - string
            - 'null'
          format: date-time
        date_deactivation:
          description: >-
            When these data were deactivated because the registrar no longer has
            the domain (for example after an outgoing transfer); null while they
            are active
          type:
            - string
            - 'null'
          format: date-time
        identity_validation_status:
          description: >-
            Status of the validation of the identity of the registrant:
            `VERIFIED`, `NOT_VERIFIED`, `PENDING` or `FAILED`
          type:
            - string
            - 'null'
        is_on_hold:
          description: Whether the domain is on hold at the registry (status `clientHold`)
          type: boolean
        transfer_wrong_authcode:
          description: >-
            Whether the incoming transfer failed because of a wrong authcode;
            null when not known
          type:
            - boolean
            - 'null'
        transfer_locked:
          description: >-
            Whether the incoming transfer failed because the domain is locked at
            the current registrar; null when not known
          type:
            - boolean
            - 'null'
        date_created:
          description: >-
            When these data were recorded: a new version is recorded each time
            the data at the registry change
          type: string
          format: date-time
      type: object
    DomainDetail:
      description: >-
        Domain of the account, with its nameservers, its data at the registry
        and the status of DNSSEC
      required:
        - domain_id
        - tld_id
        - domain_name
        - dns_type
        - dns_account
        - nameservers
        - domain_data
        - contacts_count
        - dnssec_enabled
        - date_info_last
        - date_dns_check
        - vanity_nameserver_enabled
      properties:
        domain_id:
          type: integer
        tld_id:
          description: Id of the TLD of the domain (`GET /api/v3/tlds/{tld_id}`)
          type: integer
        domain_name:
          $ref: '#/components/schemas/DomainName'
        dns_type:
          $ref: '#/components/schemas/DnsType'
        dns_account:
          description: >-
            Email of the Cloudflare account that manages the DNS zone, with the
            Cloudflare nameservers; null with the other nameserver types, and
            when the zone is on our own Cloudflare account
          type:
            - string
            - 'null'
        nameservers:
          description: Nameservers of the domain; `sort` gives their order
          type: array
          items:
            $ref: '#/components/schemas/DomainNameserver'
        domain_data:
          description: Data of the domain at the registry; null when there are none
          anyOf:
            - $ref: '#/components/schemas/DomainData'
            - type: 'null'
        contacts_count:
          description: Number of active contacts of the domain
          type: integer
        dnssec_enabled:
          description: >-
            DNSSEC is enabled on the DNS zone of the domain, or the domain has
            active external DNSSEC keys. Always false for DNS types other than
            internal and external
          type: boolean
        date_info_last:
          description: When the data of the domain were last requested from the registry
          type:
            - string
            - 'null'
          format: date-time
        date_dns_check:
          description: When the DNS zone and the DNSSEC of the domain were last checked
          type:
            - string
            - 'null'
          format: date-time
        vanity_nameserver_enabled:
          description: >-
            Whether the domain uses vanity nameservers: our nameservers with
            hostnames of the domain itself (for example `ns1.example.com`)
          type: boolean
      type: object
    DomainDnssecCanActivate:
      description: Whether DNSSEC can be activated on the domain, or its data changed
      required:
        - domain_id
        - can_active
      properties:
        domain_id:
          type: integer
        can_active:
          description: >-
            Whether DNSSEC can be activated now (`POST
            /api/v3/domains/{domain_id}/dnssec`, standard nameservers) or its
            data changed (`PATCH /api/v3/domains/{domain_id}/dnssec`, external
            nameservers)
          type: boolean
      type: object
    DomainDnssecCanDeactivate:
      description: Whether DNSSEC can be deactivated on the domain, or its data removed
      required:
        - domain_id
        - can_deactivate
      properties:
        domain_id:
          type: integer
        can_deactivate:
          description: >-
            Whether DNSSEC can be deactivated now (standard nameservers) or its
            data removed (external nameservers) with `DELETE
            /api/v3/domains/{domain_id}/dnssec`
          type: boolean
      type: object
    DomainDnssec:
      description: >-
        Active DNSSEC records of the domain: the ones of our zone with the
        standard nameservers, the ones set with `PATCH
        /api/v3/domains/{domain_id}/dnssec` with the external nameservers
      required:
        - ds_data
        - key_data
      properties:
        ds_data:
          description: DS records
          type: array
          items:
            $ref: '#/components/schemas/DnssecDsData'
        key_data:
          description: DNSKEY records
          type: array
          items:
            $ref: '#/components/schemas/DnssecKeyData'
      type: object
    DomainName:
      description: >-
        Name of a domain, whole and split into name and extension, in Unicode
        and in punycode
      required:
        - unicode
        - punycode
        - unicode_name
        - punycode_name
        - unicode_tld
        - punycode_tld
      properties:
        unicode:
          description: Full domain name in Unicode, for example `farò.it`
          type:
            - string
            - 'null'
        punycode:
          description: Full domain name in punycode, for example `xn--far-ena.it`
          type:
            - string
            - 'null'
        unicode_name:
          description: Name without the extension, in Unicode
          type:
            - string
            - 'null'
        punycode_name:
          description: Name without the extension, in punycode
          type:
            - string
            - 'null'
        unicode_tld:
          description: Extension (TLD) without the leading dot, in Unicode
          type:
            - string
            - 'null'
        punycode_tld:
          description: Extension (TLD) without the leading dot, in punycode
          type:
            - string
            - 'null'
      type: object
    DomainNameserver:
      required:
        - hostname
        - address_ipv4
        - address_ipv6
        - sort
      properties:
        hostname:
          type: string
        address_ipv4:
          description: >-
            IPv4 address of the nameserver, saved when the nameservers were set;
            null when not known
          type:
            - string
            - 'null'
        address_ipv6:
          description: IPv6 address of the nameserver; not filled in for now, always null
          type:
            - string
            - 'null'
        sort:
          description: Position of the nameserver, from `1`
          type: integer
      type: object
    DomainPremiumPrices:
      description: >-
        Our prices for a premium domain, without VAT: the cost asked by the
        registry plus our markup. The order of a premium domain uses these
        prices
      required:
        - activation_price
        - renew_price
        - restore_price
        - transfer_price
      properties:
        activation_price:
          $ref: '#/components/schemas/Amount'
          description: Registration price
        renew_price:
          $ref: '#/components/schemas/Amount'
          description: Renewal price
        restore_price:
          description: Restore price; null when the registry gave none
          anyOf:
            - $ref: '#/components/schemas/Amount'
            - type: 'null'
        transfer_price:
          description: Transfer price; null when the registry gave none
          anyOf:
            - $ref: '#/components/schemas/Amount'
            - type: 'null'
      type: object
    Domain:
      description: Domain of the account, with its nameservers and its data at the registry
      required:
        - domain_id
        - tld_id
        - domain_name
        - dns_type
        - dns_account
        - nameservers
        - domain_data
        - contacts_count
        - date_info_last
        - date_dns_check
        - vanity_nameserver_enabled
      properties:
        domain_id:
          type: integer
        tld_id:
          description: Id of the TLD of the domain (`GET /api/v3/tlds/{tld_id}`)
          type: integer
        domain_name:
          $ref: '#/components/schemas/DomainName'
        dns_type:
          $ref: '#/components/schemas/DnsType'
        dns_account:
          description: >-
            Email of the Cloudflare account that manages the DNS zone, with the
            Cloudflare nameservers; null with the other nameserver types, and
            when the zone is on our own Cloudflare account
          type:
            - string
            - 'null'
        nameservers:
          description: Nameservers of the domain; `sort` gives their order
          type: array
          items:
            $ref: '#/components/schemas/DomainNameserver'
        domain_data:
          description: Data of the domain at the registry; null when there are none
          anyOf:
            - $ref: '#/components/schemas/DomainData'
            - type: 'null'
        contacts_count:
          description: Number of active contacts of the domain
          type: integer
        date_info_last:
          description: When the data of the domain were last requested from the registry
          type:
            - string
            - 'null'
          format: date-time
        date_dns_check:
          description: When the DNS zone and the DNSSEC of the domain were last checked
          type:
            - string
            - 'null'
          format: date-time
        vanity_nameserver_enabled:
          description: >-
            Whether the domain uses vanity nameservers: our nameservers with
            hostnames of the domain itself (for example `ns1.example.com`)
          type: boolean
      type: object
    HostingAntivirusRemovalScan:
      description: >-
        Antivirus cleaning of the hosting, which removes or cleans the infected
        files and database contents
      required:
        - removal_scan_id
        - hosting_id
        - task_id
        - status
        - error
        - date_created
      properties:
        removal_scan_id:
          type: integer
        hosting_id:
          description: Id of the hosting (`GET /api/v3/hostings/{hosting_id}`)
          type: integer
        task_id:
          description: >-
            Id of the task of the cleaning (`GET /api/v3/tasks/{task_id}`); null
            when the task is not available
          type:
            - integer
            - 'null'
        status:
          description: >-
            Whether the cleaning succeeded; null until the antivirus sends the
            result
          type:
            - boolean
            - 'null'
        error:
          description: Error message of a failed cleaning; null otherwise
          type:
            - string
            - 'null'
        date_created:
          type: string
          format: date-time
      type: object
    HostingAntivirusScan:
      description: Antivirus scan of the hosting
      required:
        - antivirus_id
        - hosting_id
        - status_code
        - status_name
        - status_color
        - antivirus_type
        - scan_id
        - date_started
        - date_completed
        - date_timeout
        - date_created
        - total_files
        - total_infected
        - total_cleaned
      properties:
        antivirus_id:
          type: integer
        hosting_id:
          description: >-
            Id of the main hosting (`GET /api/v3/hostings/{hosting_id}`): the
            scan covers its whole space, subdomains included
          type:
            - integer
            - 'null'
        status_code:
          description: >-
            Status of the scan: `RUNNING`, `FAILED`, `SUCCESS` (no infection
            found) or `PROBLEM` (infections found)
          type:
            - string
            - 'null'
        status_name:
          description: Translated name of the status, for display
          type:
            - string
            - 'null'
        status_color:
          description: Color of the status, in hexadecimal, for display
          type:
            - string
            - 'null'
        antivirus_type:
          description: 'Type of the scan: `M` manual, `A` automatic'
          type: string
        scan_id:
          description: Id of the scan on the web server; null until the scan completes
          type:
            - string
            - 'null'
        date_started:
          description: >-
            Start of the scan, as sent by the antivirus; null until the scan
            completes, and for a failed scan
          type:
            - string
            - 'null'
          format: date-time
        date_completed:
          description: >-
            End of the scan, as sent by the antivirus; null until the scan
            completes, and for a failed scan
          type:
            - string
            - 'null'
          format: date-time
        date_timeout:
          description: >-
            When the scan was marked as failed because it ran too long; null
            otherwise
          type:
            - string
            - 'null'
          format: date-time
        date_created:
          type: string
          format: date-time
        total_files:
          description: Files scanned; null when zero, and until the scan completes
          type:
            - integer
            - 'null'
        total_infected:
          description: Infected files found; null when zero, and until the scan completes
          type:
            - integer
            - 'null'
        total_cleaned:
          description: >-
            Infected files cleaned by the antivirus; null when zero, and until
            the scan completes
          type:
            - integer
            - 'null'
      type: object
    HostingAntivirus:
      description: Antivirus scan running on the hosting, or the latest one
      required:
        - antivirus_id
        - hosting_id
        - status_code
        - status_name
        - status_color
        - antivirus_type
        - date_started
        - date_completed
        - date_timeout
        - total_files
        - total_infected
        - total_cleaned
      properties:
        antivirus_id:
          description: >-
            Id of the scan (`GET
            /api/v3/hostings/{hosting_id}/antivirus/scans/{antivirus_id}`)
          type: integer
        hosting_id:
          description: >-
            Id of the main hosting (`GET /api/v3/hostings/{hosting_id}`): the
            scan covers its whole space, subdomains included

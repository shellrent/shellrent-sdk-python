      security:
        - oauth2:
            - hosting:read
    post:
      tags:
        - Hosting
      summary: Install SSL certificate on hosting
      description: >-
        Installs a purchased SSL certificate on the hosting, or issues and
        installs a Let's Encrypt certificate, with the rules of the control
        panel. With DNS that are not on our nameservers, Let's Encrypt requires
        the CNAME record that delegates its DNS validation: `GET
        /api/v3/hostings/{hosting_id}/ssl-certificates/can-install` tells
        whether the installation can start, and which record to create. 409 when
        a certificate is already installed on the destination, the CNAME record
        is missing, the limit of Let's Encrypt installations is reached or an
        operation is running; 403 when the mail server of the hosting does not
        accept certificates
      operationId: installHostingSslCertificate
      parameters:
        - $ref: '#/components/parameters/HostingId'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/HostingSslCertificateInstallRequest'
      responses:
        '202':
          description: >-
            Accepted: the operation goes on in the background, as the returned
            Task
          headers:
            Location:
              description: >-
                URL of the Task: `/api/v3/tasks/{task_id}`. Reading it requires
                the `purchases:read` scope
              required: true
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TaskResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/ServerError'
      security:
        - oauth2:
            - hosting:write

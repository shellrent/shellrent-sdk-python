        '404':
          description: Not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '429':
          $ref: '#/components/responses/TooManyRequests'
      security:
        - oauth2:
            - domains:write
  /api/v3/domains/{domain_id}/dnssec/can-activate:
    get:
      tags:
        - Domains
      summary: Can activate DNSSEC
      description: Know if it's possible to activate DNSSEC
      operationId: canActivateDomainDnssec
      parameters:

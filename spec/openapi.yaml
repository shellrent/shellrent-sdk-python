          type: array
          items:
            type: integer
        country:
          $ref: '#/components/schemas/Country'
        phone_number:
          description: >-
            Phone number without the international prefix: the country is in
            `country`
          type: string
        name:
          type:
            - string
            - 'null'
        surname:
          type:
            - string
            - 'null'
        birth_date:
          type:
            - string
            - 'null'
          format: date
      type: object
    SmsPhonebook:
      description: Phonebook of SMS recipients of the account
      required:
        - id
        - name
        - contacts_count
      properties:
        id:
          type: integer
        name:
          type:
            - string
            - 'null'
        contacts_count:
          description: >-
            Number of contacts in the phonebook (`GET
            /api/v3/sms-phonebooks/{phonebook_id}/contacts`)
          type: integer
      type: object
    SmsPrice:

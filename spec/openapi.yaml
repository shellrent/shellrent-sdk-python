      summary: List exposable server backups
      description: >-
        Lists the backups of the server that can be exposed with `POST
        /api/v3/servers/{server_id}/backups/exhibitions`: the restorable backups
        visible to the customer, one-off backups included. It does not tell
        which backup is exposed now
      operationId: listServerExposedBackups
      parameters:
        - $ref: '#/components/parameters/ServerId'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServerBackupListResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/ServerError'
      security:
        - oauth2:
            - server:read
    post:
      tags:
        - Server
      summary: Expose a server backup
      description: >-
        Exposes a backup of the virtual machine (`backup_id`, one of `GET
        /api/v3/servers/{server_id}/backups/exhibitions`) as an additional disk,
        to read its files without restoring it: it replaces the backup exposed
        before, the server may restart, and the operation goes on in the
        background as the returned Task. Exposed backups are removed after a few
        days, or with `DELETE /api/v3/servers/{server_id}/backups/exhibitions`.
        409 for a physical server or a virtual machine that is not on oVirt,
        while the exposed backups are being deleted, while the server is not
        ready, its service is not active or is under maintenance, or another
        operation does not allow it
      operationId: exposeServerBackup
      parameters:
        - $ref: '#/components/parameters/ServerId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ServerBackupExhibitRequest'
      responses:
        '202':
          description: >-
            Accepted: the operation goes on in the background, as the returned
            Task
          headers:
            Location:
              description: >-
                URL of the Task: `/api/v3/tasks/{task_id}`. Reading it requires
                the `purchases:read` scope
              required: true
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TaskResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/ServerError'
      security:
        - oauth2:
            - server:write
    delete:
      tags:
        - Server
      summary: Delete exposed backups
      description: >-
        Removes the backups exposed on the virtual machine with `POST
        /api/v3/servers/{server_id}/backups/exhibitions`; the operation goes on
        in the background as the returned Task. 409 while a backup is being
        exposed, for a physical server or a virtual machine that is not on
        oVirt, while the server is not ready, its service is not active or is
        under maintenance, or another operation does not allow it
      operationId: deleteServerExposedBackups
      parameters:
        - $ref: '#/components/parameters/ServerId'
      responses:
        '202':
          description: >-
            Accepted: the operation goes on in the background, as the returned
            Task
          headers:
            Location:

        contract_upload_id:
          description: ID of contract document uploaded with `POST /api/v3/uploads`
          type: integer
        identity_document_upload_id:
          description: ID of identity document uploaded with `POST /api/v3/uploads`
          type: integer
        order_module_upload_id:
          description: ID of order module document uploaded with `POST /api/v3/uploads`
          type: integer
      type: object
      additionalProperties: false
    PecMailboxUpdateRequest:
      properties:
        report_email:

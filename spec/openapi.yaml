    BuyServiceMicrosoft365Request:
      required:
        - service_id
        - data
      properties:
        service_id:
          description: ID of the Service to buy
          type: integer
          minimum: 1
        quantity:
          description: >-
            Number of seats (user licenses) to purchase. It must be between
            `quantity_min` and `quantity_max` of the chosen service, as listed
            by `GET /api/v3/shop/microsoft-365/services`. If omitted,
            `quantity_min` is used. Ignored for the services without
            `quantity_max`.
          type: integer
          minimum: 1
        account_id:
          description: >-
            ID of the account of the user that will be the owner of the purchase
            (available to Resellers only)
          type: integer
        data:
          description: >-
            Microsoft 365 tenant of the subscription. All the data is checked
            before the order is created: with "select" the tenant must be one of
            the account (409 if it already has 2 active subscriptions of the
            same service); with "transfer" and "new" no tenant can have the
            domain prefix already, and at Microsoft the ".onmicrosoft.com"
            domain must exist ("transfer") or be available ("new"), otherwise
            409. Send only the fields of the chosen option.
          required:
            - tenant_choice
          properties:
            tenant_choice:
              description: >-
                Select whether to choose an existing tenant ("select"), transfer
                one ("transfer") or create a new tenant ("new"). When
                transferring a tenant, approve the Microsoft Partner
                Relationship before sending API requests
              type: string
              enum:
                - select
                - transfer
                - new
            tenant_select:
              description: >-
                ID of the tenant to which to assign the subscription, as listed
                by `GET /api/v3/shop/microsoft-365/tenants`. Required with
                "select", not allowed otherwise
              type: integer
              minimum: 1
            domain_prefix:
              description: >-
                Prefix of the ".onmicrosoft.com" tenant domain: lowercase
                letters and digits, at most 27 characters. Required with
                "transfer" and "new", not allowed otherwise
              type: string
              pattern: ^[a-z0-9]{1,27}$
              example: mycompany
            first_name:
              description: >-
                Contact first name for the tenant: letters, spaces and hyphens.
                Required with "transfer" and "new", not allowed otherwise
              type: string
              pattern: ^[\p{L}\s\-]+$
              example: Mario
            last_name:
              description: >-
                Contact last name for the tenant: letters, spaces and hyphens.
                Required with "transfer" and "new", not allowed otherwise
              type: string
              pattern: ^[\p{L}\s\-]+$
              example: Rossi
            company_name:
              description: >-
                Company name for the tenant: letters, digits and spaces.
                Required with "transfer" and "new", not allowed otherwise
              type: string
              pattern: ^[\p{L}0-9\s]+$
              example: Rossi Srl
            address:
              description: >-
                Address for the tenant. Required with "transfer" and "new", not
                allowed otherwise
              type: string
              minLength: 1
              example: Via Roma 1
            city:
              description: >-
                City for the tenant address: letters, spaces and hyphens.
                Required with "transfer" and "new", not allowed otherwise
              type: string
              pattern: ^[\p{L}\s\-]+$
              example: Vicenza
            state:
              description: >-
                State/Province for the tenant address: letters, spaces and
                hyphens. Required with "transfer" and "new", not allowed
                otherwise
              type: string
              minLength: 3
              pattern: ^[\p{L}\s\-]+$
              example: Vicenza
            postal_code:
              description: >-
                Postal code for the tenant address: letters, digits and spaces.
                Required with "transfer" and "new", not allowed otherwise
              type: string
              pattern: ^[a-zA-Z0-9\s]+$
              example: '36100'
            country:
              description: >-
                ISO country code with 2 letters (e.g. "IT" or "ES"). Required
                with "transfer" and "new", not allowed otherwise
              type: string
              pattern: ^[\p{L}\s\-]+$
              example: IT
            email_address:
              description: >-
                Administrative email address for the tenant. Required with
                "transfer" and "new", not allowed otherwise
              type: string
              format: email
            phone_prefix:
              description: >-
                International phone prefix of a country, with the leading "+"
                sign (e.g. "+44" for UK or "+39" for Italy). Required with
                "transfer" and "new", not allowed otherwise
              type: string
              example: '+39'
            phone_number:
              description: >-
                Phone number for the tenant contact: from 3 to 25 digits,
                spaces, dots, hyphens and parentheses. Required with "transfer"
                and "new", not allowed otherwise
              type: string
              pattern: ^[\d() .-]{3,25}$
              example: 0444 123456
            locale:
              description: >-
                Locale to use for the tenant. Required with "transfer" and
                "new", not allowed otherwise
              type: string
              enum:
                - it_IT
                - en_US
                - en_GB
          type: object
          additionalProperties: false
      type: object
      additionalProperties: false

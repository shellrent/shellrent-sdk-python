      security: []
  /oauth/token:
    post:
      tags:
        - OAuth
      summary: Request an access token
      description: >-
        Issues a JWT access token with the `client_credentials` grant. The
        `audience` and `scope` parameters are optional: without `audience`, or
        with an empty value, the token gets the only audience of the client (a
        client with more audiences must send it); without `scope` it gets all
        the scopes assigned to the client, as with `scope=api:full`. The
        internal scopes are granted only with the `api-internal` audience. The
        response reports the granted audience and scopes.
      operationId: requestAccessToken
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              required:
                - grant_type
              properties:
                grant_type:
                  type: string
                  enum:
                    - client_credentials
                client_id:
                  description: >-
                    Client ID, when it is not sent in the Basic Authorization
                    header.
                  type:
                    - string
                    - 'null'
                client_secret:
                  description: >-
                    Client secret, when it is not sent in the Basic
                    Authorization header.
                  type:
                    - string
                    - 'null'
                scope:
                  description: >-
                    Space-separated scopes. When omitted: all the scopes
                    assigned to the client.
                  type:
                    - string
                    - 'null'
                audience:
                  description: 'When omitted or empty: the only audience of the client.'
                  anyOf:
                    - $ref: '#/components/schemas/OAuthAudience'
                    - type: 'null'
              type: object
      responses:
        '200':
          description: Token issued
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OAuthTokenResponse'
        '400':
          description: >-
            Invalid request, or `unauthorized_client`: the client is
            authenticated, but its owner has not enabled two-factor
            authentication
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OAuthError'
        '401':
          description: Client authentication failed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OAuthError'
        '429':
          $ref: '#/components/responses/TokenTooManyRequests'
        '500':
          description: Unexpected error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OAuthError'
      security: []
components:
  schemas:
    ApiError:
      description: >-
        Error response: the code in `error`, the description in `message`, the
        errors for each field in `meta` for validation errors
      required:
        - error
        - message
        - data
        - meta
      properties:
        error:
          description: >-
            Error code: 1000 validation failed (details in `meta.errors`), 1001
            bad request, 1100 access token missing, invalid, expired or revoked
            (HTTP 401: request a new token and retry once), 1101 insufficient
            scope (HTTP 403: the token lacks a scope listed in the
            `WWW-Authenticate` header), 1102 the access token audience is not
            valid for this API (HTTP 403), 1200 not found, 1201 not implemented,
            1202 method not allowed, 1300 rate limited, 1400 conflict with a
            business rule or with the state of the resource, 1500 server error,
            1601 forbidden (for example a feature not included in the plan, an
            operation not available to sub-accounts, the internal API without
            administrator privileges, or a request from an IP address not
            allowed for the account), 1700 payment declined by the payment
            provider (HTTP 402: the orders are still to be paid), 1 other
            errors. Do not retry 403 responses with a new token: the result does
            not change.
          type: integer
          minimum: 1
          example: 1000
        message:
          description: Description of the error, for the developers of the client
          type: string
          example: Invalid request
        data:
          description: Always null in error responses
          const: null
        meta:
          description: >-
            Null, except in validation errors (HTTP 400 with error 1000), where
            it contains `errors`
          properties:
            errors:
              description: >-
                Errors for each field: path of the field (e.g. cpu,
                configuration.ram, ids[3]) => messages
              type: object
              additionalProperties:
                type: array
                items:
                  type: string
          type:
            - object
            - 'null'
      type: object
    PaginationMeta:
      description: Pagination of a list, with the totals
      required:
        - total
        - count
        - pages
        - page
        - per_page
      properties:
        total:
          description: Number of items in the whole list
          type: integer
        count:
          description: 'Number of items in this page: 0 beyond the last page'
          type: integer
        pages:
          description: Number of pages of the list
          type: integer
        page:
          description: Number of this page, starting from 1
          type: integer
        per_page:
          description: Maximum number of items in a page
          type: integer
      type: object
    SimplePaginationMeta:
      description: >-
        Pagination of a list without the totals: `next` says whether there is
        another page
      required:
        - count
        - page
        - per_page
        - next
      properties:
        count:
          description: 'Number of items in this page: 0 beyond the last page'
          type: integer
        page:
          description: Number of this page, starting from 1
          type: integer
        per_page:
          description: Maximum number of items in a page
          type: integer
        next:
          description: Tells if there is another page after this one
          type: boolean
      type: object
    HealthStatus:
      description: Status of the API
      required:
        - status
      properties:
        status:
          description: '`ok` when the API is up'
          type: string
          example: ok
      type: object
    OAuthTokenResponse:
      description: Access token issued by the token endpoint
      required:
        - token_type
        - expires_in
        - access_token
        - scope
        - audience
      properties:
        token_type:
          description: 'Type of the token: always `Bearer`'
          type: string
          example: Bearer
        expires_in:
          description: Lifetime of the token, in seconds
          type: integer
          example: 600
        access_token:
          description: >-
            Access token, a JWT signed with the keys of `GET
            /.well-known/jwks.json`: send it in the `Authorization: Bearer`
            header
          type: string
          example: eyJhbGciOiJSUzI1NiIsInR5cCI6IkpXVCJ9…
        scope:
          description: Space-separated list of the granted scopes
          type: string
          example: purchases:read purchases:write
        audience:
          description: >-
            Audience of the token: `api-public` for the public API,
            `api-internal` for the internal one
          type: string
          example: api-public
      type: object
    OAuthError:
      description: >-
        Error of the token endpoint, in the OAuth2 format (RFC 6749, section
        5.2)
      required:
        - error
      properties:
        error:
          description: >-
            OAuth2 error code, for example `invalid_client`, `invalid_scope`,
            `unauthorized_client` or `rate_limited`
          type: string
          example: invalid_client
        error_description:
          description: Description of the error, for the developers of the client
          type:
            - string
            - 'null'
          example: Client authentication failed.
        error_uri:
          description: Page that describes the error, when there is one
          type:
            - string
            - 'null'
          example: https://docs.shellrent.com/oauth/errors#invalid_client
      type: object
    JwkKey:
      description: >-
        Public key that verifies the signature of the access tokens (JSON Web
        Key, RFC 7517)
      required:
        - kid
        - kty
        - alg
        - use
        - 'n'
        - e
      properties:
        kid:
          description: 'Id of the key: the `kid` in the header of the tokens it signs'
          type: string
          example: api-key-20240101
        kty:
          description: 'Key type: `RSA`'
          type: string
          example: RSA
        alg:
          description: 'Signature algorithm: `RS256`'
          type: string
          example: RS256
        use:
          description: 'Use of the key: `sig`, signature'
          type: string
          example: sig
        'n':
          description: RSA modulus, base64url-encoded
          type: string
          example: uUp7zN1...
        e:
          description: RSA public exponent, base64url-encoded
          type: string
          example: AQAB
        status:
          description: >-
            `active`: signs the new tokens; `trusted`: no longer signs, but
            verifies the tokens already issued; `retired`: verifies the tokens
            already issued until they expire, then leaves the set
          type:
            - string
            - 'null'
          example: trusted
      type: object
    JwksResponse:
      description: Public keys of the API (JSON Web Key Set)
      required:
        - keys
      properties:
        keys:
          description: Keys that verify the tokens, each with its status
          type: array
          items:
            $ref: '#/components/schemas/JwkKey'
      type: object
    OAuthAudience:
      description: >-
        Audience of an access token: `api-public` for the public API,
        `api-internal` for the internal one
      type: string
      enum:
        - api-public
        - api-internal
      example: api-public
    HostingSslCertificateCanInstallReason:
      description: >-
        Why an SSL certificate cannot be installed on the hosting now (`GET
        /api/v3/hostings/{hosting_id}/ssl-certificates/can-install`)
      type: string
      enum:
        - ALREADY_INSTALLED
        - CNAME_MISSING
        - LIMIT_REACHED
        - MAIL_NOT_SUPPORTED
        - OPERATION_RUNNING
      example: CNAME_MISSING
    BuyPrepaidCreditTopupRequest:

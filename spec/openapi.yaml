        '429':
          $ref: '#/components/responses/TooManyRequests'
      security:
        - oauth2:
            - domains:read
  /api/v3/domains/{domain_id}/dnssec/can-deactivate:
    get:
      tags:
        - Domains
      summary: Can deactivate DNSSEC
      description: Know if it's possible to deactivate DNSSEC
      operationId: canDeactivateDomainDnssec
      parameters:
        - name: domain_id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DomainDnssecCanDeactivateResponse'
        '400':
          description: Bad request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '401':
          description: Not authorized
          content:

            - hosting:write
  /api/v3/hostings/{hosting_id}/ssl-certificates/can-install:
    get:
      tags:
        - Hosting
      summary: Can install SSL certificate on hosting
      description: >-
        Checks, with the rules of the installation (`POST
        /api/v3/hostings/{hosting_id}/ssl-certificates`) and its fields in the
        query, whether the SSL certificate can be installed on the hosting now,
        and why not: a certificate already installed, the CNAME record that
        delegates the validation of Let's Encrypt missing from DNS that are not
        on our nameservers (`dns_delegation` has the record to create), the
        limit of Let's Encrypt installations, an operation running. With DNS on
        our nameservers the installation creates the CNAME record by itself.
        Invalid fields respond 400, as in the installation
      operationId: canInstallHostingSslCertificate
      parameters:
        - $ref: '#/components/parameters/HostingId'
        - name: ssl_certificate_id
          in: query
          description: >-
            Id of the purchased SSL certificate to install (`GET
            /api/v3/ssl-certificates/{ssl_certificate_id}`); omit it for a Let's
            Encrypt certificate
          required: false
          schema:
            type:
              - integer
              - 'null'
        - name: destination_type
          in: query
          description: >-
            Where to install the certificate: `web` for the website, `mail` for
            the mail servers, `all` for both. When omitted, `all` on a main
            hosting and `web` on a subdomain, where only `web` is allowed
          required: false
          schema:
            type: string
            enum:
              - all
              - web
              - mail
        - name: cn_type
          in: query
          description: >-
            Type of the Let's Encrypt certificate: `NORMAL`, or `WILDCARD` for a
            wildcard certificate. Omit this parameter if you're sending
            `ssl_certificate_id`.
          required: false
          schema:
            type: string
            default: WILDCARD
            enum:
              - NORMAL
              - WILDCARD
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HostingSslCertificateCanInstallResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/ServerError'
      security:
        - oauth2:
            - hosting:read

  responses:
    BadRequest:
      description: >-
        The request is not valid: error 1000 with the errors for each field in
        `meta.errors`, error 1001 (or 1) for other invalid input
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
    Unauthorized:
      description: >-
        The access token is missing, invalid, expired or revoked (error 1100):
        request a new token and retry once
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
    Forbidden:
      description: >-
        The access token is valid but not enough: missing scope (error 1101),
        token for the other API (error 1102), missing permission, feature not
        included in the plan, operation not available to sub-accounts, internal
        API without administrator privileges or IP address not allowed (error
        1601). A new token does not change the result
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
    PaymentDeclined:
      description: >-
        The payment provider declined the payment (error 1700): the message is
        the one of the provider, and the orders are still to be paid
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
    NotFound:
      description: >-
        The resource does not exist or does not belong to the account (error
        1200)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
    ServerError:
      description: Unexpected server error (error 1500)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
    Conflict:
      description: >-
        The request conflicts with a business rule or with the current state of
        the resource (error 1400)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
    TooManyRequests:
      description: >-
        Too many requests (error 1300): retry after the seconds in the
        `Retry-After` header
      headers:
        Retry-After:
          description: Seconds to wait before retrying
          schema:
            type: integer
            minimum: 1
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
    TokenTooManyRequests:
      description: >-
        Too many requests to the token endpoint (OAuth2 error `rate_limited`):
        retry after the seconds in the `Retry-After` header
      headers:
        Retry-After:
          description: Seconds to wait before retrying
          schema:
            type: integer
            minimum: 1
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/OAuthError'
  parameters:

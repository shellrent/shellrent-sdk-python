          type: array
          items:
            type: integer
      type: object
      additionalProperties: false
    HostingModSecurityRuleCreateRequest:
      description: ModSecurity rule to disable on the hosting
      required:
        - rule_number
      properties:
        rule_number:
          description: Number of the ModSecurity rule to disable on the hosting
          type: integer
        description:
          description: >-
            Description of the rule; used only when the hosting does not have
            the rule yet
          type: string
      type: object
      additionalProperties: false
    HostingModSecurityUpdateRequest:
      required:
        - enable
      properties:
        enable:
          description: Whether to enable (true) or disable (false) ModSecurity
          type: boolean
      type: object
      additionalProperties: false
    HostingPhpSettingsUpdateRequest:
      required:
        - setting
        - value
      properties:
        setting:
          description: PHP directive to change
          type: string
          enum:
            - opcache.enable
            - display_errors
            - memory_limit
            - post_max_size
            - upload_max_filesize
            - max_execution_time
            - max_input_time
        value:
          description: >-
            New value of the directive. Suggested values: opcache.enable 1 or 0;
            display_errors On or Off; memory_limit from 64M to 512M (64M, 96M,
            128M, 160M, 192M, 224M, 256M, 288M, 320M, 384M, 448M, 512M);
            post_max_size and upload_max_filesize from 1M to 512M (1M, 2M, 4M,
            8M, 16M, 24M, 32M, 40M, 48M, 64M, 80M, 96M, 112M, 128M, 160M, 192M,
            224M, 256M, 512M); max_execution_time and max_input_time in seconds,
            from 10 to 600. Other values are accepted if they are numbers,
            optionally followed by M, between the smallest and the largest
            suggested value
          type: string
      type: object
      additionalProperties: false
    HostingPhpVersionUpdateRequest:
      required:
        - version
      properties:
        version:
          description: >-
            PHP version, one of those returned by `GET
            /api/v3/hostings/{hosting_id}/php-versions` (e.g. `8.3`)
          type: string
      type: object
      additionalProperties: false
    HostingSslCertificateInstallRequest:
      description: >-
        SSL certificate to install on the hosting; with no body, a wildcard
        Let's Encrypt certificate for the website and the mail of a main
        hosting, or for the website of a subdomain
      properties:
        ssl_certificate_id:
          description: >-
            Id of a purchased SSL certificate to install (`GET
            /api/v3/ssl-certificates/{ssl_certificate_id}`): an active
            certificate of the owner of the hosting, a wildcard one or one with
            SAN to install it also on the mail servers. Omit it, or send null,
            to install a Let's Encrypt certificate, issued if the hosting has
            none: when the DNS of the domain are not on our nameservers, the
            issue requires the CNAME record that delegates the DNS validation
            (`GET /api/v3/hostings/{hosting_id}/ssl-certificates/can-install`)
          type:
            - integer
            - 'null'
        destination_type:
          description: >-
            Where to install the certificate: `web` for the website, `mail` for
            the mail servers, `all` for both. When omitted, `all` on a main
            hosting and `web` on a subdomain, where only `web` is allowed.
            `mail` and `all` require a Let's Encrypt `cn_type` `WILDCARD`
          type: string
          enum:
            - all
            - web
            - mail
        cn_type:
          description: >-
            Type of the certificate: `NORMAL`, or `WILDCARD` for a wildcard
            certificate. Without `ssl_certificate_id` it chooses the Let's
            Encrypt certificate to install. Omit this field if you're sending
            `ssl_certificate_id`.
          type: string
          default: WILDCARD
          enum:
            - NORMAL
            - WILDCARD
      type: object
      additionalProperties: false
    HostingSubdomainCreateRequest:
      required:
        - level_name
      properties:
        level_name:

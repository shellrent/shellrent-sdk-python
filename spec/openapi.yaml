openapi: 3.1.0
info:
  title: API Shellrent
  description: >-
    REST API to manage the services of your Shellrent account automatically:
    domains, hosting, servers, storage, SSL certificates, purchases and billing.
    Access uses OAuth2 (client credentials), with a set of scopes for each area.
  version: 3.0.0
servers:
  - url: https://api.shellrent.com
    description: Server
security:
  - oauth2: []
tags:
  - name: OAuth
    description: Authentication and JWKS
  - name: Health
    description: Service status
  - name: Account
    description: Account
  - name: Billing
    description: Billing
  - name: Payment
    description: Payment
  - name: Purchases
    description: Purchases
  - name: Shop
    description: Shop
  - name: Domains
    description: Domains
  - name: Hosting
    description: Web Hosting
  - name: Server
    description: Server
  - name: Monitoring
    description: Monitoring
  - name: Ssl
    description: SSL Certificates
  - name: License
    description: License
  - name: Pec
    description: PEC
  - name: Storage
    description: Storage
  - name: Sms
    description: SMS
paths:
  /api/health:
    get:
      tags:
        - Health
      summary: Check the service status
      description: Returns the current status of the API.
      operationId: getHealth
      responses:
        '200':
          description: Service up
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthStatusResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/ServerError'
      security:
        - oauth2: []
  /api/v3/account:
    get:
      tags:
        - Account
      summary: My user account
      description: Get all details of my user account
      operationId: getAccount
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccountResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/ServerError'
      security:
        - oauth2:
            - account:read
  /api/v3/credit-notes:
    get:
      tags:
        - Billing
      summary: List all Credit notes
      description: |-
        Get a list of all Credit notes

        Not available to sub-accounts: the response is 403 (error 1601).
      operationId: listCreditNotes
      parameters:
        - name: date_emission_from
          in: query
          description: Only the credit notes issued on or after this date (YYYY-MM-DD)
          required: false
          schema:
            type: string
            format: date
        - name: date_emission_to
          in: query
          description: Only the credit notes issued on or before this date (YYYY-MM-DD)
          required: false
          schema:
            type: string
            format: date
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PerPage'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreditnotePaginatedListResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/ServerError'
      security:
        - oauth2:
            - billing:read
      x-sub-accounts: false
  /api/v3/credit-notes/{credit_note_id}:
    get:
      tags:
        - Billing
      summary: Get a Credit note
      description: |-
        Get details of a credit note

        Not available to sub-accounts: the response is 403 (error 1601).
      operationId: getCreditNote
      parameters:
        - $ref: '#/components/parameters/CreditNoteId'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreditnoteResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/ServerError'
      security:
        - oauth2:
            - billing:read
      x-sub-accounts: false
  /api/v3/credit-notes/{credit_note_id}/rows:
    get:
      tags:
        - Billing
      summary: List all credit note rows
      description: |-
        Get the list of all the rows of a Credit Note

        Not available to sub-accounts: the response is 403 (error 1601).
      operationId: listCreditNoteRows
      parameters:
        - $ref: '#/components/parameters/CreditNoteId'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreditnoteRowListResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/ServerError'
      security:
        - oauth2:
            - billing:read
      x-sub-accounts: false
  /api/v3/credit-notes/{credit_note_id}/rows/{row_id}:
    get:
      tags:
        - Billing
      summary: Get a credit note row
      description: |-
        Get details of a Credit note row

        Not available to sub-accounts: the response is 403 (error 1601).
      operationId: getCreditNoteRow
      parameters:
        - $ref: '#/components/parameters/CreditNoteId'
        - $ref: '#/components/parameters/RowId'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreditnoteRowResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/ServerError'
      security:
        - oauth2:
            - billing:read
      x-sub-accounts: false
  /api/v3/credit-notes/{credit_note_id}/xml:
    get:
      tags:
        - Billing
      summary: Download credit note XML
      description: |-
        Download the XML file of a Credit note

        Not available to sub-accounts: the response is 403 (error 1601).
      operationId: downloadCreditNoteXml
      parameters:
        - $ref: '#/components/parameters/CreditNoteId'
        - name: prefer_xml
          in: query
          description: >-
            If the credit note is signed, the original p7m file is returned; to
            force the download of the XML version, set this parameter to true
          required: false
          schema:
            type: boolean
      responses:
        '200':
          description: OK (file download)
          headers:
            Content-Length:
              description: File size in bytes.
              schema:
                type: integer
                format: int64
            Content-Disposition:
              description: Filename and content disposition (attachment).
              schema:
                type: string
            Last-Modified:
              description: File last modified datetime.
              schema:
                type: string
            Cache-Control:
              description: Cache directive.
              schema:
                type: string
            X-Content-Type-Options:
              description: Mime sniffing protection.
              schema:
                type: string
          content:
            text/xml:
              schema:
                type: string
                format: binary
            application/x-pkcs7-mime:
              schema:
                type: string
                format: binary
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/ServerError'
      security:
        - oauth2:
            - billing:read
      x-sub-accounts: false
  /api/v3/credit-notes/{credit_note_id}/pdf:
    get:
      tags:
        - Billing
      summary: Download credit note PDF
      description: |-
        Download the courtesy PDF file of a Credit note

        Not available to sub-accounts: the response is 403 (error 1601).
      operationId: downloadCreditNotePdf
      parameters:
        - $ref: '#/components/parameters/CreditNoteId'
      responses:
        '200':
          description: OK (file download)
          headers:
            Content-Length:
              description: Size of the file in bytes.
              schema:
                type: integer
                format: int64
            Content-Disposition:
              description: Filename and content disposition (attachment).
              schema:
                type: string
            Last-Modified:
              description: File last modified datetime.
              schema:
                type: string
            Cache-Control:
              description: Cache directive.
              schema:
                type: string
            X-Content-Type-Options:
              description: Mime sniffing protection.
              schema:
                type: string
          content:
            application/pdf:
              schema:
                type: string
                format: binary
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/ServerError'
      security:
        - oauth2:
            - billing:read
      x-sub-accounts: false
  /api/v3/domains:
    get:
      tags:
        - Domains
      summary: List domains
      description: Get a list of all Domains
      operationId: listDomains
      parameters:
        - name: domain_full_name
          in: query
          description: Search by punycode domain name (exact match)
          required: false
          schema:
            type: string
        - name: domain_name
          in: query
          description: Search by punycode domain name (partial)
          required: false
          schema:
            type: string
        - name: tld_id
          in: query
          description: Obtain all domains by ID of TLD
          required: false
          schema:
            type: integer
        - name: tld_extension
          in: query
          description: Obtain all domains by TLD extension (punycode)
          required: false
          schema:
            type: string
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PerPage'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DomainPaginatedListResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/ServerError'
      security:
        - oauth2:
            - domains:read
  /api/v3/domains/{domain_id}:
    get:
      tags:
        - Domains
      summary: Get domain
      description: >-
        Get a domain. Unlike the list, it has dnssec_enabled, which needs the
        DNS zone of the domain
      operationId: getDomain
      parameters:
        - $ref: '#/components/parameters/DomainId'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DomainDetailResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/ServerError'
      security:
        - oauth2:
            - domains:read
  /api/v3/domains/availability:
    get:
      tags:
        - Domains
      summary: Domain whois
      description: >-
        Search availability status for a domain (whois). A premium domain, sold
        at a price set by the registry, comes with our prices, which its order
        (`POST /api/v3/shop/domain`) uses; sub-accounts get no prices
      operationId: checkDomainAvailability
      parameters:
        - name: domain_full_name
          in: query
          description: Punycode full domain name (with TLD extension)
          required: false
          schema:
            type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DomainAvailabilityResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/ServerError'
      security:
        - oauth2:
            - domains:read
  /api/v3/domains/{domain_id}/dnssec:
    get:
      tags:
        - Domains
      summary: DNSSEC
      description: Get DNSSEC data records
      operationId: getDomainDnssec
      parameters:
        - $ref: '#/components/parameters/DomainId'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DomainDnssecResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/ServerError'
      security:
        - oauth2:
            - domains:read
    post:
      tags:
        - Domains
      summary: Activate DNSSEC
      description: >-
        Activate DNSSEC (for domains with "standard" nameservers only). When the
        purchase of the domain is suspended, the request is rejected with 409
      operationId: activateDomainDnssec
      parameters:
        - $ref: '#/components/parameters/DomainId'
      responses:
        '202':
          description: >-
            Accepted: the operation goes on in the background, as the returned
            Task
          headers:
            Location:
              description: >-
                URL of the Task: `/api/v3/tasks/{task_id}`. Reading it requires
                the `purchases:read` scope
              required: true
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TaskResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/ServerError'
      security:
        - oauth2:
            - domains:write
    delete:
      tags:
        - Domains
      summary: Deactivate DNSSEC
      description: >-
        Deactivate DNSSEC (for domains with "standard" nameservers) or remove
        all DNSSEC data records (for domains with "external" nameservers). When
        the purchase of the domain is suspended, the request is rejected with
        409
      operationId: deactivateDomainDnssec
      parameters:
        - $ref: '#/components/parameters/DomainId'
      responses:
        '202':
          description: >-
            Accepted: the operation goes on in the background, as the returned
            Task
          headers:
            Location:
              description: >-
                URL of the Task: `/api/v3/tasks/{task_id}`. Reading it requires
                the `purchases:read` scope
              required: true
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TaskResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/ServerError'
      security:
        - oauth2:
            - domains:write
    patch:
      tags:
        - Domains
      summary: Change DNSSEC data
      description: >-
        Add or change DNSSEC data records (for domains with "external"
        nameservers only). When the purchase of the domain is suspended, the
        request is rejected with 409
      operationId: updateDomainDnssec
      parameters:
        - $ref: '#/components/parameters/DomainId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DomainDnssecRequest'
      responses:
        '202':
          description: >-
            Accepted: the operation goes on in the background, as the returned
            Task
          headers:
            Location:
              description: >-
                URL of the Task: `/api/v3/tasks/{task_id}`. Reading it requires
                the `purchases:read` scope
              required: true
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TaskResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/ServerError'
      security:
        - oauth2:
            - domains:write
  /api/v3/domains/{domain_id}/dnssec/can-activate:
    get:
      tags:
        - Domains
      summary: Can activate DNSSEC
      description: Know if it's possible to activate DNSSEC
      operationId: canActivateDomainDnssec
      parameters:
        - $ref: '#/components/parameters/DomainId'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DomainDnssecCanActivateResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/ServerError'
      security:
        - oauth2:
            - domains:read
  /api/v3/domains/{domain_id}/dnssec/can-deactivate:
    get:
      tags:
        - Domains
      summary: Can deactivate DNSSEC
      description: Know if it's possible to deactivate DNSSEC
      operationId: canDeactivateDomainDnssec
      parameters:
        - $ref: '#/components/parameters/DomainId'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DomainDnssecCanDeactivateResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/ServerError'
      security:
        - oauth2:
            - domains:read
  /api/v3/domains/{domain_id}/dns:
    get:
      tags:
        - Domains
      summary: DNS Zone
      description: DNS Zone details
      operationId: getDomainDnsZone
      parameters:
        - $ref: '#/components/parameters/DomainId'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DnsZoneResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/ServerError'
      security:
        - oauth2:
            - domains:read
    patch:
      tags:
        - Domains
      summary: Change DNS Zone data
      description: >-
        Changes the TTL of the DNS zone of the domain and returns the zone. Only
        the zones on our nameservers (standard and external types) have a TTL,
        which is also the TTL of all their records: with the Cloudflare
        nameservers the response is 409. 404 when the domain has no DNS zone
      operationId: updateDomainDnsZone
      parameters:
        - $ref: '#/components/parameters/DomainId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DomainDnsZoneRequest'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DnsZoneResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/ServerError'
      security:
        - oauth2:
            - domains:write
  /api/v3/domains/{domain_id}/dns/can-change-nameservers:
    get:
      tags:
        - Domains
      summary: Can change Nameservers
      description: Know if it's possible to change Nameservers
      operationId: canChangeDomainNameservers
      parameters:
        - $ref: '#/components/parameters/DomainId'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DomainCanChangeNameserversResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/ServerError'
      security:
        - oauth2:
            - domains:read
  /api/v3/domains/{domain_id}/dns/standard:
    put:
      tags:
        - Domains
      summary: 'Nameservers: standard'
      description: Activate "standard" nameservers on domain
      operationId: setDomainStandardNameservers
      parameters:
        - $ref: '#/components/parameters/DomainId'
      responses:
        '202':
          description: >-
            Accepted: the operation goes on in the background, as the returned
            Task
          headers:
            Location:
              description: >-
                URL of the Task: `/api/v3/tasks/{task_id}`. Reading it requires
                the `purchases:read` scope
              required: true
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TaskResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':

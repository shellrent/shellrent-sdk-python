            - integer
            - 'null'
        status_code:
          description: >-
            Status of the scan: `RUNNING`, `FAILED`, `SUCCESS` (no infection
            found) or `PROBLEM` (infections found)
          type:
            - string
            - 'null'
        status_name:
          description: Translated name of the status, for display
          type:
            - string
            - 'null'
        status_color:
          description: Color of the status, in hexadecimal, for display
          type:
            - string
            - 'null'
        antivirus_type:
          description: 'Type of the scan: `M` manual, `A` automatic'
          type: string
        date_started:
          description: >-
            Start of the scan, as sent by the antivirus; null until the scan
            completes, and for a failed scan
          type:
            - string
            - 'null'
          format: date-time
        date_completed:
          description: >-
            End of the scan, as sent by the antivirus; null until the scan
            completes, and for a failed scan
          type:
            - string
            - 'null'
          format: date-time
        date_timeout:
          description: >-
            When the scan was marked as failed because it ran too long; null
            otherwise
          type:
            - string
            - 'null'
          format: date-time
        total_files:
          description: Files scanned; null when zero, and until the scan completes
          type:
            - integer
            - 'null'
        total_infected:
          description: Infected files found; null when zero, and until the scan completes
          type:
            - integer
            - 'null'
        total_cleaned:
          description: >-
            Infected files cleaned by the antivirus; null when zero, and until
            the scan completes
          type:
            - integer
            - 'null'
      type: object
    HostingBackup:
      description: >-
        Backup that contains the hosting: a backup of a web, database or mail
        server, with the database or the mailbox of the hosting that it saved
      required:
        - hosting_backup_id
        - hosting_id
        - backup_id
        - category
        - backup_type_code
        - backup_frequency_code
        - backup_date
        - backup_size
        - backup_duration
        - exit_status
        - error_type
        - mailbox_name
        - database_name
        - date_created
      properties:
        hosting_backup_id:
          description: >-
            Id of the backup in the hosting (`GET
            /api/v3/hostings/{hosting_id}/backups/{hosting_backup_id}`)
          type: integer
        hosting_id:
          description: Id of the hosting (`GET /api/v3/hostings/{hosting_id}`)
          type: integer
        backup_id:
          description: >-
            Id of the server backup, which can include other hostings: send it
            to `POST /api/v3/hostings/{hosting_id}/backups/exhibitions`
          type: integer
        category:
          description: >-
            Category of the backed up server: `web` (web contents), `database`
            or `mail`
          type:
            - string
            - 'null'
        backup_type_code:
          description: >-
            Type of the backup, for example `HOSTING_DAILY`, `HOSTING_WEEKLY`,
            `HOSTING_MONTHLY` or `HOSTING_UNA_TANTUM` (one-off backup)
          type:
            - string
            - 'null'
        backup_frequency_code:
          description: >-
            Frequency of the backup: `D` daily, `W` weekly, `M` monthly, `C`
            one-off
          type:
            - string
            - 'null'
        backup_date:
          description: When the server backup was taken
          type:
            - string
            - 'null'
          format: date-time
        backup_size:
          description: 'Size of the server backup, in MB: it can include other hostings'
          type:
            - integer
            - 'null'
        backup_duration:
          description: Duration of the server backup, as `HH:MM:SS`
          type:
            - string
            - 'null'
        exit_status:
          description: 'Exit code of the server backup: 0 when it succeeded'
          type:
            - integer
            - 'null'
        error_type:
          description: >-
            Outcome message of the server backup, in Italian, for example `Tutto
            ok` (all fine)
          type:
            - string
            - 'null'
        mailbox_name:
          description: >-
            Mailbox saved, for a backup of category `mail`; null for the other
            categories
          type:
            - string
            - 'null'
        database_name:
          description: >-
            Database saved, for a backup of category `database`; null for the
            other categories
          type:
            - string
            - 'null'
        date_created:
          type:
            - string
            - 'null'
          format: date-time
      type: object
    HostingCredential:
      description: Active FTP or database account of the hosting, with its password
      required:
        - credential_id
        - type
        - username
        - password
        - root_path
        - is_active
      properties:
        credential_id:
          type: integer
        type:
          description: >-
            Type of the account: `FTP` (main FTP account), `FTP_SECONDARY`
            (additional FTP account), `DATABASE_MYSQL` or `DATABASE_MSSQL`
            (database account)
          type: string
        username:
          type: string
        password:
          description: >-
            Password of the account, in clear text, as in the control panel: a
            temporary random one while the account is suspended
          type: string
        root_path:
          description: >-
            Root directory of an `FTP_SECONDARY` account; null for the other
            accounts
          type:
            - string
            - 'null'
        is_active:
          description: Whether the account is active
          type: boolean
      type: object
    HostingCronjob:
      description: 'Cron job of the hosting: a URL called on a schedule'
      required:
        - cronjob_id
        - hosting_id
        - purchase_id
        - request_url
        - http_request_method
        - plan_month
        - plan_monthday
        - plan_weekday
        - plan_hour
        - plan_minute
        - active
        - date_created
        - date_disabled
      properties:
        cronjob_id:
          type: integer
        hosting_id:
          description: >-
            Id of the hosting of the request: cron jobs belong to the purchase,
            so a subdomain lists those of its main hosting
          type: integer
        purchase_id:
          description: >-
            Id of the purchase of the hosting (`GET
            /api/v3/purchases/{purchase_id}`)
          type: integer
        request_url:
          description: URL called by the cron job, with the protocol
          type: string
        http_request_method:
          description: 'HTTP method of the call: `GET` or `POST`'
          type:
            - string
            - 'null'
        plan_month:
          description: >-
            Months, from 1 (January) to 12 (December), as a comma-separated list
            like in the creation (for example `1,6`); null for every month
          type:
            - string
            - 'null'
        plan_monthday:
          description: >-
            Days of the month, from 1 to 31, as a comma-separated list like in
            the creation (for example `1,15`); null for every day
          type:
            - string
            - 'null'
        plan_weekday:
          description: >-
            Days of the week, from 1 (Monday) to 7 (Sunday), as a
            comma-separated list like in the creation (for example `1,5`); null
            for every day of the week
          type:
            - string
            - 'null'
        plan_hour:
          description: >-
            Hours, from 0 to 23, as a comma-separated list like in the creation
            (for example `0,12`); null for every hour
          type:
            - string
            - 'null'
        plan_minute:
          description: >-
            Minutes, from 0 to 59, as a comma-separated list like in the
            creation (for example `0,30`); null for every minute
          type:
            - string
            - 'null'
        active:
          description: >-
            Whether the cron job is active: deleted cron jobs, and the old
            versions of changed ones, stay in the list as inactive
          type: boolean
        date_created:
          type:
            - string
            - 'null'
          format: date-time
        date_disabled:
          description: >-
            When the cron job was deleted or replaced by a new version; null
            while it is active
          type:
            - string
            - 'null'
          format: date-time
      type: object
    HostingDatabase:
      description: Database of the hosting, with the account that owns it
      required:
        - database_id
        - name
        - type
        - credential_id
        - username
        - supplier_code
        - table_count
      properties:
        database_id:
          description: 'Id of the database: its name'
          type: string
        name:
          type: string
        type:
          description: 'Type of the database: `MYSQL` or `MSSQL` (Microsoft SQL Server)'
          type: string
        credential_id:
          description: >-
            Id of the database account that owns the database, as in `GET
            /api/v3/hostings/{hosting_id}/credentials`
          type:
            - integer
            - 'null'
        username:
          description: Username of the database account
          type:
            - string
            - 'null'
        supplier_code:
          description: >-
            Id of the database on Plesk, for the hostings managed with Plesk;
            null for the others
          type:
            - string
            - 'null'
        table_count:
          description: Number of tables in the database; null for the databases on Plesk
          type:
            - integer
            - 'null'
      type: object
    HostingDnsRecord:
      description: >-
        Default DNS record of the hosting, from its web server or its mail
        server
      required:
        - dns_record_id
        - type
        - host
        - destination
        - priority
        - weight
        - port
        - service
        - protocol
        - caa_flag
        - caa_tag
        - caa_can_sign_http_exchanges
        - tlsa_usage
        - tlsa_selector
        - tlsa_matching_type
      properties:
        dns_record_id:
          type: integer
        type:
          description: Type of the record, for example `A`, `CNAME`, `MX`, `TXT` or `SRV`
          type: string
        host:
          description: >-
            Name of the record relative to the domain: `@` for the domain
            itself, otherwise for example `www` or `mail`
          type: string
        destination:
          description: >-
            Value of the record: the IP address of `A` records, the target host
            of `CNAME`, `MX` and `SRV` records, the text of `TXT` records
          type: string
        priority:
          description: Priority of `MX` and `SRV` records
          type:
            - integer
            - 'null'
        weight:
          description: Weight of `SRV` records
          type:
            - integer
            - 'null'
        port:
          description: Port of `SRV` records
          type:
            - integer
            - 'null'
        service:
          description: >-
            Service of `SRV` records (for example `_autodiscover`) and port of
            `TLSA` records
          type:
            - string
            - 'null'
        protocol:
          description: 'Protocol of `SRV` and `TLSA` records: `_tcp`, `_udp` or `_tls`'
          type:
            - string
            - 'null'
        caa_flag:
          description: Flag of `CAA` records
          type:
            - integer
            - 'null'
        caa_tag:
          description: >-
            Tag of `CAA` records: `issue`, `issuewild`, `iodef-http` or
            `iodef-mail`
          type:
            - string
            - 'null'
        caa_can_sign_http_exchanges:
          description: >-
            Whether the `CAA` record allows certificates for signed HTTP
            exchanges (`cansignhttpexchanges=yes`)
          type:
            - boolean
            - 'null'
        tlsa_usage:
          description: >-
            Certificate usage of `TLSA` records: 0 PKIX-TA, 1 PKIX-EE, 2
            DANE-TA, 3 DANE-EE
          type:
            - integer
            - 'null'
        tlsa_selector:
          description: >-
            Selector of `TLSA` records: 0 for the full certificate, 1 for the
            public key
          type:
            - integer
            - 'null'
        tlsa_matching_type:
          description: >-
            Matching type of `TLSA` records: 0 for the exact data, 1 for
            SHA-256, 2 for SHA-512
          type:
            - integer
            - 'null'
      type: object
    HostingEmailAlias:

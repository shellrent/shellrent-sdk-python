  /.well-known/jwks.json:
    get:
      tags:
        - OAuth
      summary: Esponi JWKS
      description: Restituisce le chiavi pubbliche usate per firmare gli access token JWT.
      operationId: getJwks
      responses:
        '200':
          description: Chiavi disponibili
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JwksResponse'
        '500':
          description: Impossibile esporre il JWKS
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OAuthError'
      security: []
  /oauth/token:
    post:
      tags:
        - OAuth
      summary: Richiedi un access token
      description: >-
        Eroga un access token JWT tramite grant `client_credentials`. I
        parametri `audience` e `scope` sono opzionali: senza `audience` il token
        usa l'unica audience del client (un client con più audience deve
        indicarla), senza `scope` riceve tutti gli scope assegnati al client,
        come con `scope=api:full`. Gli scope interni sono concessi solo con
        audience `api-internal`. La risposta riporta l'audience e gli scope
        concessi.
      operationId: requestAccessToken
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              required:
                - grant_type
              properties:
                grant_type:
                  type: string
                  enum:
                    - client_credentials
                client_id:
                  description: Client ID se non fornito tramite Authorization header Basic.
                  type:
                    - string
                    - 'null'
                client_secret:
                  description: >-
                    Client secret se non fornito tramite Authorization header
                    Basic.
                  type:
                    - string
                    - 'null'
                scope:
                  description: >-
                    Scope separati da spazio. Se omesso: tutti gli scope
                    assegnati al client.
                  type:
                    - string
                    - 'null'
                audience:
                  description: 'Se omessa: l''unica audience del client.'
                  anyOf:
                    - $ref: '#/components/schemas/OAuthAudience'
                    - type: 'null'
              type: object
      responses:
        '200':
          description: Token emesso
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OAuthTokenResponse'
        '400':
          description: Richiesta non valida
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OAuthError'
        '401':
          description: Autenticazione client fallita
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OAuthError'
        '429':
          $ref: '#/components/responses/TokenTooManyRequests'
        '500':
          description: Errore inatteso
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OAuthError'
      security: []
components:
  schemas:
    ApiError:
      required:
        - error
        - message
        - data
        - meta
      properties:
        error:
          description: Codice d'errore maggiore di zero
          type: integer
          minimum: 1
          example: 400
        message:
          type: string
          example: Invalid request
        data:
          description: Null nelle risposte d'errore
          type:
            - object
            - 'null'
        meta:
          description: Null nelle risposte d'errore
          type:
            - object
            - 'null'
      type: object
    PaginationMeta:
      required:
        - total
        - count
        - pages
        - page
        - per_page
      properties:
        total:
          type: integer
        count:
          type: integer
        pages:
          type: integer
        page:
          type: integer
        per_page:
          type: integer
      type: object
    SimplePaginationMeta:
      required:
        - count
        - page
        - per_page
        - next
      properties:
        count:
          type: integer
        page:
          type: integer
        per_page:
          type: integer
        next:
          description: Tells if there is another page after this one
          type: boolean
      type: object
    HealthStatus:
      required:
        - status
      properties:
        status:
          type: string
          example: ok
      type: object
    OAuthTokenResponse:
      required:
        - token_type
        - expires_in
        - access_token
        - scope
        - audience
      properties:
        token_type:
          type: string
          example: Bearer
        expires_in:
          type: integer
          example: 600
        access_token:
          type: string
          example: eyJhbGciOiJSUzI1NiIsInR5cCI6IkpXVCJ9…
        scope:
          description: Elenco degli scope concessi separati da spazio
          type: string
          example: purchases:read purchases:write
        audience:
          description: Audience associata al token
          type: string
          example: api-public
      type: object
    OAuthError:
      required:
        - error
      properties:
        error:
          type: string
          example: invalid_client
        error_description:
          type:
            - string
            - 'null'
          example: Client authentication failed.
        error_uri:
          type:
            - string
            - 'null'
          example: https://docs.shellrent.com/oauth/errors#invalid_client
      type: object
    JwkKey:
      required:
        - kid
        - kty
        - alg
        - use
        - 'n'
        - e
      properties:
        kid:
          type: string
          example: api-key-20240101
        kty:
          type: string
          example: RSA
        alg:
          type: string
          example: RS256
        use:
          type: string
          example: sig
        'n':
          description: Modulo base64url
          type: string
          example: uUp7zN1...
        e:
          description: Esponente base64url
          type: string
          example: AQAB
        status:
          type:
            - string
            - 'null'
          example: trusted
      type: object
    JwksResponse:
      required:
        - keys
      properties:
        keys:
          type: array
          items:
            $ref: '#/components/schemas/JwkKey'
      type: object
    OAuthAudience:
      type: string
      enum:
        - api-public
        - api-internal
      example: api-public
    BuyPrepaidCreditTopupRequest:
      required:
        - amount
      properties:
        amount:
          description: Topup amount.
          type: integer
          enum:
            - 50
            - 100
            - 150
            - 200
            - 300
            - 500
            - 800
            - 1000
            - 1500
            - 2000
      type: object
    BuyServiceActiveMonitoringRequest:
      required:
        - service_id
      properties:
        service_id:
          description: ID of the Service to buy
          type: integer
        account_id:
          description: >-
            ID of the account of the user that will be the owner of the purchase
            (available to Resellers only)
          type: integer
        data:
          description: Target to monitor with the Active Monitoring service
          properties:
            purchase_id_server:
              description: >-
                Use this to activate Active Monitoring on an already active
                Server by specifying the server_id
              type: integer
            ip_address:
              description: >-
                Use this to activate Active Monitoring on an additional IP
                address of an already active Server
              type: string
            vswitch_ip_addess:
              description: >-
                Use this to activate Active Monitoring on an IP address of an
                already active vSwitch service
              type: string
            external_hostname:
              description: Specify the hostname of an external host or server
              type: string
            external_ip_address:
              description: Specify the IP address of an external host or server to monitor
              type: string
            external_ip_address_description:
              description: >-
                Specify a description for the external IP address (e.g. the
                corresponding hostname)
              type: string
          type: object
          additionalProperties: false
      type: object
    BuyServiceCloudStorageRequest:
      required:
        - service_id
      properties:
        service_id:
          description: ID of the Service to buy
          type: integer
        recurrence_id:
          description: ID of the Recurrence to assign to the purchased service
          type: integer
        account_id:
          description: >-

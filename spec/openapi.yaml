    HostingEmailBlockList:
      description: >-
        Sender in the block list of the antispam of the mail domain of the
        hosting: a whole domain or an address
      required:
        - block_list_id
        - hosting_id
        - sender
        - domain
        - mailbox
      properties:
        block_list_id:
          type: integer
        hosting_id:
          description: Id of the hosting (`GET /api/v3/hostings/{hosting_id}`)
          type: integer
        sender:
          description: 'Sender of the entry: the domain or the address'
          type:
            - string
            - 'null'
        domain:
          description: Sender domain; null when the entry is for an address
          type:
            - string
            - 'null'
        mailbox:
          description: Sender address; null when the entry is for a whole domain
          type:
            - string
            - 'null'
          format: email
      type: object
    HostingEmailCatchAll:
      description: Catch-all of the mail domain of the hosting
      required:
        - is_active
        - address
        - address_idna
        - destinations
      properties:
        is_active:
          description: >-
            Whether the catch-all is set: mail sent to addresses of the domain

        - app_host
        - group_disk_used_bytes
        - date_sync
      properties:
        cloud_storage_id:
          type: integer
        purchase_id:
          description: >-
            Id of the purchase of the cloud storage (`GET
            /api/v3/purchases/{purchase_id}`)
          type:
            - integer
            - 'null'
        name:
          description: >-
            Code of the cloud storage (7 hexadecimal characters), used in its

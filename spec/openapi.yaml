        Not available to sub-accounts: the response is 403 (error 1601).
      operationId: downloadInvoiceXml
      parameters:
        - $ref: '#/components/parameters/InvoiceId'
        - name: prefer_xml
          in: query
          description: >-
            If the invoice is signed, the original p7m file is returned; to
            force the download of the XML version, set this parameter to true
          required: false
          schema:
            type: boolean
      responses:
        '200':
          description: OK (file download)
          headers:
            Content-Length:
              description: File size in bytes.
              schema:
                type: integer
                format: int64
            Content-Disposition:
              description: Filename and content disposition (attachment).
              schema:
                type: string
            Last-Modified:
              description: File last modified datetime.
              schema:
                type: string
            Cache-Control:
              description: Cache directive.
              schema:
                type: string
            X-Content-Type-Options:
              description: Mime sniffing protection.
              schema:
                type: string
          content:
            text/xml:
              schema:
                type: string
                format: binary
            application/x-pkcs7-mime:
              schema:
                type: string
                format: binary
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':

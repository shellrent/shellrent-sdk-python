            - string
            - 'null'
        surname:
          description: Surname of the administrative contact
          type:
            - string
            - 'null'
        email:
          type:
            - string
            - 'null'
        phone:
          description: >-
            Phone of the administrative contact, usually in the form
            `0039.0123456789`: `00` and the international prefix, a dot, the
            number
          type:
            - string
            - 'null'
        address:
          type:
            - string
            - 'null'
        city:
          type:
            - string
            - 'null'
        state:
          description: >-
            Province of the administrative contact: the acronym of the Italian
            province, for example `VI`, or `EE` outside Italy
          type:
            - string
            - 'null'
        postal_code:
          type:
            - string
            - 'null'
        country:
          $ref: '#/components/schemas/Country'
        date_created:
          type: string
          format: date-time
      type: object
    AmountSimple:

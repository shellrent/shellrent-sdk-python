  /api/v3/servers/{server_id}/private-cloud/virtual-machines/{vm_id}:
    delete:
      tags:
        - Server
      summary: Delete private cloud VM
      description: >-
        Deletes a virtual machine of the private cloud `server_id`, dismissing
        its purchase; the operation goes on in the background as the returned
        Task. 404 when the virtual machine is not on the private cloud; 409 when
        `server_id` is not a private cloud, while the private cloud is not
        active or is suspended, or while the purchase of the virtual machine
        cannot be dismissed or another operation does not allow it
      operationId: deletePrivateCloudVirtualMachine
      parameters:
        - $ref: '#/components/parameters/ServerId'
        - $ref: '#/components/parameters/VmId'
      responses:
        '202':
          description: >-
            Accepted: the operation goes on in the background, as the returned
            Task
          headers:
            Location:
              description: >-
                URL of the Task: `/api/v3/tasks/{task_id}`. Reading it requires
                the `purchases:read` scope
              required: true
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TaskResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/ServerError'
      security:
        - oauth2:
            - server:write
    patch:
      tags:
        - Server
      summary: Update private cloud VM
      description: >-
        Updates the note and the resources of a private cloud VM. The change of
        cpu, ram or disk starts an asynchronous operation, returned as a Task;
        when none of them differs from the current value no operation starts and
        `data` is null.
      operationId: updatePrivateCloudVirtualMachine
      parameters:
        - $ref: '#/components/parameters/ServerId'
        - $ref: '#/components/parameters/VmId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PrivateCloudVmUpdateRequest'
      responses:
        '200':
          description: >-
            None of cpu, ram or disk changes: no operation starts and `data` is
            null
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EmptyResponse'
        '202':
          description: Operation that changes cpu, ram or disk, as the returned Task
          headers:
            Location:
              description: >-
                URL of the Task: `/api/v3/tasks/{task_id}`. Reading it requires
                the `purchases:read` scope
              required: true
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TaskResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/ServerError'
      security:
        - oauth2:
            - server:write

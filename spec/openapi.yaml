        service:
          description: Service of SRV records (e.g. `_sip`) and port of TLSA records
          type: string
        protocol:
          description: 'Protocol of SRV and TLSA records: `_tcp`, `_udp` or `_tls`'
          type: string
        destination:
          description: >-
            Value of the record: the IPv4 address for A, the IPv6 address for
            AAAA, the target hostname for CNAME, MX, NS, PTR and SRV, the text
            for TXT and SPF, the value of the tag for CAA, the certificate
            association data for TLSA
          type: string
        port:
          description: Port of the service, required for SRV records
          type: string
        weight:
          description: Weight of SRV records
          type: string
        priority:
          description: Priority of MX and SRV records
          type: string
        ttl:
          description: >-
            TTL of the record, in seconds, for the Cloudflare records that are
            not proxied (`0` or `1` for the automatic TTL); ignored with the
            standard and external nameservers, where the records have the TTL of
            the zone
          type: integer
        proxied:
          description: >-
            Whether the traffic of the record goes through the Cloudflare proxy;
            only for the Cloudflare records that can be proxied
          type: boolean
        caa_data:
          description: Use this for CAA type record only
          required:
            - flag
            - tag_value
            - can_sign_http_exchanges
          properties:
            flag:
              description: 'Flags of the CAA record: only `0` is accepted'
              type: integer
            tag_value:
              description: >-
                Tag of the CAA record, for example `issue` or `issuewild`; its
                value goes in `destination`
              type: string
            can_sign_http_exchanges:
              description: >-
                Whether to add the parameter `cansignhttpexchanges=yes` to the
                value of the tag
              type: boolean
          type: object
        tlsa_data:
          description: Use this for TLSA type record only
          required:
            - usage
            - selector
            - matching_type
          properties:
            usage:
              description: >-
                Certificate usage: `0` (PKIX-TA), `1` (PKIX-EE), `2` (DANE-TA)
                or `3` (DANE-EE)
              type: string
            selector:
              description: >-
                Selector: `0` for the full certificate, `1` for its public key
                (SubjectPublicKeyInfo)
              type: string
            matching_type:
              description: >-
                Matching type: `0` for the data without hashing, `1` for
                SHA-256, `2` for SHA-512
              type: string
          type: object
      type: object
      additionalProperties: false
    DomainDnsRecordRequest:
      required:
        - type
        - host
        - destination
      properties:
        type:
          description: >-
            Type of the record. `NS` and `PTR` records cannot be created, as in
            the control panel
          type: string
          enum:
            - A
            - AAAA
            - CNAME
            - MX
            - SRV
            - TXT
            - SPF
            - CAA
            - TLSA
        host:
          description: >-
            Name of the record relative to the zone, `@` for the domain itself;
            for SRV and TLSA records, without the service and the protocol
          type: string
        service:
          description: Service of SRV records (e.g. `_sip`) and port of TLSA records
          type: string
        protocol:
          description: 'Protocol of SRV and TLSA records: `_tcp`, `_udp` or `_tls`'
          type: string
        destination:
          description: >-
            Value of the record: the IPv4 address for A, the IPv6 address for
            AAAA, the target hostname for CNAME, MX, NS, PTR and SRV, the text
            for TXT and SPF, the value of the tag for CAA, the certificate
            association data for TLSA
          type: string
        port:
          description: Port of the service, required for SRV records
          type: string
        weight:
          description: Weight of SRV records
          type: string
        priority:
          description: Priority of MX and SRV records
          type: string
        ttl:
          description: >-
            Ignored: a new record has the TTL of the zone with the standard and
            external nameservers, and the automatic TTL with Cloudflare, which
            `PATCH /api/v3/domains/{domain_id}/dns/records/{record_id}` can
            change
          type: integer
        proxied:
          description: >-
            Whether the traffic of the record goes through the Cloudflare proxy;
            only with the Cloudflare nameservers
          type: boolean
        caa_data:
          description: Use this for CAA type record only
          required:
            - flag
            - tag_value
            - can_sign_http_exchanges
          properties:
            flag:
              description: 'Flags of the CAA record: only `0` is accepted'
              type: integer
            tag_value:
              description: >-
                Tag of the CAA record, for example `issue` or `issuewild`; its
                value goes in `destination`
              type: string
            can_sign_http_exchanges:
              description: >-
                Whether to add the parameter `cansignhttpexchanges=yes` to the
                value of the tag
              type: boolean
          type: object
        tlsa_data:
          description: Use this for TLSA type record only
          required:
            - usage
            - selector
            - matching_type
          properties:
            usage:
              description: >-
                Certificate usage: `0` (PKIX-TA), `1` (PKIX-EE), `2` (DANE-TA)
                or `3` (DANE-EE)
              type: string
            selector:
              description: >-
                Selector: `0` for the full certificate, `1` for its public key
                (SubjectPublicKeyInfo)
              type: string
            matching_type:
              description: >-
                Matching type: `0` for the data without hashing, `1` for
                SHA-256, `2` for SHA-512
              type: string
          type: object
      type: object
      additionalProperties: false
    DomainDnsZoneRequest:
      required:
        - zone_ttl
      properties:
        zone_ttl:
          description: >-
            TTL of the zone, in seconds, which is also the TTL of every record:
            one of the values of the control panel, from 1 to 24 hours. Only the
            zones on our nameservers (standard and external types) have one:
            with Cloudflare the response is 409
          type: integer
          enum:
            - 3600
            - 14400
            - 28800
            - 57600
            - 86400
      type: object
      additionalProperties: false
    DomainDnssecRequest:
      required:
        - zone_ttl
        - ds_data_1
        - ds_data_2
      properties:
        zone_ttl:
          description: TTL of the zone, in seconds
          type: integer
          maximum: 2147483647
          minimum: 0
        key_data_256:
          description: KEY DATA 256 records
          type: array
          items:
            required:
              - protocol
              - algorithm
              - public_key
            properties:
              protocol:
                description: Protocol of the key, `3` for DNSSEC
                type: integer
              algorithm:
                description: >-
                  DNSSEC algorithm of the key: `8` (RSA/SHA-256) or `13`
                  (ECDSAP256SHA256)
                type: integer
                enum:
                  - 8
                  - 13
              public_key:
                description: Public key, in base64
                type: string
            type: object
        key_data_257:
          description: KEY DATA 257 records
          type: array
          items:
            required:
              - protocol
              - algorithm
              - public_key
            properties:
              protocol:
                description: Protocol of the key, `3` for DNSSEC
                type: integer
              algorithm:
                description: >-
                  DNSSEC algorithm of the key: `8` (RSA/SHA-256) or `13`
                  (ECDSAP256SHA256)
                type: integer
                enum:
                  - 8
                  - 13
              public_key:
                description: Public key, in base64
                type: string
            type: object
        ds_data_1:
          description: DS DATA first record
          required:
            - key_tag
            - algorithm
            - digest_type
            - digest
          properties:
            key_tag:
              description: Key tag of the DNSKEY the record refers to
              type: integer
            algorithm:
              description: >-
                DNSSEC algorithm of the key, for example `8` (RSA/SHA-256) or
                `13` (ECDSAP256SHA256)
              type: integer
            digest_type:
              description: >-
                Algorithm of the digest: `1` (SHA-1), `2` (SHA-256) or `4`
                (SHA-384)
              type: integer
              enum:
                - 1
                - 2
                - 4
            digest:
              description: Digest of the DNSKEY, in hexadecimal
              type: string
          type: object
        ds_data_2:
          description: DS DATA second record
          required:
            - key_tag
            - algorithm
            - digest_type
            - digest
          properties:
            key_tag:
              description: Key tag of the DNSKEY the record refers to
              type: integer
            algorithm:
              description: >-
                DNSSEC algorithm of the key, for example `8` (RSA/SHA-256) or
                `13` (ECDSAP256SHA256)
              type: integer
            digest_type:
              description: >-
                Algorithm of the digest: `1` (SHA-1), `2` (SHA-256) or `4`
                (SHA-384)
              type: integer
              enum:
                - 1
                - 2
                - 4
            digest:
              description: Digest of the DNSKEY, in hexadecimal
              type: string
          type: object
      type: object
      additionalProperties: false
    HostingBackupExposeRequest:
      description: >-
        Backups to expose: they are copied, without restoring them, into the FTP
        space of the hosting
      properties:
        web_backup_id:
          description: >-
            The `backup_id` of a backup with category `web` returned by `GET
            /api/v3/hostings/{hosting_id}/backups`. Send at least one of
            web_backup_id and db_backup_id
          type:
            - integer
            - 'null'
        db_backup_id:
          description: >-
            The `backup_id` of a backup with category `database` returned by
            `GET /api/v3/hostings/{hosting_id}/backups`. Send at least one of
            web_backup_id and db_backup_id
          type:
            - integer
            - 'null'
      type: object
      additionalProperties: false
    HostingCronjobCreateRequest:
      required:
        - request_protocol
        - request_url
      properties:
        request_protocol:
          description: http or https
          type: string
          enum:
            - http
            - https
        request_url:
          description: >-
            URL to call, without protocol (e.g. `www.example.com/cron.php`): a
            leading http:// or https:// is removed and request_protocol is used
          type: string
        http_request_method:
          description: HTTP method of the call
          type: string
          default: GET
          enum:
            - GET
            - POST
        plan_month:
          description: >-
            Month in which the cronjob runs, from 1 (January) to 12 (December).
            Omit it, or send null or an empty string, to run it every month
          type:
            - string
            - 'null'
          pattern: ^([1-9]|1[0-2])?$
          example: '1'
        plan_monthday:
          description: >-
            Days of the month, as a comma-separated list of values from 1 to 31
            (e.g. `1,15`). Omit it, or send null or an empty string, to run it
            every day
          type:
            - string
            - 'null'
        plan_weekday:
          description: >-
            Day of the week, from 1 (Monday) to 7 (Sunday). Omit it, or send
            null or an empty string, to run it every day of the week
          type:
            - string
            - 'null'
          pattern: ^[1-7]?$
          example: '1'
        plan_hour:
          description: >-
            Hours, as a comma-separated list of values from 0 to 23 (e.g.
            `0,12`). Omit it, or send null or an empty string, to run it every
            hour
          type:
            - string
            - 'null'
        plan_minute:
          description: >-
            Minutes, as a comma-separated list of values from 0 to 59 (e.g.
            `0,30`). Omit it, or send null or an empty string, to run it every
            minute
          type:
            - string
            - 'null'
      type: object
      additionalProperties: false
    HostingEmailAliasCreateRequest:
      required:
        - alias_name
        - goto
      properties:
        alias_name:
          description: Alias local-part without domain.
          type: string
        goto:
          description: Destination addresses of the alias, at least one
          type: array
          items:
            type: string
            format: email
      type: object
      additionalProperties: false
    HostingEmailCatchAllRequest:

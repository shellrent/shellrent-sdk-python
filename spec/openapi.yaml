    OrderPayRequest:
      description: >-
        Pays one or more orders. The payment mode is chosen by three fields,
        evaluated in this order: 1) use_prepaid_credit set to true: pays with
        the available Prepaid Credit; 2) use_one_click set to true: tries the
        saved One-Click payment methods in priority order until one is
        successfully authorized; 3) one_click_id: pays with that specific
        One-Click payment method. Provide one of them: if more are provided,
        only the first one in this order is used. If none is provided the
        request fails, unless the amount to pay is zero: in that case no payment
        mode is needed.
      required:
        - order_ids
      properties:
        use_prepaid_credit:
          description: >-
            Payment mode 1: set to true to pay with the available Prepaid
            Credit. Takes precedence over use_one_click and one_click_id.
          type: boolean
        use_one_click:
          description: >-
            Payment mode 2: set to true to use the saved One-Click payment
            methods. Payment will be attempted using saved methods in priority
            order until one is successfully authorized. Ignored if
            use_prepaid_credit is true; takes precedence over one_click_id.
          type: boolean
        one_click_id:
          description: >-
            Payment mode 3: identifier of the One-Click payment method to use,
            to pay only with that specific method. Ignored if use_prepaid_credit
            or use_one_click is true.
          type: integer
        order_ids:
          description: >-
            IDs of the orders to be paid (1 ID or more order IDs to pay
            together)
          type: array
          items:
            type: integer
          minItems: 1
      type: object

        - scan_id
        - hosting_id
        - date_created
        - error
        - rules_found
        - rules_excluded
      properties:
        scan_id:
          type: integer
        hosting_id:
          description: Id of the hosting (`GET /api/v3/hostings/{hosting_id}`)
          type:
            - integer
            - 'null'
        date_created:
          type: string
          format: date-time
        error:
          description: Error of the scan; null when it succeeded
          type:
            - string
            - 'null'
        rules_found:
          description: >-
            Number of rules found by the scan: those that generated errors or
            blocks on the day of the scan
          type: integer
        rules_excluded:
          description: >-
            Number of rules found by the scan that are disabled on the hosting
            now (`included` true in `GET
            /api/v3/hostings/{hosting_id}/modsecurity/rules`)
          type: integer
      type: object
    HostingModSecurity:
      description: Status of ModSecurity, the web application firewall, on the hosting
      required:
        - hosting_id
        - is_available
        - is_active
        - firewall_compatible
        - full_strict
        - custom_rules
        - custom_set
      properties:
        hosting_id:
          description: Id of the hosting (`GET /api/v3/hostings/{hosting_id}`)
          type: integer
        is_available:
          description: >-
            Whether ModSecurity can be managed: only on Linux hostings, and not
            while the purchase is suspended or in maintenance
          type: boolean
        is_active:
          description: >-
            Whether ModSecurity is enabled (`PATCH
            /api/v3/hostings/{hosting_id}/modsecurity`)
          type: boolean
        firewall_compatible:
          description: >-
            Whether the rules of ModSecurity can be managed on the web server of
            the hosting: false on dedicated web servers and when ModSecurity is
            not available
          type: boolean
        full_strict:
          description: >-
            Whether ModSecurity filters all the traffic, with no disabled rule;
            null when `firewall_compatible` is false
          type:
            - boolean
            - 'null'
        custom_rules:
          description: >-
            Numbers of the rules disabled on the hosting, as read from the web
            server; null when the hosting has no custom configuration
          type:
            - array
            - 'null'
          items:
            type: string
        custom_set:
          description: >-
            Rule sets of the custom configuration of the hosting, as read from
            the web server; null when the hosting has no custom configuration
          type:
            - array
            - 'null'
          items:
            type: string
      type: object
    HostingPhpSetting:
      description: PHP directive changed on the hosting, with its value
      required:
        - setting
        - value
      properties:
        setting:
          description: >-
            PHP directive, as in `PATCH
            /api/v3/hostings/{hosting_id}/php-settings`
          type: string
          enum:
            - opcache.enable
            - display_errors
            - memory_limit
            - post_max_size
            - upload_max_filesize
            - max_execution_time
            - max_input_time
        value:
          description: Value set on the hosting
          type: string
      type: object
    HostingPhpVersion:
      description: PHP version available for the hosting
      required:
        - version
        - is_current
        - is_default
      properties:
        version:
          description: >-
            PHP version, for example `8.3`: send it to `PATCH
            /api/v3/hostings/{hosting_id}/php-version`
          type: string
        is_current:
          description: Whether the hosting uses this version
          type: boolean
        is_default:
          description: Whether it is the default version of the web server
          type: boolean
      type: object
    HostingSslCertificateCanInstall:
      description: >-
        Whether an SSL certificate can be installed on the hosting now, and why
        not
      required:
        - hosting_id
        - can_install
        - reason
        - message
        - dns_delegation
      properties:
        hosting_id:
          description: Id of the hosting (`GET /api/v3/hostings/{hosting_id}`)
          type: integer
        can_install:
          description: >-
            Whether the installation can start now with `POST
            /api/v3/hostings/{hosting_id}/ssl-certificates` and the same fields
          type: boolean
        reason:
          description: >-
            Why the installation cannot start now; null when it can.
            `ALREADY_INSTALLED`: a certificate is already installed on the
            destination, remove it first. `CNAME_MISSING`: the DNS of the domain
            are not on our nameservers and the CNAME record in `dns_delegation`
            is missing. `LIMIT_REACHED`: too many Let's Encrypt installations on
            the hosting in the last days. `MAIL_NOT_SUPPORTED`: the mail server
            of the hosting does not accept certificates. `OPERATION_RUNNING`:
            another installation or operation is running on the hosting
          anyOf:
            - $ref: '#/components/schemas/HostingSslCertificateCanInstallReason'
            - type: 'null'
        message:
          description: Description of `reason`; null when the installation can start
          type:
            - string
            - 'null'
        dns_delegation:
          description: >-
            CNAME record that delegates the validation of the Let's Encrypt
            certificate; null when installing a purchased certificate
            (`ssl_certificate_id`)
          anyOf:
            - $ref: '#/components/schemas/HostingSslDnsDelegation'
            - type: 'null'
      type: object
    HostingSslCertificate:
      description: SSL certificate installed on the website or on the mail of the hosting
      required:
        - hosting_ssl_certificate_id
        - hosting_id
        - ssl_certificate_id
        - lets_encrypt_id
        - external_certificate_id
        - cn_type
        - installation_date
        - https_rewrite
        - destination_type
      properties:
        hosting_ssl_certificate_id:
          type: integer
        hosting_id:
          description: Id of the hosting (`GET /api/v3/hostings/{hosting_id}`)
          type: integer
        ssl_certificate_id:
          description: >-
            Id of the purchased SSL certificate (`GET
            /api/v3/ssl-certificates/{ssl_certificate_id}`); null for the other
            certificates
          type:
            - integer
            - 'null'
        lets_encrypt_id:
          description: Id of the Let's Encrypt certificate; null for the other certificates
          type:
            - integer
            - 'null'
        external_certificate_id:
          description: >-
            Id of the external certificate, whose keys were uploaded by the
            customer; null for the other certificates
          type:
            - integer
            - 'null'
        cn_type:
          description: >-
            Type of the certificate: `NORMAL`, or `WILDCARD` for a wildcard
            certificate
          type:
            - string
            - 'null'
        installation_date:
          description: >-
            When the certificate was installed; null until the installation
            completes
          type:
            - string
            - 'null'
          format: date-time
        https_rewrite:
          description: Whether the visits over HTTP are redirected to HTTPS (301)
          type:
            - boolean
            - 'null'
        destination_type:
          description: >-
            Where the certificate is installed: `web` for the website, `mail`
            for the mail servers
          type:
            - string
            - 'null'
      type: object
    HostingSslDnsDelegation:
      description: >-
        CNAME record that delegates the DNS validation of the Let's Encrypt
        certificate
      required:
        - managed_dns
        - host
        - target
        - present
      properties:
        managed_dns:
          description: >-
            Whether the DNS zone of the domain is on our nameservers: the
            installation creates the CNAME record by itself. When false the
            record must be created on the nameservers of the domain before the
            installation
          type: boolean
        host:
          description: Name of the CNAME record, in punycode
          type: string
        target:
          description: Target of the CNAME record; null when no delegation is required
          type:
            - string
            - 'null'
        present:
          description: >-
            Whether the public DNS resolvers return the CNAME record with
            `target`; null when the DNS zone is on our nameservers, where it is
            not checked, or when no delegation is required
          type:
            - boolean
            - 'null'
      type: object
    Hosting:
      description: >-
        Hosting of the account: a main hosting, bought with a purchase, or one
        of its subdomains
      required:
        - hosting_id
        - purchase_id
        - parent_hosting_id
        - is_primary
        - host_name
        - host_name_idna
        - full_name
        - full_name_idna
        - domain_full_name
        - domain_full_name_idna
        - php_version
        - http_version
        - file_protection_enabled
        - php_settings
        - is_active
      properties:
        hosting_id:
          type: integer
        purchase_id:
          description: >-
            Id of the purchase of the hosting (`GET
            /api/v3/purchases/{purchase_id}`); null for a subdomain, which
            belongs to the purchase of its main hosting
          type:
            - integer
            - 'null'
        parent_hosting_id:
          description: >-
            Id of the main hosting of a subdomain (`GET
            /api/v3/hostings/{hosting_id}`); null for a main hosting
          type:
            - integer
            - 'null'
        is_primary:
          description: >-
            Whether it is a main hosting; false for a subdomain (`POST
            /api/v3/hostings/{hosting_id}/subdomains`)
          type: boolean
        host_name:
          description: >-
            Host name, in Unicode: the hostname of a main hosting (usually its
            domain), the level name of a subdomain (for example `blog`)
          type:
            - string
            - 'null'
        host_name_idna:
          description: '`host_name` in punycode'
          type:
            - string
            - 'null'
        full_name:
          description: >-
            Full hostname, in Unicode: for a subdomain, the level name followed
            by the hostname of the main hosting
          type:
            - string
            - 'null'
        full_name_idna:
          description: '`full_name` in punycode'
          type:
            - string
            - 'null'
        domain_full_name:
          description: >-
            Hostname on the domain of the purchase, in Unicode: the domain for a
            main hosting, the subdomain of the domain for a subdomain
          type:
            - string
            - 'null'
        domain_full_name_idna:
          description: '`domain_full_name` in punycode'
          type:
            - string
            - 'null'
        php_version:
          description: >-
            PHP version of the hosting, for example `8.3` (`PATCH
            /api/v3/hostings/{hosting_id}/php-version`); null or empty when not
            set
          type:
            - string
            - 'null'
        http_version:
          description: >-
            HTTP version of the hosting: 1 for HTTP/1.1, 2 for HTTP/2 (`PATCH
            /api/v3/hostings/{hosting_id}/http-version`)
          type: string
        file_protection_enabled:
          description: >-
            Whether the file protection is enabled (`PATCH
            /api/v3/hostings/{hosting_id}/file-protection`)
          type: boolean
        php_settings:
          description: >-
            PHP directives changed on the hosting (`PATCH
            /api/v3/hostings/{hosting_id}/php-settings`): the others have the
            default value of the web server
          type: array
          items:
            $ref: '#/components/schemas/HostingPhpSetting'
        is_active:
          description: >-
            Whether the hosting is active: always true, since deleted subdomains
            are not returned
          type: boolean
      type: object
    InvoiceRow:
      description: Row of an invoice
      required:
        - invoice_row_id
        - invoice_id
        - invoice_id_deposit
        - service
        - purchase
        - description
        - unit_description
        - unit_quantity
        - unit_amount
        - amount
        - billing_data
        - is_recurring
        - date_start
        - date_end
      properties:
        invoice_row_id:
          type: integer
        invoice_id:
          description: Id of the invoice (`GET /api/v3/invoices/{invoice_id}`)
          type: integer
        invoice_id_deposit:
          description: >-
            Id of the deposit invoice that the row deducts, in a balance invoice
            (`GET /api/v3/invoices/{invoice_id}`); null for the other rows
          type:
            - integer
            - 'null'
        service:
          description: Service of the row; null when the row is not for a service
          anyOf:
            - $ref: '#/components/schemas/Service'
            - type: 'null'
        purchase:
          description: Purchase of the row; null when the row is not for a purchase
          anyOf:
            - $ref: '#/components/schemas/Purchase'
            - type: 'null'
        description:
          type: string
        unit_description:
          description: >-
            Unit of `unit_quantity`: `h` (hours) or `m` (minutes); null when the
            row is not priced by unit
          type:
            - string
            - 'null'
        unit_quantity:
          description: >-
            Quantity, in the unit of `unit_description`; null when the row is
            not priced by unit
          type:
            - number
            - 'null'
          format: float
        unit_amount:
          $ref: '#/components/schemas/Amount'
          description: >-
            Price of one unit; its `amount` is null when the row is not priced
            by unit
        amount:
          $ref: '#/components/schemas/Amount'
        billing_data:
          $ref: '#/components/schemas/BillingData'
        is_recurring:
          description: >-
            Whether the row is for a recurring charge, such as a service renewed
            periodically, and not a one-time one
          type: boolean
        date_start:
          description: >-
            Start of the period the row refers to; null when the row has no
            period
          type:
            - string
            - 'null'
          format: date
        date_end:
          description: End of the period the row refers to; null when the row has no period
          type:
            - string
            - 'null'
          format: date
      type: object
    Invoice:
      description: Invoice of the account, with its totals and electronic invoicing data
      required:
        - invoice_id
        - billing
        - type
        - sdi_document_status
        - sdi_document_type
        - date_emitted
        - invoice_year
        - invoice_number
        - invoice_caption
        - invoice_caption_additional
        - payed
        - sdi_identifier
        - sdi_filename
        - total_amount
        - amount_no_balance
        - payment_amount
        - orders
        - rows_count
        - date_created
      properties:
        invoice_id:
          type: integer
        billing:
          $ref: '#/components/schemas/AccountBilling'
        type:
          description: >-
            Type of the invoice: `NORMAL`, `DEPOSIT` (top-up of the prepaid
            credit) or `BALANCE` (paid with the prepaid credit: some rows deduct
            the deposit invoices)
          type:
            - string
            - 'null'
        sdi_document_status:
          description: >-
            Status of the invoice on SDI, the Italian e-invoicing exchange
            system; null for the invoices not sent through SDI, issued before
            electronic invoicing
          anyOf:
            - $ref: '#/components/schemas/SdiDocumentStatus'
            - type: 'null'
        sdi_document_type:
          description: >-
            Type of the electronic document on SDI; `TD01` (invoice) when the
            invoice has none
          anyOf:
            - $ref: '#/components/schemas/SdiDocumentType'
            - type: 'null'
        date_emitted:
          description: Date of issue of the invoice
          type: string
          format: date
        invoice_year:
          description: Year of the numbering of the invoice
          type:
            - integer
            - 'null'
        invoice_number:
          description: >-
            Complete number of the invoice: the year followed by the number on 6
            digits, for example `2025000123`
          type: string
        invoice_caption:
          description: >-
            Legal note of the tax regime printed on the invoice, in Italian,
            such as the law under which VAT is not applied; null when the regime
            has none
          type:
            - string
            - 'null'
        invoice_caption_additional:
          description: >-
            Additional reason (`Causale`) of the electronic invoice; null when
            there is none
          type:
            - string
            - 'null'
        payed:
          description: Whether the invoice is paid
          type: boolean
        sdi_identifier:
          description: >-
            Identifier assigned by SDI to the invoice; null when it has not been
            sent to SDI
          type:
            - string
            - 'null'
        sdi_filename:
          description: >-
            Name of the file sent to SDI; null when not sent, and for most
            invoices issued before November 2024
          type:
            - string
            - 'null'
        total_amount:
          $ref: '#/components/schemas/Amount'
        amount_no_balance:
          $ref: '#/components/schemas/Amount'
          description: >-
            Total of the invoice without the rows that deduct deposit invoices;
            the same as `total_amount` except for `BALANCE` invoices
        payment_amount:
          $ref: '#/components/schemas/Amount'
          description: >-
            Amount to pay: the taxable amount in `amount`, with the VAT and the
            total to pay. With split payment the customer pays only the taxable
            amount, because the VAT goes to the State, so the VAT fields are
            null
        orders:
          description: Ids of the orders of the invoice (`GET /api/v3/orders/{order_id}`)
          type: array
          items:
            type: integer
        rows_count:
          description: >-
            Number of rows of the invoice (`GET
            /api/v3/invoices/{invoice_id}/rows`)
          type: integer
        date_created:
          type: string
          format: date-time
      type: object
    IpAddress:
      description: IP address of a server, with its reverse DNS and its state
      required:
        - ip_address_id
        - server_id
        - ip_address
        - reverse_dns
        - reverse_dns_external
        - mac_address
        - blocked_for_spam
        - active
        - available
        - date_created
      properties:
        ip_address_id:
          type: integer
        server_id:
          description: >-
            Id of the server the IP address is assigned to (`GET
            /api/v3/servers/{server_id}`); null for the free IP addresses of a
            private cloud (`GET
            /api/v3/servers/{server_id}/private-cloud/available-ip-addresses`)
          type:
            - integer
            - 'null'
        ip_address:
          type: string
        reverse_dns:
          description: >-
            Reverse DNS set on the IP address, changed with `PATCH
            /api/v3/servers/{server_id}/ip-addresses/{ip_address_id}/rdns`; null
            when it is not set
          type:
            - string
            - 'null'
        reverse_dns_external:
          description: >-
            Reverse DNS of the IP address as last read from its supplier; null
            when the supplier has none
          type:
            - string
            - 'null'
        mac_address:
          description: >-
            MAC address associated with the IP address, such as the virtual MAC
            of the supplier or the one of its network interface; null when there
            is none
          type:
            - string
            - 'null'
        blocked_for_spam:
          description: Whether the supplier blocked the IP address for spam
          type: boolean
        active:
          description: >-
            Whether the IP address is active: false once it has been revoked or
            cancelled at the supplier
          type: boolean
        available:
          description: >-
            Whether the IP address can be used: an address that is not
            available, such as the gateway of its block, cannot be assigned to a
            network interface or to a virtual machine
          type: boolean
        date_created:
          type:
            - string
            - 'null'
          format: date-time
      type: object
    LegalEntityGroup:
      description: Group of legal forms, such as private individuals or Italian companies
      required:
        - group_code
        - group_name
      properties:
        group_code:
          description: >-
            Code of the group, currently `PRIVATE`,
            `ITALIAN_INDIVIDUAL_COMPANY`, `ITALIAN_LIMITED_COMPANY`,
            `ITALIAN_COOPERATIVE_COMPANY`, `ITALIAN_PUBLIC_ADMINISTRATION`,
            `FOREIGN_COMPANY` or `OTHER`
          type: string
        group_name:
          description: Name of the group, in Italian
          type: string
      type: object
    LegalEntity:
      description: Legal form of the holder of a billing profile, with its group
      required:
        - legal_entity_group
        - tax_regime
        - entity_code
        - entity_name
      properties:
        legal_entity_group:
          $ref: '#/components/schemas/LegalEntityGroup'
        tax_regime:
          $ref: '#/components/schemas/TaxRegime'
        entity_code:
          description: >-
            Code of the legal form: `ITA_PVT`, `NOITA_PVT`, `ITA_INDIVIDUALE`,
            `ITA_CAPITALI`, `ITA_PERSONE`, `ITA_ASSNOCOMM`, `ITA_ASSCOMM`,
            `ITA_ALTRO`, `ITA_PA`, `EU_ALTRO`, `NOEU_ALTRO`, `VATICAN_NOPVT`,
            `SANMARINO_NOPVT` or `FORBIDDEN_NOITA_NOPVT`
          type: string
        entity_name:
          description: Name of the legal form, in Italian
          type: string
      type: object
    License:
      description: >-
        cPanel or Plesk license of the account, with the server or the IP
        address where it is installed
      required:
        - license_id
        - purchase_id
        - purchase_server_id
        - service_name
        - purchase_name
        - key_number
        - ip_address
        - is_els
        - operative_system
        - purchase_status_code
        - date_activation
        - date_expiry
      properties:
        license_id:
          type: integer
        purchase_id:
          description: >-
            Id of the purchase of the license (`GET
            /api/v3/purchases/{purchase_id}`)
          type: integer
        purchase_server_id:
          description: >-
            Id of the purchase of the server where the license is installed
            (`GET /api/v3/purchases/{purchase_id}`); null for a license on an
            external host (`ip_address`) or without a server
          type:
            - integer
            - 'null'
        service_name:
          description: Name of the service of the purchase, in Italian
          type:
            - string
            - 'null'
        purchase_name:
          description: >-
            Object name of the purchase, as `purchase_name.object_name` of the
            purchase
          type:
            - string
            - 'null'
        key_number:
          description: Key number of a Plesk license; null for cPanel licenses
          type:
            - string
            - 'null'
        ip_address:
          description: >-
            IP address of the external host where the license is installed,
            instead of a server (`purchase_server_id`)
          type:
            - string
            - 'null'
        is_els:
          description: >-
            Whether the server runs an obsolete operating system, covered by the
            Extended Lifecycle Support (ELS) of the supplier and charged as an
            additional fee
          type: boolean
        operative_system:
          description: >-
            Operating system of the server, as reported by the license supplier;
            null until reported
          type:
            - string
            - 'null'
        purchase_status_code:
          description: >-
            Status code of the purchase (`status_code` of `PurchaseStatus`):
            `NEW_V2`, `ACTIVE_V2` or `DELIVERED_V2`
          type:
            - string
            - 'null'
        date_activation:
          description: Activation date of the purchase (`date_activation` of the purchase)
          type:
            - string
            - 'null'
          format: date
        date_expiry:
          description: Expiry date of the purchase (`date_expiry` of the purchase)
          type:
            - string
            - 'null'
          format: date
      type: object
    Microsoft365DomainAvailable:
      description: >-
        Availability of a `.onmicrosoft.com` domain for a new Microsoft 365
        tenant
      required:
        - domain_prefix
        - microsoft_domain
        - available
      properties:
        domain_prefix:
          description: Requested tenant domain prefix
          type: string
        microsoft_domain:
          description: Full ".onmicrosoft.com" domain
          type: string
        available:
          description: >-
            Whether the domain is available for a new tenant: false if a tenant
            already has it at Microsoft
          type: boolean
      type: object
    Microsoft365:
      description: >-
        Microsoft 365 subscription of the account, with its status at the
        supplier and its tenant
      required:
        - microsoft365_id
        - purchase_id
        - tenant_id
        - service_name
        - purchase_name
        - supplier_code
        - supplier_status
        - order_code
        - order_reference
        - order_status
        - order_need_submit
        - autorenew_enabled
        - is_trial
        - subscription_activation_date
        - subscription_expiry_date
        - tenant
      properties:
        microsoft365_id:
          type: integer
        purchase_id:
          description: >-
            Id of the purchase of the subscription (`GET
            /api/v3/purchases/{purchase_id}`)
          type: integer
        tenant_id:
          description: >-
            Id of the tenant of the subscription (`GET
            /api/v3/microsoft-365-tenants/{microsoft_365_tenant_id}`)
          type:
            - integer
            - 'null'
        service_name:
          description: Name of the service of the purchase, in Italian
          type:
            - string
            - 'null'
        purchase_name:
          description: >-
            Object name of the purchase (`purchase_name.object_name` of the
            purchase): the prefix of the tenant domain, null until it is set
          type:
            - string
            - 'null'
        supplier_code:
          description: >-
            Reference of the subscription at the supplier; null until the
            supplier provisions it
          type:
            - string
            - 'null'
        supplier_status:
          description: >-
            Status of the subscription as the supplier reports it, for example
            `active`, `suspended` or `canceled`; null until known
          type:
            - string
            - 'null'
        order_code:
          description: >-
            Code of the order placed at the supplier for the subscription; null
            until it is placed
          type:
            - string
            - 'null'
        order_reference:
          description: >-
            Reference of the order at the supplier; null until the supplier
            assigns it
          type:
            - string
            - 'null'
        order_status:
          description: >-
            Status of the order at the supplier, for example `Order queued`,
            `Fulfilled` or `Archived`; null until the order is placed
          type:
            - string
            - 'null'
        order_need_submit:
          description: >-
            Whether the order at the supplier ended with a warning and must be
            submitted again
          type: boolean
        autorenew_enabled:
          description: Whether the subscription renews automatically at the supplier
          type: boolean
        is_trial:
          description: Whether the subscription is a trial
          type: boolean
        subscription_activation_date:
          description: >-
            Activation date of the subscription at the supplier; null until
            known
          type:
            - string
            - 'null'
          format: date
        subscription_expiry_date:
          description: Expiry date of the subscription at the supplier; null until known
          type:
            - string
            - 'null'
          format: date
        tenant:
          description: Tenant of the subscription
          anyOf:
            - $ref: '#/components/schemas/Microsoft365Tenant'
            - type: 'null'
      type: object
    Microsoft365PartnerLink:
      description: >-
        Link to approve the Microsoft partner relationship, needed to transfer a
        tenant
      required:
        - partner_link
      properties:
        partner_link:
          description: >-
            URL where the partner relationship of the tenant is approved at
            Microsoft, before buying a subscription with `tenant_choice`
            `transfer`
          type: string
      type: object
    Microsoft365Tenant:
      description: >-
        Microsoft 365 tenant of the account, with its contact data and the state
        of the Microsoft Customer Agreement
      required:
        - tenant_id
        - microsoft_uuid
        - domain_prefix
        - microsoft_domain
        - imported
        - first_name
        - last_name
        - country
        - company_name
        - address
        - city
        - state
        - postal_code
        - email_address
        - phone_prefix
        - phone_number
        - locale
        - account_login
        - mca_compliant
        - mca_sign_date
        - mca_template_id
        - mca_error
      properties:
        tenant_id:
          type: integer
        microsoft_uuid:
          description: Id of the tenant at Microsoft (tenant UUID); null until detected
          type:
            - string
            - 'null'
        domain_prefix:
          description: Prefix of the `.onmicrosoft.com` domain of the tenant
          type:
            - string
            - 'null'
        microsoft_domain:
          description: Full `.onmicrosoft.com` domain of the tenant
          type:
            - string
            - 'null'
        imported:
          description: >-
            Whether the tenant was transferred from another partner
            (`tenant_choice` `transfer`) instead of created new (`new`)
          type: boolean
        first_name:
          type:
            - string
            - 'null'
        last_name:
          type:
            - string
            - 'null'
        country:
          description: >-
            Country of the tenant, as an ISO 3166-1 alpha-2 code, for example
            `IT`
          type:
            - string
            - 'null'
        company_name:
          type:
            - string
            - 'null'
        address:
          type:
            - string
            - 'null'
        city:
          type:
            - string
            - 'null'
        state:
          description: State or province of the tenant address
          type:
            - string
            - 'null'
        postal_code:
          type:
            - string
            - 'null'
        email_address:
          type:
            - string
            - 'null'
          format: email
        phone_prefix:
          description: International phone prefix with the leading `+`, for example `+39`
          type:
            - string
            - 'null'
        phone_number:
          type:
            - string
            - 'null'
        locale:
          description: Locale of the tenant, for example `it_IT` or `en_US`
          type:
            - string
            - 'null'
        account_login:
          description: >-
            Username of the administrator account of the tenant, whose password
            is sent by email; null when not available
          type:
            - string
            - 'null'
        mca_compliant:
          description: >-
            Whether the Microsoft Customer Agreement (MCA) has been accepted for
            the tenant; null until checked
          type:
            - boolean
            - 'null'
        mca_sign_date:
          description: >-
            Date and time the Microsoft Customer Agreement was accepted; null
            when not known
          type:
            - string
            - 'null'
          format: date-time
        mca_template_id:
          description: >-
            Template of the accepted Microsoft Customer Agreement, as an id or
            as the URL of the agreement; null when not accepted
          type:
            - string
            - 'null'
        mca_error:
          description: >-
            Message of the supplier on the check of the Microsoft Customer
            Agreement, for example `customer is not provisioned yet`; null when
            there is none
          type:
            - string
            - 'null'
      type: object
    ObjectStorageBucketChart:
      description: Daily usage history of a bucket, for a chart
      required:
        - object_storage_id
        - bucket_id
        - interval
        - points
      properties:
        object_storage_id:
          description: >-
            Id of the object storage (`GET
            /api/v3/object-storages/{object_storage_id}`)
          type: integer
        bucket_id:
          description: >-
            Id of the bucket (`GET
            /api/v3/object-storages/{object_storage_id}/buckets/{bucket_id}`)
          type: integer
        interval:
          description: >-
            Interval between two points, as an ISO 8601 duration: always `P1D`,
            one point per day
          type: string
          example: P1D
        points:
          description: Usage of the bucket day by day, oldest first
          type: array
          items:
            required:
              - x
              - active_storage_bytes
              - deleted_storage_bytes
              - active_objects
              - deleted_objects
              - api_calls_count
              - storage_wrote_bytes
              - storage_read_bytes
              - ingress_traffic_bytes
              - egress_traffic_bytes
            properties:
              x:
                description: UNIX timestamp in milliseconds
                type: number
                format: float
              active_storage_bytes:
                description: Space used by the active objects on the day, in bytes
                type: integer
              deleted_storage_bytes:
                description: >-
                  Space of the deleted objects still counted on the day, in
                  bytes
                type: integer
              active_objects:
                description: Number of active objects on the day
                type: integer
              deleted_objects:
                description: Number of deleted objects still counted on the day
                type: integer
              api_calls_count:
                description: Number of API calls on the day
                type: integer
              storage_wrote_bytes:
                type: integer
              storage_read_bytes:
                type: integer
              ingress_traffic_bytes:
                type: integer
              egress_traffic_bytes:
                type: integer
            type: object
      type: object
    ObjectStorageBucketFirewallEntry:
      description: >-
        Entry of the firewall of a bucket: when the bucket has entries, the
        requests from other addresses are denied
      required:
        - entry_id
        - object_storage_id
        - bucket_id
        - ip
        - active
        - date_created
      properties:
        entry_id:
          type: integer
        object_storage_id:
          description: >-
            Id of the object storage (`GET
            /api/v3/object-storages/{object_storage_id}`)
          type: integer
        bucket_id:
          description: >-
            Id of the bucket (`GET
            /api/v3/object-storages/{object_storage_id}/buckets/{bucket_id}`)
          type: integer
        ip:
          description: >-
            IPv4 or IPv6 address, or subnet in CIDR notation, allowed to access
            the bucket
          type:
            - string
            - 'null'
        active:
          description: 'Whether the entry is active: removed entries are not returned'
          type:
            - boolean
            - 'null'
        date_created:
          type:
            - string
            - 'null'
          format: date-time
      type: object
    ObjectStorageBucket:
      description: >-
        Bucket of an object storage, with its usage from the latest daily usage
        data of the storage: a null figure means zero or not available yet
      required:
        - bucket_id
        - object_storage_id
        - sub_account_id
        - region_id
        - bucket_remote_id
        - code
        - code_full
        - bucket_number
        - name
        - versioning
        - creation_date
        - arn
        - policy_json
        - active_storage_bytes
        - deleted_storage_bytes
        - active_objects
        - deleted_objects
        - api_calls_count
        - storage_wrote_bytes
        - storage_read_bytes
        - egress_traffic_bytes
        - ingress_traffic_bytes
        - reference_date
      properties:
        bucket_id:
          type: integer
        object_storage_id:
          description: >-
            Id of the object storage (`GET
            /api/v3/object-storages/{object_storage_id}`)
          type: integer
        sub_account_id:
          description: >-
            Id of the sub-account of the object storage, the account at the
            storage that holds its buckets and IAM users (not the account id of
            the storage)
          type:
            - integer
            - 'null'
        region_id:
          description: Id of the storage region of the bucket
          type:
            - integer
            - 'null'
        bucket_remote_id:
          type:
            - integer
            - 'null'
        code:
          description: Progressive number of the bucket in the object storage
          type:
            - integer
            - 'null'
        code_full:
          description: Same value as `name`
          type:
            - string
            - 'null'
        bucket_number:
          type:
            - string
            - 'null'
        name:
          type:
            - string
            - 'null'
        versioning:
          description: >-
            Versioning status of the bucket: `ENABLED`, `SUSPENDED`, or
            `DISABLED` if it has never been enabled
          type:
            - string
            - 'null'
        creation_date:
          description: Date the bucket was created on the storage
          type:
            - string
            - 'null'
          format: date
        arn:
          description: >-
            ARN (Amazon Resource Name) of the bucket, used in the policies
            (`arn:aws:s3:::<name>`)
          type:
            - string
            - 'null'
        policy_json:
          description: >-
            Policy of the bucket on the storage, as a JSON string, with the
            firewall entries; null if the bucket has none
          type:
            - string
            - 'null'
        active_storage_bytes:
          description: Space used by the active objects, in bytes
          type:
            - integer
            - 'null'
        deleted_storage_bytes:
          description: >-
            Space of the deleted objects that still counts toward the purchased
            space, in bytes
          type:
            - integer
            - 'null'
        active_objects:
          description: Number of active objects
          type:
            - integer
            - 'null'
        deleted_objects:
          description: Number of deleted objects still counted in `deleted_storage_bytes`
          type:
            - integer
            - 'null'
        api_calls_count:
          description: Number of API calls in the day of the latest usage data
          type:
            - integer
            - 'null'
        storage_wrote_bytes:
          description: Data written in the day of the latest usage data, in bytes
          type:
            - integer
            - 'null'
        storage_read_bytes:
          description: Data read in the day of the latest usage data, in bytes
          type:
            - integer
            - 'null'
        egress_traffic_bytes:
          description: Outgoing traffic in the day of the latest usage data, in bytes
          type:
            - integer
            - 'null'
        ingress_traffic_bytes:
          description: Incoming traffic in the day of the latest usage data, in bytes
          type:
            - integer
            - 'null'
        reference_date:
          type:
            - string
            - 'null'
          format: date
      type: object
    ObjectStorageIamUserS3Key:
      description: S3 key of an IAM user of an object storage
      required:
        - s3_key_id
        - object_storage_id
        - iam_user_id
        - access_key
        - secret_key
        - status
        - active
        - date_created
      properties:
        s3_key_id:
          type: integer
        object_storage_id:
          description: >-
            Id of the object storage (`GET
            /api/v3/object-storages/{object_storage_id}`)
          type: integer
        iam_user_id:
          description: >-
            Id of the IAM user (`GET
            /api/v3/object-storages/{object_storage_id}/iam-users/{iam_user_id}`)
          type: integer
        access_key:
          description: Access key ID, to use with `secret_key` in the S3 clients
          type:
            - string
            - 'null'
        secret_key:
          description: >-
            Secret of the S3 key; returned when the key is created and,
            afterwards, only with the objectstorage:secrets scope (null
            otherwise)
          type:
            - string
            - 'null'
        status:
          description: >-
            Status of the key in the IAM service of the storage, for example
            `Active`
          type:
            - string
            - 'null'
        active:
          description: >-
            Whether the key is active: deleted keys are not returned; its state
            on the storage is in `status`
          type:
            - boolean
            - 'null'
        date_created:
          type:
            - string
            - 'null'
          format: date-time
      type: object
    ObjectStorageIamUser:
      description: >-
        IAM user of an object storage: a user of the storage with its own S3
        keys
      required:
        - iam_user_id
        - object_storage_id
        - sub_account_id
        - code
        - code_full
        - iam_id
        - arn
        - active
        - date_created
      properties:
        iam_user_id:
          type: integer
        object_storage_id:
          description: >-
            Id of the object storage (`GET
            /api/v3/object-storages/{object_storage_id}`)
          type: integer
        sub_account_id:
          description: >-
            Id of the sub-account of the object storage, the account at the
            storage that holds its buckets and IAM users (not the account id of
            the storage)
          type: integer
        code:
          description: Progressive number of the IAM user in the object storage
          type:
            - integer
            - 'null'
        code_full:
          description: Username of the IAM user on the storage
          type:
            - string
            - 'null'
        iam_id:
          description: Id of the user in the IAM service of the storage
          type:
            - string
            - 'null'
        arn:
          description: >-
            ARN (Amazon Resource Name) of the IAM user, used in the policies
            (`arn:aws:iam::<account>:user/<username>`)
          type:
            - string
            - 'null'
        active:
          description: 'Whether the IAM user is active: deleted users are not returned'
          type:
            - boolean
            - 'null'
        date_created:
          type:
            - string
            - 'null'
          format: date-time
      type: object
    ObjectStorageS3Key:
      description: >-
        Main S3 key of an object storage: the key of the root user of its
        account at the storage, with the secret
      required:
        - object_storage_id
        - sub_account_id
        - username
        - user_id
        - arn
        - access_key
        - secret_key
      properties:
        object_storage_id:
          description: >-
            Id of the object storage (`GET
            /api/v3/object-storages/{object_storage_id}`)
          type: integer
        sub_account_id:
          description: >-
            Id of the sub-account of the object storage, the account at the
            storage that holds its buckets and IAM users (not the account id of
            the storage)
          type: integer
        username:
          description: Name of the sub-account at the storage
          type:
            - string
            - 'null'
        user_id:
          description: >-
            Id of the root user of the sub-account in the IAM service of the
            storage
          type:
            - string
            - 'null'
        arn:
          description: >-
            ARN (Amazon Resource Name) of the root user of the sub-account, used
            in the policies (`arn:aws:iam::<account>:root`)
          type:
            - string
            - 'null'
        access_key:
          description: >-
            Access key ID, to use with `secret_key` in the S3 clients; null if
            the sub-account has no key saved
          type:
            - string
            - 'null'
        secret_key:
          description: Secret of the key; null if the sub-account has no key saved
          type:
            - string
            - 'null'
      type: object
    ObjectStorage:
      description: >-
        S3-compatible object storage of the account, with the usage of all its
        buckets from the latest daily usage data of the storage: a null figure
        means zero or not available yet
      required:
        - object_storage_id
        - purchase_id
        - name
        - email
        - code
        - code_full
        - active
        - active_storage_bytes
        - deleted_storage_bytes
        - active_objects
        - deleted_objects
        - api_calls_count
        - storage_wrote_bytes
        - storage_read_bytes
        - egress_traffic_bytes
        - ingress_traffic_bytes
        - reference_date
      properties:
        object_storage_id:
          type: integer
        purchase_id:
          description: >-
            Id of the purchase of the object storage (`GET
            /api/v3/purchases/{purchase_id}`)
          type:
            - integer
            - 'null'
        name:
          description: >-
            Name of the object storage account at the storage, the same as
            `code_full`
          type:
            - string
            - 'null'
        email:
          description: >-
            Contact email of the object storage account at the storage,
            generated by the service (`<code_full>@serverlet.it`)
          type:
            - string
            - 'null'
        code:
          type:
            - integer
            - 'null'
        code_full:
          description: Code of the object storage account at the storage, used as its name
          type:
            - string
            - 'null'
        active:
          description: >-
            Whether the object storage account is active at the storage: false
            after its deletion
          type:
            - boolean
            - 'null'
        active_storage_bytes:
          description: Space used by the active objects, in bytes
          type:
            - integer
            - 'null'
        deleted_storage_bytes:
          description: >-
            Space of the deleted objects that still counts toward the purchased
            space, in bytes
          type:
            - integer
            - 'null'
        active_objects:
          description: Number of active objects
          type:
            - integer
            - 'null'
        deleted_objects:
          description: Number of deleted objects still counted in `deleted_storage_bytes`
          type:
            - integer
            - 'null'
        api_calls_count:
          description: Number of API calls in the day of the latest usage data
          type:
            - integer
            - 'null'
        storage_wrote_bytes:
          description: Data written in the day of the latest usage data, in bytes
          type:
            - integer
            - 'null'
        storage_read_bytes:
          description: Data read in the day of the latest usage data, in bytes
          type:
            - integer
            - 'null'
        egress_traffic_bytes:
          description: Outgoing traffic in the day of the latest usage data, in bytes
          type:
            - integer
            - 'null'
        ingress_traffic_bytes:
          description: Incoming traffic in the day of the latest usage data, in bytes
          type:
            - integer
            - 'null'
        reference_date:
          description: >-
            Date the object storage account was created at the storage: it is
            not the date of the usage figures
          type:
            - string
            - 'null'
          format: date
      type: object
    OneClickAutorenew:
      description: Automatic renewal with One-Click payment, with the methods it uses
      required:
        - one_click_preference
      properties:
        one_click_preference:
          description: >-
            Active One-Click methods, in the order in which the automatic
            payments try them until one is authorized
          type: array
          items:
            $ref: '#/components/schemas/OneClick'
      type: object
    OneClick:
      description: >-
        One-Click payment method: a card or an account saved by the customer,
        used for One-Click payments and automatic renewals
      required:
        - one_click_id
        - payment_method
        - description
        - method_type
        - creditcard_pan
        - date_expiry
        - date_created
      properties:
        one_click_id:
          type: integer
        payment_method:
          description: >-
            Name of the payment method, in Italian, for example `Carta di
            credito` or `PayPal`
          type: string
        description:
          description: >-
            Description of the method: the name of the payment method followed
            by the card (brand, last digits and expiry) or the email of the
            account
          type:
            - string
            - 'null'
        method_type:
          description: >-
            Type of the method: `VISA`, `MASTERCARD`, `MAESTRO`,
            `AMERICAN_EXPRESS`, `PAYPAL`, `APPLEPAY`, `GOOGLEPAY`, `AMAZONPAY`
            or `SATISPAY`; null when unknown
          type:
            - string
            - 'null'
        creditcard_pan:
          description: >-
            Number of the card, masked or reduced to the last digits; null for
            the methods without a card
          type:
            - string
            - 'null'
        date_expiry:
          description: >-
            Expiry of the method: the expiry of the card or, without a card,
            four years after the activation
          type:
            - string
            - 'null'
          format: date
        date_created:
          type: string
          format: date-time
      type: object
    OrderCanCancel:
      description: Whether an order can be cancelled
      required:
        - order_id
        - can_cancel
      properties:
        order_id:
          description: Id of the order (`GET /api/v3/orders/{order_id}`)
          type: integer
        can_cancel:
          description: >-
            Whether the order can be cancelled with `DELETE
            /api/v3/orders/{order_id}`: not when it is completed, closed or
            cancelled, or when one of its purchases does not allow it
          type: boolean
      type: object
    OrderCanPay:
      description: Whether an order can be paid, with the orders to pay together with it
      required:
        - order_id
        - amount
        - orders
        - can_pay
      properties:
        order_id:
          description: Id of the order (`GET /api/v3/orders/{order_id}`)
          type: integer
        amount:
          description: >-
            Amount to pay with the payment method of the request, the commission
            of the method included; null when the order cannot be paid with it
          anyOf:
            - $ref: '#/components/schemas/AmountSimple'
            - type: 'null'
        orders:
          description: >-
            Orders paid together with this one; empty when the order cannot be
            paid
          type: array
          items:
            $ref: '#/components/schemas/Order'
        can_pay:
          description: >-
            Whether the order can be paid now with the payment method of the
            request, together with the orders in `orders`: the One-Click method
            is active and not expired, the prepaid credit can be used for these
            orders and is enough
          type: boolean
      type: object
    OrderInvoiceStatus:
      description: Invoicing status of an order
      required:
        - status_code
        - status_name
      properties:
        status_code:
          description: >-
            One of `UNKNOWN`, `EVALUATION`, `NO_INVOICE` (not to be invoiced),
            `READY`, `PROCESSING`, `TO_INVOICE`, `INVOICING` or `INVOICED`
          type: string
        status_name:
          description: Name of the status, in Italian
          type: string
      type: object
    OrderPaymentStatus:
      description: Payment status of an order
      required:
        - status_code
        - status_name
      properties:
        status_code:
          description: One of `NOT_PAYED`, `PARTIALLY_PAYED` or `PAYED`
          type: string
        status_name:
          description: Name of the status, in Italian
          type: string
      type: object
    OrderRow:
      description: 'Row of an order: a service of a purchase, with its price'
      required:
        - order_row_id
        - order_id
        - service
        - purchase
        - recurrence
        - price
        - base_price
      properties:
        order_row_id:
          type: integer
        order_id:
          description: Id of the order (`GET /api/v3/orders/{order_id}`)
          type: integer
        service:
          description: Id of the service ordered (`service_id` of `Service`)
          type:
            - integer
            - 'null'
        purchase:
          description: Id of the purchase (`GET /api/v3/purchases/{purchase_id}`)
          type:
            - integer
            - 'null'
        recurrence:
          description: >-
            Id of the recurrence, the billing period of the row (`recurrence_id`
            of `Recurrence`)
          type:
            - integer
            - 'null'
        price:
          $ref: '#/components/schemas/Amount'
          description: Price of the row, with the promotion applied
        base_price:
          $ref: '#/components/schemas/Amount'
          description: Price of the row before the promotion
      type: object
    OrderStatus:
      description: Processing status of an order
      required:
        - status_code
        - status_name
      properties:
        status_code:
          description: >-
            One of `NEW`, `TO_MANAGE` (to be processed), `EMITTED` (completed),
            `CANCELED` or `CLOSED`
          type: string
        status_name:
          description: Name of the status shown to the customer, in Italian
          type: string
      type: object
    Order:
      description: Order of the account, with its statuses, amounts and invoice
      required:
        - order_id
        - type
        - status
        - payment_status
        - invoice_status
        - invoice
        - billing
        - intent_type
        - date_payed
        - date_confirmed
        - payed
        - total_amount
        - payment_amount
        - origin
        - promotions
        - rows_count
        - date_created
      properties:
        order_id:
          type: integer
        type:
          description: 'Type of the order: `P` (purchase), `R` (renewal) or `U` (update)'
          type: string
        status:
          $ref: '#/components/schemas/OrderStatus'
        payment_status:
          $ref: '#/components/schemas/OrderPaymentStatus'
        invoice_status:
          $ref: '#/components/schemas/OrderInvoiceStatus'
        invoice:
          description: Invoice of the order; null while the order is not invoiced
          anyOf:
            - $ref: '#/components/schemas/Invoice'
            - type: 'null'
        billing:
          $ref: '#/components/schemas/AccountBilling'
        intent_type:
          description: >-
            Intent of the order: `DEFAULT`, `DEPOSIT` (top-up of the prepaid
            credit) or `BALANCE` (paid with the prepaid credit)
          type: string
        date_payed:
          description: Date on which the order was fully paid; null while it is not
          type:
            - string
            - 'null'
          format: date
        date_confirmed:
          description: >-
            When the order was confirmed with deferred payment, to be paid
            later; null otherwise
          type:
            - string
            - 'null'
          format: date-time
        payed:
          description: Whether the order is fully paid
          type: boolean
        total_amount:
          $ref: '#/components/schemas/Amount'
          description: Total of the order and of the orders paid together with it
        payment_amount:
          $ref: '#/components/schemas/Amount'
          description: >-
            Amount still to pay for the order and the orders paid together with
            it, VAT included except in split payment; only `amount` is set
        origin:
          description: >-
            Where the order was created: `web` (control panel or cart), `api`
            (this API), `api2` (API v2) or `cli` (automatic procedures, such as
            the renewals)
          type: string
        promotions:
          description: >-
            Promotions applied to the rows of the order; those that increase the
            price are shown only to administrators
          type: array
          items:
            $ref: '#/components/schemas/Promotion'
        rows_count:
          description: Number of rows of the order (`GET /api/v3/orders/{order_id}/rows`)
          type: integer
        date_created:
          type: string
          format: date-time
      type: object
    PaymentProviderData:
      description: >-
        Data of an attempt of the payment, as given by the payment provider:
        which fields are set, and their format, depend on the provider
      required:
        - payed
        - authorization_token
        - authorization_code
        - status
        - status_code
        - message
        - payer_name
        - payer_surname
        - payer_email
        - bank_issuer
        - creditcard_pan
        - creditcard_issuer
        - creditcard_expiration
        - region
        - transaction_type
        - payment_type
        - payment_date
        - product_type
        - nationality
      properties:
        payed:
          description: Whether the attempt was paid
          type:
            - boolean
            - 'null'
        authorization_token:
          description: Id of the authorization or of the order at the provider
          type:
            - string
            - 'null'
        authorization_code:
          description: Authorization code of the transaction at the provider
          type:
            - string
            - 'null'
        status:
          description: >-
            Status of the attempt at the provider, for example `OK` or
            `COMPLETED`
          type:
            - string
            - 'null'
        status_code:
          description: >-
            Result code of the provider, for example `0` or `DECLINED`;
            `THRESHOLD_EXCEEDED` when the attempt was refused for the payment
            limits
          type:
            - string
            - 'null'
        message:
          description: Message of the provider about the result
          type:
            - string
            - 'null'
        payer_name:
          description: First name of the payer, as given by the provider
          type:
            - string
            - 'null'
        payer_surname:
          description: Surname of the payer, as given by the provider
          type:
            - string
            - 'null'
        payer_email:
          description: Email address of the payer, as given by the provider
          type:
            - string
            - 'null'
        bank_issuer:
          description: >-
            Bank of the payer: the issuer of the card or the bank of the
            transfer
          type:
            - string
            - 'null'
        creditcard_pan:
          description: Number of the card, masked or reduced to the last digits
          type:
            - string
            - 'null'
        creditcard_issuer:
          description: Brand of the card, for example `VISA`, `MASTERCARD` or `AMEX`
          type:
            - string
            - 'null'
        creditcard_expiration:
          description: >-
            Expiry of the card as `YYYY-MM-DD`, the last day of its month; for
            the methods without a card, the expiry set for the authorization
          type:
            - string
            - 'null'
        region:
          description: Area of the card or of the payment, for example `EUROPE` or `SEPA`
          type:
            - string
            - 'null'
        transaction_type:
          description: >-
            Type of the transaction at the provider, for example `NO_3DSECURE`,
            `DEBIT` or `TRF` (transfer)
          type:
            - string
            - 'null'
        payment_type:
          description: >-
            Type of the payment at the provider, for example
            `PAYMENT_METHOD_TOKEN` or `CARD`; `Storno` for a payment created by
            the cancellation of another one
          type:
            - string
            - 'null'
        payment_date:
          description: When the transaction took place at the provider
          type:
            - string
            - 'null'
          format: date-time
        product_type:
          description: Product of the card as given by the provider, for example `VISA`
          type:
            - string
            - 'null'
        nationality:
          description: >-
            Country of the card or of the payer, as an ISO 3166-1 alpha-2 or
            alpha-3 code depending on the provider
          type:
            - string
            - 'null'
      type: object
    Payment:
      description: Payment of one or more orders, with the data of the payment provider
      required:
        - payment_id
        - payment_method
        - payment_code
        - amount_total
        - amount_payed
        - date_payment
        - payed
        - prepaid_credit_operations
        - provider_data
      properties:
        payment_id:
          type: integer
        payment_method:
          description: >-
            Name of the payment method, in Italian, for example `Carta di
            credito` or `Bonifico Bancario`
          type: string
        payment_code:
          description: >-
            Unique code of the payment: `SR` followed by letters and digits, to
            write in the reason of a bank transfer
          type: string
        amount_total:
          $ref: '#/components/schemas/AmountSimple'
          description: Amount of the payment, commission of the payment method included
        amount_payed:
          $ref: '#/components/schemas/AmountSimple'
          description: Amount paid so far
        date_payment:
          description: >-
            When the payment was made (the latest paid attempt); null when
            nothing has been paid
          type:
            - string
            - 'null'
          format: date-time
        payed:
          description: >-
            Whether the payment is complete: `amount_payed` reaches
            `amount_total`
          type: boolean
        prepaid_credit_operations:
          description: >-
            Uses of the prepaid credit made by the payment; empty unless the
            payment is with the prepaid credit
          type: array
          items:
            $ref: '#/components/schemas/PrepaidCreditOperation'
        provider_data:
          description: >-
            Data of the payment provider, from the paid attempt or the latest
            one; null when the payment has no attempts
          anyOf:
            - $ref: '#/components/schemas/PaymentProviderData'
            - type: 'null'
      type: object
    PecDomain:
      description: >-
        Domain certified for PEC (certified email, Posta Elettronica
        Certificata), whose mailboxes have its name after the `@`
      required:
        - pec_domain_id
        - purchase_id
        - purchase_name
        - purchase_status_code
        - purchase_pec_owner_id
        - domain
        - provider_domain_id
        - transfer_in
        - force_decertify_domain
        - aruba_public
        - shellrent_public
        - can_require_owner_change
      properties:
        pec_domain_id:
          type: integer
        purchase_id:
          description: >-
            Id of the purchase of the PEC domain (`GET
            /api/v3/purchases/{purchase_id}`)
          type:
            - integer
            - 'null'
        purchase_name:
          description: >-
            Name of the purchase object, as `purchase_name.object_name` of the
            purchase
          type:
            - string
            - 'null'
        purchase_status_code:
          description: >-
            Status code of the purchase, for example `DELIVERED_V2` or `NEW_V2`
            (not active yet)
          type:
            - string
            - 'null'
        purchase_pec_owner_id:
          description: >-
            Id of the current owner of the PEC domain, as `pec_owner_id` in the
            owner changes
          type:
            - integer
            - 'null'
        domain:
          type:
            - string
            - 'null'
        provider_domain_id:
          description: >-
            Id of the domain at Aruba, the PEC provider; null until the domain
            is certified there
          type:
            - string
            - 'null'
        transfer_in:
          description: >-
            Whether the PEC domain already existed at the provider and was
            transferred to us (incoming transfer)
          type:
            - boolean
            - 'null'
        force_decertify_domain:
          description: >-
            Whether the activation is stopped because the provider refused to
            certify the domain: the domain must be decertified first
          type: boolean
        aruba_public:
          description: >-
            Whether it is a public PEC domain of Aruba, shared by many customers
            (for example `pec.it`)
          type: boolean
        shellrent_public:
          description: >-
            Whether it is one of our public PEC domains, shared by many
            customers (for example `postacert.eu`)
          type: boolean
        can_require_owner_change:
          description: >-
            Whether an owner change can be requested now (`POST
            /api/v3/pec-domains/{pec_domain_id}/owner-changes`): false when the
            purchase is not active, when another request was not approved or
            when the domain is not at the provider yet
          type: boolean
      type: object
    PecOwnerChange:
      description: >-
        Request to change the owner of a PEC mailbox or of a PEC domain, with
        its documents and its status
      required:
        - owner_change_id
        - pec_id
        - pec_domain_id
        - status_code
        - rejection_reason
        - submission_date
        - acceptance_date
        - rejection_date
        - has_identity_document
        - has_contract_document
        - has_order_module_document
        - owner_old
        - owner_new
        - date_created
      properties:
        owner_change_id:
          type:
            - integer
            - 'null'
        pec_id:
          description: >-
            Id of the PEC mailbox of the request (`GET
            /api/v3/pec-mailboxes/{pec_id}`); null for the requests of a PEC
            domain
          type:
            - integer
            - 'null'
        pec_domain_id:
          description: >-
            Id of the PEC domain of the request (`GET
            /api/v3/pec-domains/{pec_domain_id}`); null for the requests of a
            mailbox
          type:
            - integer
            - 'null'
        status_code:
          description: >-
            Status of the request: `PENDENT` (documents not sent yet),
            `PENDENT_APPROVAL` (waiting for our approval), `APPROVED` or
            `REJECTED`
          type:
            - string
            - 'null'
        rejection_reason:
          description: Reason of the rejection; null unless the request was rejected
          type:
            - string
            - 'null'
        submission_date:
          description: When the documents were sent; null until they are
          type:
            - string
            - 'null'
          format: date-time
        acceptance_date:
          description: When the request was approved
          type:
            - string
            - 'null'
          format: date-time
        rejection_date:
          description: When the request was rejected
          type:
            - string
            - 'null'
          format: date-time
        has_identity_document:
          description: Whether the request has the identity document
          type: boolean
        has_contract_document:
          description: Whether the request has the contract
          type: boolean
        has_order_module_document:
          description: Whether the request has the order form
          type: boolean
        owner_old:
          $ref: '#/components/schemas/PecOwnerSummary'
        owner_new:
          $ref: '#/components/schemas/PecOwnerSummary'
        date_created:
          type:
            - string
            - 'null'
          format: date-time
      type: object
    PecOwnerSummary:
      description: >-
        Owner (titolare) of a PEC mailbox or domain: the person and, for
        organizations, the data of the organization; all the fields are null
        when there is no owner
      required:
        - pec_owner_id
        - owner_legal_entity_type
        - admin_first_name
        - admin_last_name
        - admin_email
        - admin_fiscal_code
        - admin_vat_number
        - company_name
        - company_email
        - company_fiscal_code
      properties:
        pec_owner_id:
          description: Id of the owner, as `owner_id` of the owner change requests
          type:
            - integer
            - 'null'
        owner_legal_entity_type:
          description: >-
            Legal form of the owner: `PRIVATO` (private individual),
            `LIBERO_PROFESSIONISTA` (self-employed professional),
            `DITTA_INDIVIDUALE` or the old `AZIENDA_DITTA_INDIVIDUALE` (sole
            proprietorship), `AZIENDA` (company), `PUBBLICA_AMMINISTRAZIONE`
            (public administration) or `NO_PROFIT` (non-profit organization)
          type:
            - string
            - 'null'
        admin_first_name:
          description: >-
            First name of the owner or, for organizations, of the person who
            acts for them
          type:
            - string
            - 'null'
        admin_last_name:
          description: >-
            Last name of the owner or, for organizations, of the person who acts
            for them
          type:
            - string
            - 'null'
        admin_email:
          description: >-
            Email of the owner or, for organizations, of the person who acts for
            them
          type:
            - string
            - 'null'
        admin_fiscal_code:
          description: >-
            Codice fiscale (Italian tax code) of the owner or, for
            organizations, of the person who acts for them
          type:
            - string
            - 'null'
        admin_vat_number:
          description: VAT number (partita IVA) of the owner; not used for `PRIVATO`
          type:
            - string
            - 'null'
        company_name:
          description: >-
            Business name of the organization, for `DITTA_INDIVIDUALE`,
            `AZIENDA`, `PUBBLICA_AMMINISTRAZIONE` and `NO_PROFIT`
          type:
            - string
            - 'null'
        company_email:
          description: >-
            Email of the organization, for `AZIENDA`, `PUBBLICA_AMMINISTRAZIONE`
            and `NO_PROFIT`
          type:
            - string
            - 'null'
        company_fiscal_code:
          description: >-
            Codice fiscale (Italian tax code) of the organization, for
            `AZIENDA`, `PUBBLICA_AMMINISTRAZIONE` and `NO_PROFIT`
          type:
            - string
            - 'null'
      type: object
    Pec:
      description: >-
        PEC (certified email, Posta Elettronica Certificata) mailbox of the
        account
      required:
        - pec_id
        - purchase_id
        - purchase_name
        - purchase_status_code
        - box_name
        - full_box_name
        - domain
        - report_email
        - report_sms
        - password_recovery_email
        - inbox_usage
        - archive_usage
        - extra_inbox
        - extra_archive
        - transfer_in
        - owner_not_assignable
        - password_wrong
      properties:
        pec_id:
          type: integer
        purchase_id:
          description: >-
            Id of the purchase of the mailbox (`GET
            /api/v3/purchases/{purchase_id}`)
          type:
            - integer
            - 'null'
        purchase_name:
          description: >-
            Name of the purchase object, as `purchase_name.object_name` of the
            purchase
          type:
            - string
            - 'null'
        purchase_status_code:
          description: >-
            Status code of the purchase, for example `ACTIVE_V2` or `NEW_V2`
            (not active yet)
          type:
            - string
            - 'null'
        box_name:
          description: >-
            Name of the mailbox, the part of the address before `@`; null until
            it is chosen
          type:
            - string
            - 'null'
        full_box_name:
          description: >-
            Address of the mailbox (`box_name@domain`); empty until the name is
            chosen
          type:
            - string
            - 'null'
        domain:
          type:
            - string
            - 'null'
        report_email:
          description: Notification email for the PEC reports of the mailbox
          type:
            - string
            - 'null'
        report_sms:
          description: >-
            Phone number that receives the SMS notifications of the mailbox;
            null when the SMS service is not active
          type:
            - string
            - 'null'
        password_recovery_email:
          description: Email used to recover the password of the mailbox
          type:
            - string
            - 'null'
        inbox_usage:
          description: Space used in the inbox, in MB
          type:
            - number
            - 'null'
          format: float
        archive_usage:
          description: Space used in the archive, in MB
          type:
            - number
            - 'null'
          format: float
        extra_inbox:
          description: Additional inbox space bought, in GB
          type:
            - integer
            - 'null'
        extra_archive:
          description: Additional archive space bought, in GB
          type:
            - integer
            - 'null'
        transfer_in:
          description: >-
            Whether the mailbox already existed and was transferred to us
            (incoming transfer)
          type: boolean
        owner_not_assignable:
          description: >-
            Whether Aruba, the PEC provider, refused to assign the chosen owner
            to the mailbox during the activation
          type: boolean
        password_wrong:
          description: >-
            Whether the password of the mailbox saved for the backups turned out
            wrong; the backups need the right one
          type: boolean
      type: object
    PrepaidCreditOperation:
      description: >-
        Operation on the prepaid credit, such as a top-up or a payment with the
        credit
      required:
        - operation_id
        - operation_id_related
        - prepaid_credit_topup
        - operation_type
        - creditnote
        - amount
        - date_created
      properties:
        operation_id:
          type: integer
        operation_id_related:
          description: >-
            Id of the payment with the credit (`REDEMPTION`) that the operation
            cancels, for `REDEMPTION_CANCELLATION` (`GET
            /api/v3/prepaid-credit/operations/{operation_id}`); null for the
            other types
          type:
            - integer
            - 'null'
        prepaid_credit_topup:
          $ref: '#/components/schemas/PrepaidCreditTopup'
          description: Top-up whose credit the operation adds or uses
        operation_type:
          $ref: '#/components/schemas/PrepaidCreditOperationType'
        creditnote:
          description: >-
            Credit note issued for the operation, for `REFUND` and
            `CREDIT_CANCELLATION`; null for the other types
          anyOf:
            - $ref: '#/components/schemas/Creditnote'
            - type: 'null'
        amount:
          $ref: '#/components/schemas/AmountSimple'
          description: >-
            Amount of the operation: positive when it adds credit, negative when
            it uses or removes it
        date_created:
          type: string
          format: date-time
      type: object
    PrepaidCreditOperationType:
      description: Type of an operation on the prepaid credit
      required:
        - type_code
        - type_description
      properties:
        type_code:
          description: >-
            One of `TOP_UP`, `REDEMPTION` (payment with the credit),
            `REDEMPTION_CANCELLATION`, `PAYMENT_CANCELLATION`, `REFUND`,
            `CREDIT_CANCELLATION`, `RESET_CREDIT` or `RESELLER_SHOP_REFUND`
          type: string
        type_description:
          description: Name of the type, in Italian
          type: string
      type: object
    PrepaidCreditTopup:
      description: >-
        Top-up of the prepaid credit, with its deposit invoice and the credit
        left
      required:
        - topup_id
        - invoice
        - initial_credit
        - current_credit
        - refund_expiry
        - credit_expiry
        - date_created
      properties:
        topup_id:
          type: integer
        invoice:
          description: Deposit invoice of the top-up; null until it is issued
          anyOf:
            - $ref: '#/components/schemas/Invoice'
            - type: 'null'
        initial_credit:
          $ref: '#/components/schemas/AmountSimple'
          description: Credit loaded by the top-up, VAT included
        current_credit:
          $ref: '#/components/schemas/AmountSimple'
          description: Credit of the top-up not used yet
        refund_expiry:
          description: >-
            Last day on which the credit left can be refunded; null when there
            is no limit
          type:
            - string
            - 'null'
          format: date
        credit_expiry:
          description: >-
            Expiry date of the credit of the top-up; null when it does not
            expire
          type:
            - string
            - 'null'
          format: date
        date_created:
          type: string
          format: date-time
      type: object
    PrepaidCredit:
      description: Prepaid credit of the account, with its alert threshold
      required:
        - credit_amount
        - credit_threshold
        - threshold_exceeded
      properties:
        credit_amount:
          $ref: '#/components/schemas/AmountSimple'
        credit_threshold:
          description: >-
            Alert threshold: when the credit falls below it, the customer
            receives an email; null without a threshold
          anyOf:
            - $ref: '#/components/schemas/AmountSimple'
            - type: 'null'
        threshold_exceeded:
          description: Whether the credit is below the threshold; null without a threshold
          type:
            - boolean
            - 'null'
      type: object
    PrivateCloud:
      description: >-
        Private cloud, with the resources of its plan and the limits of its
        virtual machines
      required:
        - purchase_id
        - server_id
        - max_vm
        - available_vm
        - max_cpu
        - cpu_overallocation
        - min_vm_cpu
        - max_vm_cpu
        - max_ram
        - min_vm_ram
        - max_vm_ram
        - max_disk
        - min_vm_disk
        - max_vm_disk
        - max_backup
        - max_disk_backup
      properties:
        purchase_id:
          description: >-
            Id of the purchase of the private cloud (`GET
            /api/v3/purchases/{purchase_id}`)
          type: integer
        server_id:
          description: >-
            Id of the server of the private cloud (`GET
            /api/v3/servers/{server_id}`)
          type:
            - integer
            - 'null'
        max_vm:
          description: Maximum number of virtual machines of the private cloud
          type:
            - integer
            - 'null'
        available_vm:
          description: >-
            Number of virtual machines that can still be created: `max_vm` minus
            the current ones
          type:
            - integer
            - 'null'
        max_cpu:
          description: Total vCPUs of the private cloud, `cpu_overallocation` included
          type:
            - integer
            - 'null'
        cpu_overallocation:
          description: >-
            vCPUs of `max_cpu` that come from overallocation (extra cores); null
            when the private cloud has none
          type:
            - integer
            - 'null'
        min_vm_cpu:
          description: Minimum vCPUs of a virtual machine
          type:
            - integer
            - 'null'
        max_vm_cpu:
          description: Maximum vCPUs of a virtual machine
          type:
            - integer
            - 'null'
        max_ram:
          description: Total RAM of the private cloud, in MB
          type:
            - integer
            - 'null'
        min_vm_ram:
          description: Minimum RAM of a virtual machine, in MB
          type:
            - integer
            - 'null'
        max_vm_ram:
          description: Maximum RAM of a virtual machine, in MB
          type:
            - integer
            - 'null'
        max_disk:
          description: Total disk space of the private cloud, in GB
          type:
            - integer
            - 'null'
        min_vm_disk:
          description: Minimum disk space of a virtual machine, in GB
          type:
            - integer
            - 'null'
        max_vm_disk:
          description: Maximum disk space of a virtual machine, in GB
          type:
            - integer
            - 'null'
        max_backup:
          description: Total backup space of the private cloud, in GB
          type:
            - integer
            - 'null'
        max_disk_backup:
          description: >-
            Daily backup space of the private cloud, in GB: the disk space of
            its virtual machines with the daily backup cannot go beyond it
          type:
            - integer
            - 'null'
      type: object
    Promotion:
      description: >-
        Promotion applied to a row of an order: of the `percentage_*` and
        `amount_*` fields, only the one of its type is set
      required:
        - promocode
        - description
        - percentage_increase
        - percentage_decrease
        - amount_increase
        - amount_decrease
        - amount_fixed
        - applied_amount
        - date_applied
      properties:
        promocode:
          description: >-
            Promotional code used; null when the promotion applies without a
            code
          type:
            - string
            - 'null'
        description:
          description: Promotion description; null when the promotion has none
          type:
            - string
            - 'null'
        percentage_increase:
          description: Price increase, in percent; null for the other types
          type:
            - number
            - 'null'
          format: float
        percentage_decrease:
          description: Discount, in percent; null for the other types
          type:
            - number
            - 'null'
          format: float
        amount_increase:
          description: Price increase, as an amount before VAT; null for the other types
          anyOf:
            - $ref: '#/components/schemas/Amount'
            - type: 'null'
        amount_decrease:
          description: Discount, as an amount before VAT; null for the other types
          anyOf:
            - $ref: '#/components/schemas/Amount'
            - type: 'null'
        amount_fixed:
          description: >-
            Fixed price set by the promotion, before VAT; null for the other
            types
          anyOf:
            - $ref: '#/components/schemas/Amount'
            - type: 'null'
        applied_amount:
          description: >-
            Difference between the base price and the price of the order row
            (`base_price` and `price` of `OrderRow`): negative when the
            promotion increases the price
          anyOf:
            - $ref: '#/components/schemas/Amount'
            - type: 'null'
        date_applied:
          description: When the promotion was applied to the order
          type: string
          format: date-time
      type: object
    PurchaseCanAddAdditional:
      description: >-
        Whether additional services can be bought for the purchase, with the
        services available
      required:
        - purchase_id
        - can_add_additional
        - services
      properties:
        purchase_id:
          description: Id of the purchase (`GET /api/v3/purchases/{purchase_id}`)
          type: integer
        can_add_additional:
          description: Whether additional services can be bought for the purchase now
          type: boolean
        services:
          description: >-
            Additional services that can be bought for the purchase; empty when
            `can_add_additional` is false
          type: array
          items:
            $ref: '#/components/schemas/Service'
      type: object
    PurchaseCanCancel:
      description: >-
        Whether the purchase can be cancelled (`DELETE
        /api/v3/purchases/{purchase_id}`)
      required:
        - purchase_id
        - can_cancel
      properties:
        purchase_id:
          description: Id of the purchase (`GET /api/v3/purchases/{purchase_id}`)
          type: integer
        can_cancel:
          description: >-
            Whether the purchase can be cancelled: only before its activation,
            and if its additional purchases can be cancelled too
          type: boolean
      type: object
    PurchaseCanChangeRecurrence:
      description: >-
        Whether the recurrence of the purchase can be changed (`PATCH
        /api/v3/purchases/{purchase_id}/recurrence`)
      required:
        - purchase_id
        - can_change_recurrence
      properties:
        purchase_id:
          description: Id of the purchase (`GET /api/v3/purchases/{purchase_id}`)
          type: integer
        can_change_recurrence:
          description: >-
            Whether the recurrence can be changed to the one in the
            `recurrence_id` query parameter
          type: boolean
      type: object
    PurchaseCanChangeRenewStatus:
      description: >-
        Whether the renew status of the purchase can be changed (`PATCH
        /api/v3/purchases/{purchase_id}/renew-status`)
      required:
        - purchase_id
        - can_change_renew_status
      properties:
        purchase_id:
          description: Id of the purchase (`GET /api/v3/purchases/{purchase_id}`)
          type: integer
        can_change_renew_status:
          description: >-
            Whether the renew status can be set to the one in the `status` query
            parameter
          type: boolean
      type: object
    PurchaseCanChangeService:
      description: >-
        Whether the service of the purchase can be changed (plan change), with
        the services available
      required:
        - purchase_id
        - can_change_service
        - services
      properties:
        purchase_id:
          description: Id of the purchase (`GET /api/v3/purchases/{purchase_id}`)
          type: integer
        can_change_service:
          description: Whether the purchase allows a change of service now
          type: boolean
        services:
          description: Collection of Services to which it is possible to make the change.
          type: array
          items:
            $ref: '#/components/schemas/ServiceChange'
      type: object
    PurchaseCanRenew:
      description: >-
        Whether the purchase can be renewed now (`POST
        /api/v3/purchases/{purchase_id}/renewals`)
      required:
        - purchase_id
        - can_renew
      properties:
        purchase_id:
          description: Id of the purchase (`GET /api/v3/purchases/{purchase_id}`)
          type: integer
        can_renew:
          description: >-
            Whether the purchase can be renewed now: possible from
            `recurrence.days_renew` days before the expiry, when it is set to
            renew and has no pending order
          type: boolean
      type: object
    PurchaseName:
      description: >-
        Names of the purchase: the name of the service, the name of its object
        and the two together
      required:
        - name
        - full_name
        - object_name
      properties:
        name:
          description: Service name
          type: string
        full_name:
          description: Complete name (Service and object name)
          type: string
        object_name:
          description: Name of the purchase object (ie. domain name, server hostname, etc.)
          type:
            - string
            - 'null'
      type: object
    PurchaseProvisioningStatus:
      description: Operation in progress on the purchase, such as its activation or renewal
      required:
        - status_code
        - status_name
      properties:
        status_code:
          description: >-
            Code of the operation in progress: `SLEEPY` (none), `TO_ACTIVATE`,
            `TO_RENEW`, `TO_SUSPEND`, `TO_RESUME` (reactivation), `TO_DISMISS`
            or `TO_CANCEL`
          type: string
        status_name:
          description: Name of the operation in progress, in Italian
          type: string
      type: object
    PurchaseStatus:
      required:
        - status_code
        - status_name
      properties:
        status_code:
          description: >-
            Status code: `NEW_V2` (just created), `ACTIVE_V2` (active),
            `DELIVERED_V2` (active without renewals), `DISMISSED_V2` (at the end
            of its life), `CANCELED_V2` (cancelled before the activation) or
            `DELETED_V2` (deleted one-off purchase)
          type: string
        status_name:
          description: Name of the status, in Italian
          type: string
      type: object
    Purchase:
      description: >-
        Purchase of a service, with its status, prices, recurrence, billing data
        and the resources linked to it
      required:
        - purchase_id
        - account
        - service
        - billing
        - recurrence
        - recurrence_default
        - purchase_id_primary
        - purchase_status
        - purchase_provisioning_status
        - purchase_name
        - activation_quantity
        - quantity
        - activation_price
        - renew_price
        - renew_price_discounted
        - restore_price
        - date_activation
        - date_activation_start
        - date_expiry
        - date_dismission
        - do_not_renew
        - suspended
        - comment
        - billing_data
        - tasks
        - purchase_additionals
        - domain_id
        - server_id
        - ssl_certificate_id
        - pec_id
        - pec_domain_id
        - hosting_id
        - monitoring_id
        - license_id
        - microsoft365_id
        - cloud_storage_id
        - object_storage_id
        - veeam_baas_id
        - date_created
      properties:
        purchase_id:
          description: ID of purchase
          type: integer
        account:
          description: >-
            Account information of the user owner of the purchase. NULL if the
            purchase is not billed to a Reseller.
          anyOf:
            - $ref: '#/components/schemas/Account'
            - type: 'null'
        service:
          $ref: '#/components/schemas/Service'
          description: Service information of the purchase
        billing:
          $ref: '#/components/schemas/AccountBilling'
          description: Billing information of the owner of the purchase.
        recurrence:
          $ref: '#/components/schemas/Recurrence'
          description: Recurrence frequency information.
        recurrence_default:
          $ref: '#/components/schemas/Recurrence'
          description: >-
            Recurrence applied to the prices of the purchase, ie. "EUR
            100,00/month".
        purchase_id_primary:
          description: ID of primary purchase if this is an additional purchase.
          type:
            - integer
            - 'null'
        purchase_status:
          $ref: '#/components/schemas/PurchaseStatus'
          description: Status of the purchase.
        purchase_provisioning_status:
          $ref: '#/components/schemas/PurchaseProvisioningStatus'
          description: >-
            Current provisioning status of purchase (changes during activation,
            renews, etc.).
        purchase_name:
          $ref: '#/components/schemas/PurchaseName'
          description: Name of the purchase.
        activation_quantity:
          description: Quantity (instances) purchased.
          type: integer
        quantity:
          description: Current purchase quantity (instances).
          type: integer
        activation_price:
          description: Purchase price; null for sub-accounts.
          anyOf:
            - $ref: '#/components/schemas/Amount'
            - type: 'null'
        renew_price:
          description: >-
            Renew price (applied on recurring purchases only); null for
            sub-accounts.
          anyOf:
            - $ref: '#/components/schemas/Amount'
            - type: 'null'
        renew_price_discounted:
          description: >-
            Renew price with the discount granted to the purchase by a discount
            promotion, for the same recurrence as `renew_price`; null when the
            purchase has no discount, and for sub-accounts.
          anyOf:
            - $ref: '#/components/schemas/Amount'
            - type: 'null'
        restore_price:
          description: >-
            Restore/reactivation price (applied on domains only); null for
            sub-accounts.
          anyOf:
            - $ref: '#/components/schemas/Amount'
            - type: 'null'
        date_activation:
          description: Purchase date.
          type:
            - string
            - 'null'
          format: date
        date_activation_start:
          description: Date when the activation started.
          type:
            - string
            - 'null'
          format: date
        date_expiry:
          description: Purchase expiration date (applied on recurring purchases only).
          type:
            - string
            - 'null'
          format: date
        date_dismission:
          description: Purchase dismission date.
          type:
            - string
            - 'null'
          format: date
        do_not_renew:
          description: Tells if purchase has to be renewed.
          type: boolean
        suspended:
          description: Tells if purchase is currently suspended.
          type: boolean
        comment:
          description: User comment (will be included in invoice description).
          type:
            - string
            - 'null'
        billing_data:
          $ref: '#/components/schemas/BillingData'
          description: Billing data (ODA, CIG, CUP...).
        tasks:
          description: Tasks currently running on the purchase.
          type: array
          items:
            $ref: '#/components/schemas/Task'
        purchase_additionals:
          description: Collection of IDs of active additional purchases for this purchase.
          type: array
          items:
            type: integer
        domain_id:
          description: ID of the domain associated with this purchase.
          type:
            - integer
            - 'null'
        server_id:
          description: ID of the server associated with this purchase.
          type:
            - integer
            - 'null'
        ssl_certificate_id:
          description: ID of the SSL certificate associated with this purchase.
          type:
            - integer
            - 'null'
        pec_id:
          description: ID of the PEC associated with this purchase.
          type:
            - integer
            - 'null'
        pec_domain_id:
          description: ID of the PEC domain associated with this purchase.
          type:
            - integer
            - 'null'
        hosting_id:
          description: ID of the web hosting associated with this purchase.
          type:
            - integer
            - 'null'
        monitoring_id:
          description: ID of the monitoring service associated with this purchase.
          type:
            - integer
            - 'null'
        license_id:
          description: ID of the license associated with this purchase.
          type:
            - integer
            - 'null'
        microsoft365_id:
          description: ID of the Microsoft 365 subscription associated with this purchase.
          type:
            - integer
            - 'null'
        cloud_storage_id:
          description: ID of the cloud storage associated with this purchase.
          type:
            - integer
            - 'null'
        object_storage_id:
          description: ID of the object storage associated with this purchase.
          type:
            - integer
            - 'null'
        veeam_baas_id:
          description: ID of the Veeam Backup as a Service associated with this purchase.
          type:
            - integer
            - 'null'
        date_created:
          description: Datetime when the purchase was first created.
          type: string
          format: date-time
      type: object
    RecurrenceFrequency:
      description: >-
        Frequency of a recurrence: a number of years, months or weeks, or a
        one-off charge
      required:
        - family
        - value
      properties:
        family:
          description: >-
            Unit of the frequency: `Y` (years), `M` (months), `W` (weeks) or `U`
            (one-off, without renewals)
          type: string
        value:
          description: >-
            Number of units of the frequency, for example 12 with `M`; null with
            `U`
          type:
            - integer
            - 'null'
      type: object
    Recurrence:
      description: >-
        Billing recurrence: its frequency and, in days, the timings of renewal,
        suspension and dismission
      required:
        - recurrence_id
        - frequency
        - days_renew
        - days_autorenew
        - days_suspension
        - days_restore
        - days_dismission
        - days_cancel
        - days_renew_dismission
        - days_no_secondary
        - days_no_service_change
      properties:
        recurrence_id:
          type: integer
        frequency:
          $ref: '#/components/schemas/RecurrenceFrequency'
        days_renew:
          description: >-
            Days before the expiry from which the purchase can be renewed and
            the renewal order is created
          type:
            - integer
            - 'null'
        days_autorenew:
          description: Days before the expiry when the automatic renewal is attempted
          type:
            - integer
            - 'null'
        days_suspension:
          description: >-
            Days after the expiry when a purchase not renewed is suspended; null
            if it is not suspended
          type:
            - integer
            - 'null'
        days_restore:
          description: >-
            Days after the expiry from which the restore price is charged in
            addition to the renewal price
          type:
            - integer
            - 'null'
        days_dismission:
          description: Days after the expiry when a purchase not renewed is dismissed
          type:
            - integer
            - 'null'
        days_cancel:
          description: >-
            Days after the start of the activation when a purchase never
            activated is cancelled automatically
          type:
            - integer
            - 'null'
        days_renew_dismission:
          description: >-
            Days after the expiry when a purchase whose renewal was not
            completed is dismissed automatically
          type:
            - integer
            - 'null'
        days_no_secondary:
          description: >-
            Days before the expiry from which additional services can no longer
            be bought for the purchase
          type:
            - integer
            - 'null'
        days_no_service_change:
          description: >-
            Days before the expiry from which the service of the purchase can no
            longer be changed
          type:
            - integer
            - 'null'
      type: object
    SdiDocumentStatus:
      description: >-
        Status of an electronic document on SDI (`Sistema di Interscambio`), the
        Italian e-invoicing exchange system
      required:
        - status_code
        - status_name
      properties:
        status_code:
          description: >-
            One of `TO_SIGN`, `TO_SEND`, `SENT`, `DELIVERED`, `NOT_DELIVERED` or
            `DISCARDED` (rejected by SDI)
          type: string
        status_name:
          description: Name of the status, in Italian
          type: string
      type: object
    SdiDocumentType:
      description: >-
        Type of an electronic document on SDI, the Italian e-invoicing exchange
        system (`TipoDocumento`)
      required:
        - type_code
        - type_description
      properties:
        type_code:
          description: >-
            Code of the type, for example `TD01` (invoice), `TD02` (deposit
            invoice) or `TD04` (credit note)
          type: string
        type_description:
          description: Description of the type, in Italian
          type: string
      type: object
    ServerAutomaticSnapshot:
      description: Schedule of the automatic snapshots of a server
      required:
        - snapshot_id
        - server_id
        - name
        - days_of_week
        - hour_of_day
        - is_active
      properties:
        snapshot_id:
          description: Id of the schedule (not of a snapshot)
          type: integer
        server_id:
          description: Id of the server (`GET /api/v3/servers/{server_id}`)
          type: integer
        name:
          description: Name of the snapshots that the schedule creates
          type: string
        days_of_week:
          description: Days of the week of the snapshots, from 1 (Monday) to 7 (Sunday)
          type: array
          items:
            type: integer
        hour_of_day:
          description: Time of the snapshots, in 24-hour `HH:MM` format
          type: string
        is_active:
          description: Whether the schedule is active
          type: boolean
      type: object
    ServerBackup:
      description: Backup of a server that the customer can see
      required:
        - server_backup_id
        - backup_recurrent_id
        - backup_server_id_parent
        - server_id
        - cluster_id_server_residence
        - cluster_id_backup_residence
        - backup_type_id
        - backup_mode
        - backup_frequency_id
        - backup_type_code
        - backup_frequency_code
        - backup_date
        - backup_size
        - backup_duration
        - exit_status
        - error_type
        - date_created
        - checksum
        - backup_user_visibility
      properties:
        server_backup_id:
          type: integer
        backup_recurrent_id:
          description: >-
            Id of the run of the recurrent backup that made the backup; null for
            a one-off backup
          type:
            - integer
            - 'null'
        backup_server_id_parent:
          description: >-
            Id of the backup this one is based on, for incremental backups; null
            otherwise
          type:
            - integer
            - 'null'
        server_id:
          description: Id of the backed up server (`GET /api/v3/servers/{server_id}`)
          type:
            - integer
            - 'null'
        cluster_id_server_residence:
          description: Id of the cluster where the server resides
          type:
            - integer
            - 'null'
        cluster_id_backup_residence:
          description: Id of the cluster where the backup is kept
          type:
            - integer
            - 'null'
        backup_type_id:
          description: Id of the backup type
          type:
            - integer
            - 'null'
        backup_mode:
          description: >-
            Strategy of the backup type: `FULL`, `INC` (incremental) or `DIFF`
            (differential)
          type:
            - string
            - 'null'
        backup_frequency_id:
          description: Id of the frequency of the backup type
          type:
            - integer
            - 'null'
        backup_type_code:
          description: >-
            Code of the backup type, for example `CLOUD_DAILY`, `CLOUD_WEEKLY`
            or `CLOUD_UNA_TANTUM` (one-off)
          type:
            - string
            - 'null'
        backup_frequency_code:
          description: >-
            Frequency of the backup type: `D` daily, `W` weekly, `HM` twice a
            month, `M` monthly, `HY` every six months, `Y` yearly, `C` one-off,
            `R` private cloud replication
          type:
            - string
            - 'null'
        backup_date:
          description: Date the backup was taken
          type:
            - string
            - 'null'
          format: date-time
        backup_size:
          description: Size of the backup, in MB
          type:
            - integer
            - 'null'
        backup_duration:
          description: >-
            Duration of the backup, as text in the `H:MM:SS` form, preceded by
            the days for longer backups (for example `1 day, 2:03:04`)
          type:
            - string
            - 'null'
        exit_status:
          description: 'Exit status of the backup: `0` if it succeeded'
          type:
            - integer
            - 'null'
        error_type:
          description: >-
            Error of the backup, as a code or a message (for example
            `DOWNLOAD_DISK_FAILED`); `N.A.` when it succeeded
          type:
            - string
            - 'null'
        date_created:
          type:
            - string
            - 'null'
          format: date-time
        checksum:
          description: Checksum of the backup, sent by the backup scripts; null if not sent
          type:
            - string
            - 'null'
        backup_user_visibility:
          description: >-
            Whether the customer can see the backup: only the most recent
            successful backups of each type are visible, as many as the
            retention of the type, and only those are returned
          type:
            - boolean
            - 'null'
      type: object
    ServerCanAction:
      description: Result of the check of a power action of the server
      required:
        - server_id
        - can_action
      properties:
        server_id:
          description: Id of the server (`GET /api/v3/servers/{server_id}`)
          type: integer
        can_action:
          description: >-
            Whether the power action can start now with `POST
            /api/v3/servers/{server_id}/power-actions`
          type: boolean
      type: object
    ServerCredential:
      description: Root credentials of the server
      required:
        - type
        - username
        - password
        - visible
      properties:
        type:
          description: 'Type of the credentials: always `root`'
          type: string
        username:
          description: Username of the root user of the server; null when it is not set
          type:
            - string
            - 'null'
        password:
          description: Password of the root user; null when `visible` is false
          type:
            - string
            - 'null'
        visible:
          description: >-
            Whether `password` is returned: false when the root password is not
            set or is not visible to the customer
          type: boolean
      type: object
    ServerMonitoringProbeChart:
      description: Values measured by a probe of a server monitoring in the last day
      required:
        - server_monitoring_id
        - probe_id
        - interval
        - points
      properties:
        server_monitoring_id:
          description: >-
            Id of the server monitoring (`GET
            /api/v3/server-monitorings/{server_monitoring_id}`)
          type: integer
        probe_id:
          description: >-
            Id of the probe (`GET
            /api/v3/server-monitorings/{server_monitoring_id}/probes/{probe_id}`)
          type: integer
        interval:
          description: >-
            Period covered by the chart, as an ISO 8601 duration: always `P1D`,
            the last day
          type: string
          example: P1D
        points:
          description: Values measured by the probe in the period, in time order
          type: array
          items:
            required:
              - x
              - 'y'
            properties:
              x:
                description: UNIX timestamp in milliseconds
                type: number
                format: float
              'y':
                description: Probe value
                type: number
                format: float
            type: object
      type: object
    ServerMonitoringProbe:
      description: >-
        Probe of a server monitoring: a check of the monitored host, with its
        state and its notification contacts
      required:
        - probe_id
        - server_monitoring_id
        - template_id
        - template_code
        - template_name
        - monitoring_item_id
        - monitoring_trigger_id
        - is_default
        - advanced_item
        - is_error
        - monitoring_item_disabled
        - action_enabled
        - notification_email
        - notification_sms
        - date_problem
        - date_last_notification
        - active
      properties:
        probe_id:
          type: integer
        server_monitoring_id:
          description: >-
            Id of the server monitoring of the probe (`GET
            /api/v3/server-monitorings/{server_monitoring_id}`)
          type: integer
        template_id:
          description: >-
            Id of the probe template, the `server_monitoring_item_template_id`
            of `POST /api/v3/server-monitorings/{server_monitoring_id}/probes`
          type:
            - integer
            - 'null'
        template_code:
          description: >-
            Code of the probe template, for example `SERVER_DOWN`,
            `HTTP_SERVICE_DOWN` or `FREE_DISK_SPACE`
          type:
            - string
            - 'null'
        template_name:
          description: Name of the probe template
          type:
            - string
            - 'null'
        monitoring_item_id:
          description: >-
            Id of the item of the probe in the monitoring system (Zabbix); null
            until the probe is created there
          type:
            - integer
            - 'null'
        monitoring_trigger_id:
          description: >-
            Id of the trigger of the probe in the monitoring system (Zabbix);
            null until it is created there
          type:
            - integer
            - 'null'
        is_default:
          description: >-
            Whether it is the default probe of the monitoring, the ICMP check of
            the host (template `SERVER_DOWN`)
          type: boolean
        advanced_item:
          description: >-
            Whether the probe counts towards `probe_limit` of the monitoring,
            like the probes added with `POST
            /api/v3/server-monitorings/{server_monitoring_id}/probes`; the
            statistics probes do not
          type: boolean
        is_error:
          description: >-
            Whether the probe is in error; null when no problem was detected or
            the solved problem has already been notified
          type:
            - boolean
            - 'null'
        monitoring_item_disabled:
          description: Whether the probe is disabled in the monitoring system
          type: boolean
        action_enabled:
          description: >-
            Whether the automatic action of the probe is enabled; the actions
            run only on the `plus` monitorings
          type: boolean
        notification_email:
          description: >-
            Email address that receives the notifications of the probe; empty or
            null when the probe sends no email
          type:
            - string
            - 'null'
        notification_sms:
          description: >-
            Phone number that receives the notifications of the probe by SMS, an
            Italian number without the international prefix; empty or null when
            the probe sends no SMS
          type:
            - string
            - 'null'
        date_problem:
          description: >-
            When the last problem detected by the probe started; null when there
            is no problem
          type:
            - string
            - 'null'
          format: date-time
        date_last_notification:
          description: >-
            When the last notification of the problem was sent; null when none
            was sent for the current problem
          type:
            - string
            - 'null'
          format: date-time
        active:
          description: 'Whether the probe is active: the endpoints return only active probes'
          type: boolean
      type: object
    ServerMonitoring:
      description: >-
        Server monitoring service of the account, with the host it checks and
        its settings
      required:
        - server_monitoring_id
        - purchase_monitoring_id
        - purchase_server_id
        - service_name
        - purchase_name
        - purchase_status_code
        - monitoring_key
        - is_server_monitored
        - is_ip_monitored
        - is_external_device_monitored
        - monitoring_host_enabled
        - monitoring_type
        - probe_limit
        - severity_level
        - email_notification
        - sms_notification
      properties:
        server_monitoring_id:
          type: integer
        purchase_monitoring_id:
          description: >-
            Id of the purchase of the monitoring service (`GET
            /api/v3/purchases/{purchase_id}`)
          type:
            - integer
            - 'null'
        purchase_server_id:
          description: >-
            Id of the purchase of the monitored server (`GET
            /api/v3/purchases/{purchase_id}`); null when the monitoring checks a
            hostname or an IP address
          type:
            - integer
            - 'null'
        service_name:
          description: Name of the service of the monitoring purchase
          type:
            - string
            - 'null'
        purchase_name:
          description: >-
            Name of the object of the monitoring purchase, usually the monitored
            hostname or IP address
          type:
            - string
            - 'null'
        purchase_status_code:
          description: >-
            Status code of the monitoring purchase, for example `ACTIVE_V2` or
            `NEW_V2` (not active yet)
          type:
            - string
            - 'null'
        monitoring_key:
          description: >-
            Host checked by the monitoring: the hostname of the monitored
            server, or the hostname or IP address given
          type:
            - string
            - 'null'
        is_server_monitored:
          description: >-
            Whether the monitoring checks a server, given by its purchase
            (`purchase_server_id`) or by its hostname
          type: boolean
        is_ip_monitored:
          description: Whether the monitoring checks an IP address
          type: boolean
        is_external_device_monitored:
          description: >-
            Whether the monitoring checks an external device, given by hostname
            or IP address instead of a server or an IP address of the account
          type: boolean
        monitoring_host_enabled:
          description: Whether the monitoring of the host is enabled
          type: boolean
        monitoring_type:
          description: >-
            Type of the monitoring: `default` (Base) or `plus` (Managed), which
            can also run the automatic actions of the probes
          type:
            - string
            - 'null'
        probe_limit:
          description: >-
            Maximum number of probes of the monitoring, counting the probes with
            `advanced_item`
          type:
            - integer
            - 'null'
        severity_level:
          description: >-
            Severity of the problems detected by the probes: `default`, `high`
            or `disaster`
          type:
            - string
            - 'null'
        email_notification:
          description: >-
            Default email address for the notifications of the probes; each
            probe has its own (`notification_email`)
          type:
            - string
            - 'null'
        sms_notification:
          description: >-
            Default phone number for the SMS notifications of the probes; each
            probe has its own (`notification_sms`)
          type:
            - string
            - 'null'
      type: object
    ServerNetworkInterface:
      description: >-
        Network interface (VIF) of a virtual machine, on a public or a local
        network
      required:
        - network_interface_id
        - server_id
        - network_id
        - ip_address_id
        - vif_uuid
        - device_name
        - mac_address
        - is_default
        - is_active
        - network_type
        - network_label
        - network_bridge
        - ip_address
        - date_created
      properties:
        network_interface_id:
          type: integer
        server_id:
          description: >-
            Id of the server of the interface (`GET
            /api/v3/servers/{server_id}`)
          type: integer
        network_id:
          description: >-
            Id of the network of the interface: for a local network, the
            `network_id` accepted by `POST
            /api/v3/servers/{server_id}/network-interfaces`
          type:
            - integer
            - 'null'
        ip_address_id:
          description: >-
            Id of the IP address of the interface (`GET
            /api/v3/servers/{server_id}/ip-addresses/{ip_address_id}`); always
            null on a local network
          type:
            - integer
            - 'null'
        vif_uuid:
          description: UUID of the interface on the hypervisor
          type:
            - string
            - 'null'
        device_name:
          description: >-
            Device of the interface: usually its number (`0` for `eth0`),
            otherwise a name such as `ens3`
          type:
            - string
            - 'null'
        mac_address:
          description: MAC address of the interface
          type:
            - string
            - 'null'
        is_default:
          description: >-
            Whether it is the default interface of the server, which cannot be
            deleted
          type:
            - boolean
            - 'null'
        is_active:
          description: >-
            Whether the interface is active: the endpoints return only active
            interfaces
          type:
            - boolean
            - 'null'
        network_type:
          description: 'Type of the network: `P` for public, `L` for local'
          type:
            - string
            - 'null'
        network_label:
          description: Name of the network
          type:
            - string
            - 'null'
        network_bridge:
          description: >-
            Bridge of the network on the hypervisor, for example `xenbr0`;
            `N.D.` when the hypervisor does not report it
          type:
            - string
            - 'null'
        ip_address:
          description: IP address of the interface; null when `ip_address_id` is null
          type:
            - string
            - 'null'
        date_created:
          type:
            - string
            - 'null'
          format: date-time
      type: object
    ServerOs:
      description: >-
        Operating system that can be installed with a server template, with its
        minimum requirements
      required:
        - os_code
        - os_name
        - min_ram
        - min_cpu
        - min_disk
      properties:
        os_code:
          description: >-
            Code of the operating system, to send as `SERVER_TEMPLATE_CODE` in
            `data` when buying the service
          type: string
        os_name:
          description: Name of the operating system
          type: string
        min_ram:
          description: Min RAM (GB), for VPS/VM only
          type:
            - integer
            - 'null'
        min_cpu:
          description: Min vCPU, for VPS/VM only
          type:
            - integer
            - 'null'
        min_disk:
          description: Min disk (GB), for VPS/VM only
          type:
            - integer
            - 'null'
      type: object
    ServerSnapshot:
      description: Snapshot of a virtual server
      required:
        - snapshot_id
        - server_id
        - snapshot_name
        - snapshot_reference
        - active
        - date_expiry
        - date_created
      properties:
        snapshot_id:
          type: integer
        server_id:
          description: Id of the server (`GET /api/v3/servers/{server_id}`)
          type: integer
        snapshot_name:
          type:
            - string
            - 'null'
        snapshot_reference:
          description: >-
            Id of the snapshot on the virtualization platform; null until the
            snapshot is created
          type:
            - string
            - 'null'
        active:
          description: >-
            Whether the snapshot is active: false once it is deleted or expired.
            The list returns only active snapshots
          type: boolean
        date_expiry:
          description: >-
            Date after which the snapshot is deleted automatically; null if it
            does not expire
          type:
            - string
            - 'null'
          format: date-time
        date_created:
          type:
            - string
            - 'null'
          format: date-time
      type: object
    ServerTemplate:
      description: >-
        Server template that can be chosen when buying the service, with the
        operating systems compatible with it
      required:
        - template_code
        - template_name
        - template_name_alternative
        - min_ram
        - min_cpu
        - min_disk
        - operative_systems
      properties:
        template_code:
          description: >-
            Code of the server template, to send as `SERVER_CONFIGURATION_CODE`
            in `data` when buying the service
          type: string
        template_name:
          description: Short name of the server template
          type: string
        template_name_alternative:
          description: Longer name of the server template; null when it has none
          type:
            - string
            - 'null'
        min_ram:
          description: Min RAM (GB), for VPS/VM only
          type:
            - integer
            - 'null'
        min_cpu:
          description: Min vCPU, for VPS/VM only
          type:
            - integer
            - 'null'
        min_disk:
          description: Min disk (GB), for VPS/VM only
          type:
            - integer
            - 'null'
        operative_systems:
          description: Compatible operative systems
          type: array
          items:
            $ref: '#/components/schemas/ServerOs'
      type: object
    Server:
      description: >-
        Server of the account: dedicated server, cloud server, private cloud or
        virtual machine of a private cloud
      required:
        - server_id
        - purchase_id
        - hostname
        - server_type
        - active
        - consolidated
        - ip_address_id
        - ip_address
        - service_category_code
        - date_created
      properties:
        server_id:
          type: integer
        purchase_id:
          description: >-
            Id of the purchase of the server (`GET
            /api/v3/purchases/{purchase_id}`)
          type:
            - integer
            - 'null'
        hostname:
          type:
            - string
            - 'null'
        server_type:
          description: >-
            Type of the server: `PH` for a dedicated (physical) server, `VM` for
            a virtual machine, `HV` for a hypervisor or a private cloud
          type:
            - string
            - 'null'
        active:
          description: 'Whether the server is active: false once it has been deleted'
          type: boolean
        consolidated:
          description: Whether the server is ready, with its provisioning complete
          type: boolean
        ip_address_id:
          description: >-
            Id of the primary IP address of the server (`GET
            /api/v3/servers/{server_id}/ip-addresses/{ip_address_id}`)
          type:
            - integer
            - 'null'
        ip_address:
          description: Primary IP address of the server
          type:
            - string
            - 'null'
        service_category_code:
          description: >-
            Code of the service category of the server: `DEDICATED` (dedicated
            server), `CLOUD` (Cloud Server), `CLOUD_SERVER_IOPS` (Cloud VPS),
            `CLOUD_SERVER_HA` (Cloud Server HA), `PRIVATE_CLOUD` (private cloud)
            or `PRIVATE_CLOUD_VM` (virtual machine of a private cloud)
          type:
            - string
            - 'null'
        date_created:
          type:
            - string
            - 'null'
          format: date-time
      type: object
    ServiceCategory:
      required:
        - category_code
        - category_name
        - area_code
        - area_name
      properties:
        category_code:
          description: Code of the category, for example `PEC` or `CLOUD_STORAGE`
          type: string
        category_name:
          description: Name of the category, in Italian
          type: string
        area_code:
          description: >-
            Code of the area that groups the category, for example `HOSTING`,
            `DOMAIN` or `LICENSE`
          type:
            - string
            - 'null'
        area_name:
          description: Name of the area, in Italian
          type: string
      type: object
    ServiceChange:
      description: Service the purchase can change to, with the price of the change
      required:
        - service
        - activation_price
      properties:
        service:
          $ref: '#/components/schemas/Service'
        activation_price:
          $ref: '#/components/schemas/Amount'
          description: >-
            Price of the change to this service, computed on the time left
            before the renewal of the purchase
      type: object
    ServiceServer:
      description: >-
        Server service of the price list, with the templates and operating
        systems it can be bought with
      required:
        - service_id
        - service_category
        - service_name
        - recurrence
        - recurrences_available
        - tld_id
        - service_code
        - service_url
        - activation_price
        - renew_price
        - restore_price
        - transfer_price
        - is_primary
        - is_secondary
        - is_presale
        - is_aftersale
        - is_quantifiable
        - quantity_min
        - quantity_max
        - templates
      properties:
        service_id:
          type: integer
        service_category:
          $ref: '#/components/schemas/ServiceCategory'
        service_name:
          description: Name of the service, in Italian
          type: string
        recurrence:
          $ref: '#/components/schemas/Recurrence'
        recurrences_available:
          description: >-
            Recurrences that can be chosen when buying the service
            (`recurrence_id`)
          type: array
          items:
            $ref: '#/components/schemas/Recurrence'
        tld_id:
          description: >-
            Id of the TLD of a domain service (`GET /api/v3/tlds/{tld_id}`);
            null for the other services
          type:
            - integer
            - 'null'
        service_code:
          description: >-
            Code of the service, for example `DEDICATED_SERVER_ADVANCE` or
            `CLOUD_VPS_STD_IOPS`
          type: string
        service_url:
          description: URL of the cart page of the service
          type: string
        activation_price:
          $ref: '#/components/schemas/Amount'
          description: Activation price of the price list
        renew_price:
          description: Renew price of the price list; null when the service has none
          anyOf:
            - $ref: '#/components/schemas/Amount'
            - type: 'null'
        restore_price:
          description: Restore price of the price list; null when the service has none
          anyOf:
            - $ref: '#/components/schemas/Amount'
            - type: 'null'
        transfer_price:
          description: Transfer price of the price list; null when the service has none
          anyOf:
            - $ref: '#/components/schemas/Amount'
            - type: 'null'
        is_primary:
          description: Whether the service can be sold as a primary service
          type:
            - boolean
            - 'null'
        is_secondary:
          description: Whether the service is an additional service of a primary one
          type:
            - boolean
            - 'null'
        is_presale:
          description: >-
            Whether the service can be bought as an additional service together
            with its primary service (presale)
          type:
            - boolean
            - 'null'
        is_aftersale:
          description: >-
            Whether the service can be bought as an additional service after the
            activation of its primary service (aftersale)
          type:
            - boolean
            - 'null'
        is_quantifiable:
          description: >-
            Whether the service can be added to the cart more than once; the
            quantity of one purchase is set by `quantity_min` and `quantity_max`
          type:
            - boolean
            - 'null'
        quantity_min:
          description: Minimum quantity of the service in one purchase
          type:
            - integer
            - 'null'
        quantity_max:
          description: >-
            Maximum quantity of the service in one purchase; null when the
            quantity cannot be chosen
          type:
            - integer
            - 'null'
        templates:
          description: >-
            Server templates compatible with the service, with their operating
            systems: `template_code` and `os_code` are the values of
            `SERVER_CONFIGURATION_CODE` and `SERVER_TEMPLATE_CODE` when buying
            it
          type: array
          items:
            $ref: '#/components/schemas/ServerTemplate'
      type: object
    Service:

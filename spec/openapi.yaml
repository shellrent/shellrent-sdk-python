    post:
      tags:
        - Storage
      summary: Create object storage bucket firewall entry
      description: >-
        Starts adding an IP address or a subnet (CIDR) to the firewall of the
        bucket, returned as a Task: the entry appears among the firewall entries
        when the operation is completed. Firewall operations on the buckets of
        an object storage run one at a time: while one is running, the request
        is rejected with 409.
      operationId: createObjectStorageBucketFirewallEntry
      parameters:
        - $ref: '#/components/parameters/ObjectStorageId'
        - $ref: '#/components/parameters/BucketId'

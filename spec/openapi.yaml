          minItems: 1
      type: object
      additionalProperties: false
    PrivateCloudVmCreateRequest:
      description: >-
        Virtual machine to create on the private cloud: `template_vm_id` to copy
        a template VM, otherwise both `server_configuration_id` and
        `template_id`; and either `ip_address_id` or `use_local_ip` true, not
        both
      required:
        - cpu
        - ram
        - disk
      properties:
        cpu:
          description: >-
            Number of CPU cores (vCPUs) of the virtual machine: between
            `min_vm_cpu` and `max_vm_cpu` of `GET
            /api/v3/servers/{server_id}/private-cloud`, and within the vCPUs
            still free on the private cloud
          type: integer
          minimum: 1
        ram:
          description: >-
            RAM of the virtual machine, in MB: between `min_vm_ram` and
            `max_vm_ram` of `GET /api/v3/servers/{server_id}/private-cloud`, and
            within the RAM still free on the private cloud
          type: integer
          minimum: 1
        disk:
          description: >-
            Disk space of the virtual machine, in GB: between `min_vm_disk` and
            `max_vm_disk` of `GET /api/v3/servers/{server_id}/private-cloud`,
            within the disk and backup space still free on the private cloud
            and, with `template_vm_id`, not lower than the disk of the template
            VM
          type: integer
          minimum: 1
        server_configuration_id:
          description: Server configuration ID
          type: integer
          minimum: 1
        template_id:
          description: Server template ID (OS)
          type: integer
          minimum: 1
        template_vm_id:
          description: Template VM ID (optional alternative to configuration/template)
          type: integer
          minimum: 1
        ip_address_id:
          description: Primary IP address ID
          type: integer
          minimum: 1
        use_local_ip:
          description: Use local IP instead of public IP
          type: boolean
          default: false
        ssh_key_id:
          description: SSH key ID to associate with the VM
          type: integer
          minimum: 1
        note:
          description: Optional note
          type: string
      type: object
      additionalProperties: false
    PrivateCloudVmUpdateRequest:
      properties:
        cpu:
          description: >-
            Number of CPU cores. Omit it to keep the current value; the allowed
            range depends on the resources available on the private cloud
          type: integer
          minimum: 1
        ram:
          description: >-
            RAM of the virtual machine, in megabytes. Omit it to keep the
            current value; the allowed range depends on the resources available
            on the private cloud
          type: integer
          minimum: 1
        disk:
          description: >-
            Disk space of the virtual machine, in gigabytes: it cannot be lower
            than the current one. Omit it to keep the current value
          type: integer
          minimum: 1
        note:
          description: >-
            Note of the virtual machine. Omit it to keep the current note; send
            an empty string or null to remove it
          type:
            - string
            - 'null'
      type: object
      additionalProperties: false
    PurchaseBillingInfoChangeRequest:

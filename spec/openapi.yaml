          in: query
          description: >-
            Only the SMS created at or after this time (ISO 8601 UTC:
            YYYY-MM-DDTHH:MM:SSZ)
          required: false
          schema:
            type: string
            format: date-time
        - name: date_created_to
          in: query
          description: >-
            Only the SMS created at or before this time (ISO 8601 UTC:
            YYYY-MM-DDTHH:MM:SSZ)
          required: false
          schema:

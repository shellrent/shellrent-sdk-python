            schema:
              $ref: >-
                #/components/schemas/ObjectStorageBucketFirewallEntryCreateRequest
      responses:
        '202':
          description: >-
            Accepted: the operation goes on in the background, as the returned
            Task
          headers:
            Location:
              description: >-
                URL of the Task: `/api/v3/tasks/{task_id}`. Reading it requires
                the `purchases:read` scope
              required: true
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TaskResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/ServerError'
      security:
        - oauth2:
            - objectstorage:write

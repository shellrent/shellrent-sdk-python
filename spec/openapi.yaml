      required:
        - sms_id
        - can_cancel
      properties:
        sms_id:
          description: Id of the SMS (`GET /api/v3/sms/{sms_id}`)
          type: integer
        can_cancel:
          description: 'Whether the sending can be cancelled: only while it is `PROCESSING`'
          type: boolean
      type: object
    SmsCanDelete:
      description: Whether an SMS can be deleted (`DELETE /api/v3/sms/{sms_id}`)
      required:
        - sms_id
        - can_delete
      properties:
        sms_id:
          description: Id of the SMS (`GET /api/v3/sms/{sms_id}`)
          type: integer
        can_delete:
          description: 'Whether the SMS can be deleted: only a `DRAFT`'
          type: boolean
      type: object
    SmsMessage:
      description: Message of an SMS sending to one recipient, with its delivery data
      required:
        - id
        - sms_id
        - sms_price
        - contact_name
        - phone_number
        - date_sent
        - date_delivered
        - error
      properties:
        id:
          type: integer
        sms_id:
          description: Id of the SMS sending (`GET /api/v3/sms/{sms_id}`)
          type: integer
        sms_price:
          description: Price list of the destination country; null for sub-accounts
          anyOf:
            - $ref: '#/components/schemas/SmsPrice'
            - type: 'null'
        contact_name:
          description: >-
            Surname and name of the recipient, when taken from a phonebook;

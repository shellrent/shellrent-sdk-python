      required:
        - rule_id
        - hosting_id
        - rule_number
        - description
        - included
      properties:
        rule_id:
          type: integer
        hosting_id:
          description: Id of the hosting (`GET /api/v3/hostings/{hosting_id}`)
          type: integer
        rule_number:
          description: Number of the rule in ModSecurity
          type: string
        description:
          description: >-
            Message of the rule found by the scan, or the description given when
            it was added
          type:
            - string
            - 'null'
        included:

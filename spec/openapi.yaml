            (available to Resellers only)
          type: integer
      type: object
    BuyServiceCloudVpsRequest:
      required:
        - service_id
        - data
      type: object
      allOf:
        - $ref: '#/components/schemas/BuyServiceDedicatedServerRequest'
        - properties:
            service_id:
              description: ID of the Service to buy
              type: integer
            recurrence_id:
              description: ID of the Recurrence to assign to the purchased service
              type: integer

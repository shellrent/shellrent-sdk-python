        date_sent:
          description: Date and time the message was sent; null until it is sent
          type:
            - string
            - 'null'
          format: date-time
        date_delivered:
          description: >-
            Date and time the message was delivered; null until the delivery is
            confirmed
          type:
            - string
            - 'null'
          format: date-time
        error:

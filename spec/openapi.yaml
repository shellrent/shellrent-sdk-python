  /api/v3/hostings/{hosting_id}/modsecurity/rules:
    get:
      tags:
        - Hosting
      summary: List ModSecurity rules
      description: >-
        Lists the ModSecurity rules of the hosting, found by the scans or added
        by hand. A rule with `included` true is disabled on the hosting:
        ModSecurity does not apply it
      operationId: listHostingModSecurityRules
      parameters:
        - $ref: '#/components/parameters/HostingId'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HostingModSecurityRuleListResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/ServerError'
      security:
        - oauth2:
            - hosting:read
    put:
      tags:
        - Hosting
      summary: Enable ModSecurity rules
      description: >-
        Disables on the hosting the ModSecurity rules with the given ids
        (`rule_id`), so that ModSecurity no longer applies them, and returns
        them with `included` true
      operationId: enableHostingModSecurityRules
      parameters:
        - $ref: '#/components/parameters/HostingId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/HostingModSecurityRuleBulkRequest'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HostingModSecurityRuleListResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/ServerError'
      security:
        - oauth2:
            - hosting:write
    post:
      tags:
        - Hosting
      summary: Create ModSecurity rule
      description: >-
        Disables the ModSecurity rule `rule_number` on the hosting, so that
        ModSecurity no longer applies it, and returns the rule with `included`
        true. Responds 200 instead of 201 when the hosting already had the rule,
        found by a scan or added before
      operationId: createHostingModSecurityRule
      parameters:
        - $ref: '#/components/parameters/HostingId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/HostingModSecurityRuleCreateRequest'
      responses:
        '200':
          description: The rule was already in the firewall of the hosting
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HostingModSecurityRuleResponse'
        '201':
          description: Created
          headers:
            Location:
              description: URL of the created resource
              required: true
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HostingModSecurityRuleResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/ServerError'
      security:
        - oauth2:
            - hosting:write
    delete:
      tags:
        - Hosting
      summary: Delete all ModSecurity rules
      description: >-
        Enables again all the ModSecurity rules disabled on the hosting:
        ModSecurity applies them again and their `included` becomes false. The
        rules stay in the list
      operationId: deleteAllHostingModSecurityRules
      parameters:
        - $ref: '#/components/parameters/HostingId'
      responses:
        '204':
          description: No Content
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/ServerError'
      security:

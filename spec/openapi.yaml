            objectstorage:read: Object Storage read
            objectstorage:write: Object Storage write
            objectstorage:secrets: >-
              Object Storage secrets: S3 secret keys (together with
              objectstorage:read)
            payment:read: Payment read
            payment:write: Payment write
            pec:read: Pec read
            pec:write: Pec write
            purchases:read: Purchases read
            purchases:write: Purchases write
            server:read: Server read
            server:write: Server write
            server:secrets: >-
              Server secrets: credentials of the servers (together with
              server:read)
            servermonitoring:read: Server Monitoring read
            servermonitoring:write: Server Monitoring write
            shop:read: Shop read
            shop:write: Shop write
            sms:read: Sms read
            sms:write: Sms write
            ssl:read: Ssl read
            ssl:write: Ssl write
            ssl:secrets: >-
              Ssl secrets: private keys of the certificates and exports that
              include them (together with ssl:read)
            weblicense:read: Web License read
            webmonitoring:read: Web Monitoring read
            webmonitoring:write: Web Monitoring write
            upload:write: Upload of files used by other calls (e.g. PEC documents)

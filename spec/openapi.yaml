openapi: 3.1.0
info:
  title: API Shellrent
  description: >-
    API REST per gestire in modo automatico i servizi del proprio account
    Shellrent: domini, hosting, server, storage, certificati SSL, acquisti e
    fatturazione. L'accesso avviene tramite OAuth2 (client credentials) con
    scope specifici per area.
  version: 3.0.0
servers:
  - url: https://api.shellrent.com
    description: Server
security:
  - oauth2: []
tags:
  - name: OAuth
    description: Autenticazione e JWKS
  - name: Health
    description: Stato del servizio
  - name: Account
    description: Account
  - name: Billing
    description: Billing
  - name: Payment
    description: Payment
  - name: Purchases
    description: Purchases
  - name: Shop
    description: Shop
  - name: Domains
    description: Domains
  - name: Hosting
    description: Web Hosting
  - name: Server
    description: Server
  - name: Monitoring
    description: Monitoring
  - name: Ssl
    description: SSL Certificates
  - name: License
    description: License
  - name: Pec
    description: PEC
  - name: Storage
    description: Storage
  - name: Sms
    description: SMS
paths:
  /api/health:
    get:
      tags:
        - Health
      summary: Verifica lo stato del servizio
      description: Restituisce lo stato corrente dell'API.
      operationId: getHealth
      responses:
        '200':
          description: Servizio attivo
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthStatusResponse'
        '401':
          description: Not authorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '500':
          description: Errore inatteso
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
      security:
        - oauth2: []
  /api/v3/account:
    get:
      tags:
        - Account
      summary: My user account
      description: Get all details of my user account
      operationId: getAccount
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccountResponse'
        '400':
          description: Bad request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '401':
          description: Not authorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '404':
          description: Not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '429':
          $ref: '#/components/responses/TooManyRequests'
      security:
        - oauth2:
            - account:read
  /api/v3/creditnotes:
    get:
      tags:
        - Billing
      summary: List all Credit notes
      description: Get a list of all Credit notes
      operationId: listCreditNotes
      parameters:
        - name: date_emission_from
          in: query
          required: false
          schema:
            type: string
            format: date
        - name: date_emission_to
          in: query
          required: false
          schema:
            type: string
            format: date
        - name: page
          in: query
          required: false
          schema:
            type: integer
            default: 1
        - name: per_page
          in: query
          required: false
          schema:
            type: integer
            default: 20
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreditnotePaginatedListResponse'
        '400':
          description: Bad request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '401':
          description: Not authorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '404':
          description: Not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '429':
          $ref: '#/components/responses/TooManyRequests'
      security:
        - oauth2:
            - billing:read
  /api/v3/creditnotes/{creditnote_id}:
    get:
      tags:
        - Billing
      summary: Get a Credit note
      description: Get details of a credit note
      operationId: getCreditNote
      parameters:
        - name: creditnote_id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreditnoteResponse'
        '400':
          description: Bad request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '401':
          description: Not authorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '404':
          description: Not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '429':
          $ref: '#/components/responses/TooManyRequests'
      security:
        - oauth2:
            - billing:read
  /api/v3/creditnotes/{creditnote_id}/rows:
    get:
      tags:
        - Billing
      summary: List all credit note rows
      description: Get the list of all the rows of a Credit Note
      operationId: listCreditNoteRows
      parameters:
        - name: creditnote_id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreditnoteRowListResponse'
        '400':
          description: Bad request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '401':
          description: Not authorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '404':
          description: Not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '429':
          $ref: '#/components/responses/TooManyRequests'
      security:
        - oauth2:
            - billing:read
  /api/v3/creditnotes/{creditnote_id}/rows/{row_id}:
    get:
      tags:
        - Billing
      summary: Get a credit note row
      description: Get details of a Credit note row
      operationId: getCreditNoteRow
      parameters:
        - name: creditnote_id
          in: path
          required: true
          schema:
            type: integer
        - name: row_id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreditnoteRowResponse'
        '400':
          description: Bad request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '401':
          description: Not authorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '404':
          description: Not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '429':
          $ref: '#/components/responses/TooManyRequests'
      security:
        - oauth2:
            - billing:read
  /api/v3/creditnotes/{creditnote_id}/download:
    get:
      tags:
        - Billing
      summary: Download credit note XML
      description: Download the XML file of a Credit note
      operationId: downloadCreditNoteXml
      parameters:
        - name: creditnote_id
          in: path
          required: true
          schema:
            type: integer
        - name: prefer_xml
          in: query
          description: >-
            If the credit note is signed, the original p7m file is returned; to
            force the download of the XML version, set this parameter to true
          required: false
          schema:
            type: boolean
      responses:
        '200':
          description: OK (file download)
          headers:
            Content-Length:
              description: File size in bytes.
              schema:
                type: integer
                format: int64
            Content-Disposition:
              description: Filename and content disposition (attachment).
              schema:
                type: string
            Last-Modified:
              description: File last modified datetime.
              schema:
                type: string
            Cache-Control:
              description: Cache directive.
              schema:
                type: string
            X-Content-Type-Options:
              description: Mime sniffing protection.
              schema:
                type: string
          content:
            text/xml:
              schema:
                type: string
                format: binary
            application/x-pkcs7-mime:
              schema:
                type: string
                format: binary
        '400':
          description: Bad request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '401':
          description: Not authorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '404':
          description: Not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '429':
          $ref: '#/components/responses/TooManyRequests'
      security:
        - oauth2:
            - billing:read
  /api/v3/creditnotes/{creditnote_id}/download/pdf:
    get:
      tags:
        - Billing
      summary: Download credit note PDF
      description: Download the courtesy PDF file of a Credit note
      operationId: downloadCreditNotePdf
      parameters:
        - name: creditnote_id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: OK (file download)
          headers:
            Content-Length:
              description: Dimensione del file in byte.
              schema:
                type: integer
                format: int64
            Content-Disposition:
              description: Filename and content disposition (attachment).
              schema:
                type: string
            Last-Modified:
              description: File last modified datetime.
              schema:
                type: string
            Cache-Control:
              description: Cache directive.
              schema:
                type: string
            X-Content-Type-Options:
              description: Mime sniffing protection.
              schema:
                type: string
          content:
            application/pdf:
              schema:
                type: string
                format: binary
        '400':
          description: Bad request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '401':
          description: Not authorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '404':
          description: Not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '429':
          $ref: '#/components/responses/TooManyRequests'
      security:
        - oauth2:
            - billing:read
  /api/v3/domains:
    get:
      tags:
        - Domains
      summary: List domains
      description: Get a list of all Domains
      operationId: listDomains
      parameters:
        - name: domain_full_name
          in: query
          description: Search by punycode domain name (exact match)
          required: false
          schema:
            type: string
        - name: domain_name
          in: query
          description: Search by punycode domain name (partial)
          required: false
          schema:
            type: string
        - name: tld_id
          in: query
          description: Obtain all domains by ID of TLD
          required: false
          schema:
            type: integer
        - name: tld_extension
          in: query
          description: Obtain all domains by TLD extension (punycode)
          required: false
          schema:
            type: string
        - name: page
          in: query
          required: false
          schema:
            type: integer
            default: 1
        - name: per_page
          in: query
          required: false
          schema:
            type: integer
            default: 20
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DomainPaginatedListResponse'
        '400':
          description: Bad request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '401':
          description: Not authorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '404':
          description: Not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '429':
          $ref: '#/components/responses/TooManyRequests'
      security:
        - oauth2:
            - domains:read
  /api/v3/domains/{domain_id}:
    get:
      tags:
        - Domains
      summary: Get domain
      description: Get a domain
      operationId: getDomain
      parameters:
        - name: domain_id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DomainResponse'
        '400':
          description: Bad request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '401':
          description: Not authorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '404':
          description: Not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '429':
          $ref: '#/components/responses/TooManyRequests'
      security:
        - oauth2:
            - domains:read
  /api/v3/domains/availability:
    get:
      tags:
        - Domains
      summary: Domain whois
      description: Search availability status for a domain (whois)
      operationId: checkDomainAvailability
      parameters:
        - name: domain_full_name
          in: query
          description: Punycode full domain name (with TLD extension)
          required: false
          schema:
            type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DomainAvailabilityResponse'
        '400':
          description: Bad request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '401':
          description: Not authorized
          content:
            application/json:
              schema:

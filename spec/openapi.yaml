      type: object
      additionalProperties: false
    ServerAutomaticSnapshotRequest:
      description: Schedule of the automatic snapshots of a server
      required:
        - name
        - day_of_week
        - hour_of_day
      properties:
        name:
          description: >-
            Name of the snapshots: only letters, numbers, spaces, underscores
            and dashes
          type: string
        day_of_week:
          description: Days of week (1-7, where 1 is Monday)
          type: array
          items:
            type: integer
            maximum: 7
            minimum: 1
        hour_of_day:
          description: >-
            Time of the snapshot, in 24-hour HH:MM format. Times after 01:00 and
            before 04:59 are not allowed
          type: string
          pattern: ^([01][0-9]|2[0-3]):[0-5][0-9]$
          example: '23:30'
      type: object
      additionalProperties: false
    ServerBackupExhibitRequest:
      description: Backup of the server to expose
      required:
        - backup_id
      properties:
        backup_id:
          description: ID of the server backup to expose
          type: integer
          minimum: 1
      type: object
      additionalProperties: false
    ServerIpAddressReverseUpdateRequest:
      required:
        - reverse_dns
      properties:
        reverse_dns:
          description: >-
            Hostname to set as reverse DNS of the IP address; null or an empty
            string removes it, like `DELETE
            /api/v3/servers/{server_id}/ip-addresses/{ip_address_id}/rdns`
          type:
            - string
            - 'null'
      type: object
      additionalProperties: false
    ServerMonitoringProbeCreateRequest:
      required:
        - server_monitoring_item_template_id
      properties:
        server_monitoring_item_template_id:
          description: Probe template identifier.
          type: integer
        parameters:
          description: Template probe parameters as key-value map.
          type: object
          additionalProperties: true
        notification_email:
          description: Notification email for this probe.
          type: string
          format: email
        notification_sms:
          description: Notification phone number for this probe.
          type: string
      type: object
      additionalProperties: false
    ServerMonitoringProbeUpdateRequest:
      properties:
        notification_email:
          description: >-
            Notification email for this probe. Use empty string to remove the
            current email.
          type: string
          example: alerts@example.com
        notification_sms:
          description: >-
            Notification phone number for this probe. Use empty string to remove
            the current SMS.
          type: string
          example: '3331234567'
      type: object
      additionalProperties: false
    ServerNetworkInterfaceCreateRequest:
      properties:
        network_id:
          description: >-
            For a local network interface: ID of an active local network of the
            cluster where the server resides (for a private cloud VM, a local
            network of the private cloud). Send either network_id or
            ip_address_id
          type: integer
          minimum: 1
        ip_address_id:
          description: >-
            For a public network interface: ID of an IP address without an
            active network interface. For a private cloud VM it is a free and
            available IP address of the private cloud, which is assigned to the
            VM; for the other servers an available IP address of the server.
            Send either network_id or ip_address_id
          type: integer
          minimum: 1
      type: object
      additionalProperties: false
    ServerPowerActionRequest:
      required:
        - action
      properties:
        action:
          description: >-
            Power action: physical servers only have `reboot`. Whether it is
            possible can be checked first with the matching check of the server,
            for example `GET /api/v3/servers/{server_id}/can-hard-reboot`
          type: string
          enum:
            - start
            - stop
            - reboot
            - hard_reboot
            - hard_stop
      type: object
      additionalProperties: false
    ServerReinstallRequest:
      properties:
        safety_backup_enabled:
          description: Whether to perform a safety backup before reinstall
          type: boolean
          default: true
      type: object
      additionalProperties: false
    SmsCreateRequest:
      description: >-
        Sends an SMS. Recipients: provide exactly one of phone_numbers or
        phonebooks, not both. Sender: required when quality is PREMIUM (from 2
        to 11 characters), ignored when quality is STANDARD.
      required:
        - message
        - quality
      properties:
        phone_numbers:
          description: >-
            SMS recipients (mutually exclusive). Provide exactly one of:
            "phone_numbers" or "phonebooks". Collection of one or more phone
            numbers in international format using the "00" prefix (digits only,
            no spaces/separators). Example: 00393331122444.
          type: array
          items:
            type: string
            example: '00393331122444'
          minItems: 1
        phonebooks:
          description: >-
            SMS recipients (mutually exclusive). Provide exactly one of:
            "phone_numbers" or "phonebooks". Collection of one or more phonebook
            IDs.
          type: array
          items:
            type: integer
          minItems: 1
        message:
          description: >-
            Text of the SMS you want to send. It can contain emojis, but keep in
            mind that emojis take up more characters. GSM-7: max 160 chars (153
            per part if concatenated). Unicode (UCS-2): max 70 chars (67 per
            part if concatenated).
          type: string
        quality:
          description: SMS delivery quality. PREMIUM requires sender.
          type: string
          enum:
            - STANDARD
            - PREMIUM
        sender:
          description: >-
            Sender name, from 2 to 11 characters. Required when quality is
            PREMIUM, ignored when quality is STANDARD.
          type: string
        send_date:
          description: >-
            Date and time from which to send the SMS. If not specified, the SMS
            is sent immediately (ISO 8601 UTC: YYYY-MM-DDTHH:MM:SSZ)
          type: string
          format: date-time
      type: object
      additionalProperties: false
    SmsPhonebookAddContactsRequest:
      required:
        - phone_numbers
      properties:
        phone_numbers:
          description: >-
            Collection of one or more phone numbers to create contacts in the
            Phonebook
          type: array
          items:
            required:
              - phone_number
            properties:
              phone_number:
                description: >-
                  Phone number format: international format using the "00"
                  prefix (digits only, no spaces/separators). Example:
                  00393331122444.
                type: string
              name:
                type: string
              surname:
                type: string
              birth_date:
                type: string
                format: date
            type: object
      type: object
      additionalProperties: false
    SmsPhonebookCreateRequest:
      required:
        - name
      properties:
        phone_numbers:
          description: >-
            Collection of one or more phone numbers to create contacts in the
            Phonebook
          type: array
          items:
            required:
              - phone_number
            properties:
              phone_number:
                description: >-
                  Phone number format: international format using the "00"
                  prefix (digits only, no spaces/separators). Example:
                  00393331122444.
                type: string
              name:
                type: string
              surname:
                type: string
              birth_date:
                type: string
                format: date
            type: object
        name:
          description: Name of the Phonebook.
          type: string
      type: object
      additionalProperties: false
    SmsPhonebookEditRequest:
      required:
        - name
      properties:
        name:
          description: Name of the Phonebook.
          type: string
      type: object
      additionalProperties: false
    SslCertificateChangeCsrRequest:
      required:
        - csr
      properties:
        csr:
          description: >-
            Custom CSR in PEM format, verified with the certificate supplier;
            sending the current CSR changes nothing
          type: string
      type: object
      additionalProperties: false
    SslCertificateExportRequest:
      required:
        - format
      properties:
        format:
          description: >-
            Export format: one of the codes of `GET
            /api/v3/ssl-certificates/{ssl_certificate_id}/export-formats`, which
            lists the formats available for the certificate
          type: string
          enum:
            - PK
            - CERT
            - CERT_PEM
            - CA
            - CA_PEM
            - CERT_CA
            - CERT_CA_PEM
            - PK_CERT_CA
            - MULTI_ZIP
            - HASH_SHA256
            - HASH_SHA512
        current_passphrase:
          description: Passphrase of the current private key, if it is protected by one
          type: string
        passphrase:
          description: >-
            Passphrase that protects the exported file, for the formats that
            require it (see requires_passphrase in the export formats). If
            omitted, current_passphrase is used
          type: string
      type: object
      additionalProperties: false
    SslCertificateOwnerRequest:
      properties:
        admin_title:
          description: >-
            Title of the administrative contact, one of the values of the order:
            `Mrs`, `Mr`, `Miss`, `Ms`, `Dr` or `Rev`
          type: string
        admin_role:
          description: >-
            Role of the administrative contact, one of the values of the order:
            `Business Owner`, `Website Owner`, `President` or `Company Director`
          type: string
        admin_first_name:
          description: First name of the administrative contact
          type: string
        admin_last_name:
          description: Last name of the administrative contact
          type: string
        admin_email:
          description: Email of the administrative contact
          type: string
          format: email
        admin_organization:
          description: Organization of the administrative contact
          type: string
        admin_phone_cc:
          description: >-
            International dialling code of the phone of the administrative
            contact, without `+` (for example `39`)
          type: string
        admin_phone_number:
          description: >-
            Phone number of the administrative contact, without the dialling
            code
          type: string
        admin_address:
          description: Address of the administrative contact
          type: string
        admin_city:
          description: City of the administrative contact
          type: string
        admin_state:
          description: State or province of the administrative contact
          type: string
        admin_postal_code:
          description: Postal code of the administrative contact
          type: string
        admin_country:
          description: >-
            Country of the administrative contact, as ISO 3166-1 alpha-2 code
            (for example `IT`)
          type: string
      type: object
      additionalProperties: false
    SslCertificateReemitRequest:
      properties:
        private_key:
          description: >-
            Custom private key in PEM format, without passphrase. Omit it, or
            send an empty string or the current key, to keep the current one
          type: string
        csr_key:
          description: >-
            Custom CSR in PEM format, verified with the certificate supplier.
            Omit it, or send an empty string or the current CSR, to keep the
            current one
          type: string
      type: object
      additionalProperties: false
    SubAccountCreateRequest:
      required:
        - person_password
        - administrative_person_name
        - administrative_person_surname
        - administrative_address
        - administrative_city
        - administrative_state
        - administrative_country
        - administrative_postal_code
        - administrative_phone
        - administrative_email
      properties:
        person_password:
          description: >-
            Password of the account: at least 13 characters, with at least one
            uppercase letter, one lowercase letter, one number and one symbol
          type: string
        administrative_person_name:
          description: First name of the administrative contact of the account
          type: string
        administrative_person_surname:
          description: Surname of the administrative contact
          type: string
        administrative_address:
          description: Address of the administrative contact
          type: string
        administrative_city:
          description: City of the administrative contact
          type: string
        administrative_state:
          description: >-
            Acronym of the Italian province, ie. "VI" for Vicenza, or "EE" for
            an address outside Italy
          type: string
        administrative_country:
          description: >-
            Country ISO code with 2 letters, ie. "IT" for Italy, "ES" for Spain,
            etc.
          type: string
        administrative_postal_code:
          description: Postal code of the administrative contact
          type: string
        administrative_phone_prefix:
          description: >-
            International phone code (prefix) for "Phone", ie. "39" for Italy,
            "44" for United Kingdom
          type: string
        administrative_phone:
          description: Phone number without international phone code
          type: string
        administrative_mobile_prefix:
          description: >-
            International phone code (prefix) for "Mobile", ie. "39" for Italy,
            "44" for United Kingdom
          type: string
        administrative_mobile:
          description: Mobile phone number without international phone code
          type: string
        administrative_email:
          description: Email address of the administrative contact
          type: string
          format: email
      type: object
      additionalProperties: false
    SubAccountUpdateRequest:
      properties:
        person_password:
          description: >-
            New password of the account: at least 13 characters, with at least
            one uppercase letter, one lowercase letter, one number and one
            symbol
          type: string
        username_alias:
          description: >-
            Alternative username of the account, also valid to log in; null or
            empty to remove it
          type:
            - string
            - 'null'
        administrative_person_name:
          description: First name of the administrative contact of the account
          type: string
        administrative_person_surname:
          description: Surname of the administrative contact
          type: string
        administrative_address:
          description: Address of the administrative contact
          type: string
        administrative_city:
          description: City of the administrative contact
          type: string
        administrative_state:
          description: >-
            Acronym of the Italian province, ie. "VI" for Vicenza, or "EE" for
            an address outside Italy
          type: string
        administrative_country:
          description: >-
            Country ISO code with 2 letters, ie. "IT" for Italy, "ES" for Spain,
            etc.
          type: string
        administrative_postal_code:
          description: Postal code of the administrative contact
          type: string
        administrative_phone_prefix:
          description: >-
            International phone code (prefix) for "Phone", ie. "39" for Italy,
            "44" for United Kingdom; empty for Italy. Required with
            `administrative_phone`
          type: string
        administrative_phone:
          description: >-
            Phone number without international phone code, digits only. Required
            with `administrative_phone_prefix`
          type: string
        administrative_mobile_prefix:
          description: >-
            International phone code (prefix) for "Mobile", ie. "39" for Italy,
            "44" for United Kingdom; empty for Italy. Required with
            `administrative_mobile`
          type: string
        administrative_mobile:
          description: >-
            Mobile phone number without international phone code, digits only.
            Required with `administrative_mobile_prefix`
          type: string
        administrative_email:
          description: Email address of the administrative contact
          type: string
          format: email
      type: object
      additionalProperties: false
    WebMonitoringNoticesUpdateRequest:
      properties:
        notification_email:
          description: Notification email. Use empty string to clear.
          type: string
          example: alerts@example.com
        notification_sms:
          description: Notification phone number. Use empty string to clear.
          type: string
          example: '3331234567'
        send_ssl_notify:
          description: Enable or disable SSL expiry notices.
          type: boolean
      type: object
      additionalProperties: false
    AccountBilling:
      description: >-
        Billing profile: the holder the documents are made out to, with its tax
        and electronic invoicing data
      required:
        - account_billing_id
        - legal_entity
        - tax_regime
        - organization
        - name
        - surname
        - address
        - city
        - state
        - postal_code
        - country
        - gender
        - birth_date
        - birth_place
        - phone
        - vat_number
        - is_vat_group
        - fiscal_code
        - edocument_pec
        - edocument_code
        - exporter_expiry
        - exporter_number
        - exporter_date
        - is_split_payment
      properties:
        account_billing_id:
          type: integer
        legal_entity:
          $ref: '#/components/schemas/LegalEntity'
        tax_regime:
          $ref: '#/components/schemas/TaxRegime'
          description: Tax regime of the profile, which sets the VAT of its documents
        organization:
          type:
            - string
            - 'null'
        name:
          type:
            - string
            - 'null'
        surname:
          type:
            - string
            - 'null'
        address:
          type: string
        city:
          type: string
        state:
          description: >-
            Province: the acronym of the Italian province, for example `VI`, or
            `EE` outside Italy
          type: string
        postal_code:
          type: string
        country:
          $ref: '#/components/schemas/Country'
        gender:
          description: 'Gender of the holder: `M` or `F`; null when not given'
          type:
            - string
            - 'null'
        birth_date:
          description: Date of birth of the holder; null when not given
          type:
            - string
            - 'null'
          format: date
        birth_place:
          description: Place of birth of the holder; null when not given
          type:
            - string
            - 'null'
        phone:
          description: >-
            Phone, usually in the form `0039.0123456789`: `00` and the
            international prefix, a dot, the number; null when not given
          type:
            - string
            - 'null'
        vat_number:
          description: >-
            VAT number of the holder (`partita IVA` in Italy); null when it has
            none
          type:
            - string
            - 'null'
        is_vat_group:
          description: >-
            Whether the holder belongs to an Italian VAT group (`Gruppo IVA`),
            whose members share the VAT number and have each their own tax code
          type: boolean
        fiscal_code:
          description: Tax code of the holder (`codice fiscale` in Italy)
          type: string
        edocument_pec:
          description: >-
            PEC address (certified email, `Posta Elettronica Certificata`) to
            which SDI, the Italian e-invoicing exchange system, delivers the
            electronic invoices when there is no recipient code; null when not
            given
          type:
            - string
            - 'null'
        edocument_code:
          description: >-
            Recipient code (`Codice Destinatario`) with which SDI, the Italian
            e-invoicing exchange system, delivers the electronic invoices: 7
            characters, 6 for the public administration; null when not given
          type:
            - string
            - 'null'
        exporter_expiry:
          description: >-
            Expiry date of the declaration of intent (`dichiarazione d'intento`)
            of a habitual exporter, whose invoices are without VAT; null when
            not given
          type:
            - string
            - 'null'
          format: date
        exporter_number:
          description: >-
            Protocol number of the declaration of intent of a habitual exporter,
            written on the electronic invoices; null when not given
          type:
            - string
            - 'null'
        exporter_date:
          description: >-
            Date of the electronic receipt of the declaration of intent, issued
            by the Italian Revenue Agency (`Agenzia delle Entrate`); null when
            not given
          type:
            - string
            - 'null'
          format: date
        is_split_payment:
          description: >-
            Whether split payment (`scissione dei pagamenti`) applies: the tax
            regime is `SPLIT_PAYMENT`, and the customer pays the VAT of the
            invoices directly to the Italian State
          type: boolean
      type: object
    Account:
      description: >-
        User account, with the data of its administrative contact: without one,

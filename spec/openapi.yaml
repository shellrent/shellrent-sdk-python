            - string
            - 'null'
        cloud_storage_id:
          description: >-
            Id of the cloud storage (`GET
            /api/v3/cloud-storages/{cloud_storage_id}`)
          type: integer
        hostname:
          description: IPv4 address allowed to mount the storage via NFS
          type:
            - string
            - 'null'
        username:
          description: >-
            Username of the cloud storage user whose storage the address can

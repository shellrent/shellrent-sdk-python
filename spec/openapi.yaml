      security:
        - oauth2:
            - domains:read
    patch:
      tags:
        - Domains
      summary: Change DNS Zone data
      description: Change DNS Zone data
      operationId: updateDomainDnsZone
      parameters:
        - name: domain_id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DomainDnsZoneRequest'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DnsZoneResponse'
        '400':
          description: Bad request
          content:

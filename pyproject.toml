[build-system]
requires = ["hatchling>=1.27", "hatch-vcs>=0.4"]
build-backend = "hatchling.build"

[project]
name = "shellrent-sdk"
dynamic = ["version"]
description = "Official Python SDK for the Shellrent public API"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Shellrent S.r.l." }]
# Same as the generated code (openapi-python-client 0.29).
requires-python = ">=3.11"
keywords = ["shellrent", "api", "sdk", "client", "hosting", "domains", "openapi"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Internet :: WWW/HTTP",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Typing :: Typed",
]
# The dependencies of the generated code, with the same bounds.
dependencies = [
    "httpx>=0.23.1,<0.29.0",
    "attrs>=22.2.0",
]

[project.urls]
Homepage = "https://github.com/shellrent/shellrent-sdk-python"
Issues = "https://github.com/shellrent/shellrent-sdk-python/issues"
Changelog = "https://github.com/shellrent/shellrent-sdk-python/blob/main/CHANGELOG.md"

[project.scripts]
shellrent = "shellrent_sdk.cli:main"

[dependency-groups]
dev = [
    "mypy>=1.15",
    "pytest>=8.0",
    "ruff>=0.16",
]

[tool.hatch.version]
source = "vcs"

[tool.hatch.build.targets.wheel]
packages = ["src/shellrent_sdk"]

[tool.hatch.build.targets.sdist]
only-include = ["src", "tests", "CHANGELOG.md"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]
# Generated by bin/generate, which formats it with its own settings.
extend-exclude = ["src/shellrent_sdk/client"]

[tool.mypy]
strict = true
files = ["src", "tests"]
exclude = ["^src/shellrent_sdk/client/"]

[[tool.mypy.overrides]]
# Generated code: its types are used to check the rest, its own errors are not reported.
module = ["shellrent_sdk.client", "shellrent_sdk.client.*"]
ignore_errors = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["--strict-markers"]
xfail_strict = true
